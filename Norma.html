<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Configuration — Shared Configuration</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --nav:#B5730E; --nav-dk:#8A5608; --ink:#10182B; --ink-2:#45506B; --ink-3:#7C879E;
  --surface:#FFFFFF; --canvas:#F2F4F8; --canvas-2:#E9EDF4; --line:#DFE3EB; --line-2:#EEF1F6;
  --input:#7B3FE4; --input-bg:#F7F2FE; --calc:#45506B;
  --ok:#0E8A5F; --ok-bg:#E7F5EF; --warn:#C8791A; --warn-bg:#FDF4E7; --bad:#D0342C; --bad-bg:#FCEDEC;
  --r:8px; --r-sm:5px;
  --sh:0 1px 2px rgba(16,24,43,.05), 0 1px 3px rgba(16,24,43,.04);
  --sh-2:0 4px 16px rgba(16,24,43,.10);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans); background:var(--canvas); color:var(--ink); font-size:13.5px;}
.sp{flex:1}
.topnav{background:var(--surface); border-bottom:1px solid var(--line); min-height:56px; display:flex; align-items:center; padding:0 18px; gap:16px; position:sticky; top:0; z-index:50; box-shadow:var(--sh); flex-wrap:wrap;}
.tn-brand{display:flex; align-items:center; gap:9px; flex-shrink:0; padding:8px 0;}
.tn-mk{width:34px;height:34px;border-radius:8px;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex-shrink:0;}
.tn-brandtext{line-height:1.15}
.tn-name{font-weight:800; font-size:14.5px; color:var(--ink);}
.tn-sub{font-size:9px; letter-spacing:.08em; color:var(--ink-3); font-weight:700; text-transform:uppercase;}
.tn-links{display:flex; align-items:center; gap:2px; flex:1; overflow-x:auto; min-width:0;}
.tn-link{padding:7px 12px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--ink-2); text-decoration:none; white-space:nowrap; flex-shrink:0; display:inline-flex; align-items:center; gap:6px;}
.tn-link:hover{background:var(--canvas-2)}
.tn-link.on{background:var(--canvas-2); color:var(--ink); cursor:default;}
.tn-link .mk{width:16px;height:16px;border-radius:4px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:9px;flex-shrink:0;}
.tn-search{position:relative; flex-shrink:0;}
.tn-search .bx{display:flex; align-items:center; gap:6px; background:var(--canvas); border:1px solid var(--line); border-radius:7px; padding:6px 10px; width:190px;}
.tn-search input{border:none;background:transparent;outline:none;font-size:12.5px;flex:1;color:var(--ink); min-width:0;}
.tn-kbd{font-size:10px;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 5px;flex-shrink:0;}
.tn-results{position:absolute; top:calc(100% + 4px); left:0; width:260px; background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:var(--sh-2); z-index:60; max-height:320px; overflow-y:auto;}
.tn-results a{display:block; padding:8px 12px; text-decoration:none; color:var(--ink); font-size:12.5px; border-bottom:1px solid var(--line-2);}
.tn-results a:last-child{border-bottom:none}
.tn-results a:hover{background:var(--canvas-2)}
.tn-results .ty{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3); font-weight:700;}
.tn-results .none{padding:10px 12px; font-size:12px; color:var(--ink-3);}
.tn-acct{display:flex; align-items:center; gap:8px; flex-shrink:0; padding:8px 0;}
.tn-avatar{width:30px;height:30px;border-radius:50%;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;}
.tn-who{font-size:11.5px; line-height:1.3;}
.tn-who b{display:block; color:var(--ink); font-weight:700;}
.tn-who span{color:var(--ink-3);}
.tn-signout{font-size:10.5px; color:var(--ink-3); text-decoration:none;}
.tn-signout:hover{color:var(--ink)}
/* ---------- restored left-hand page nav (this tool's own pages) ---------- */
.wrap{display:flex; min-height:calc(100vh - 56px);}
.side{width:210px; background:var(--surface); border-right:1px solid var(--line); padding:10px 0; flex-shrink:0;}
.side h4{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); margin:14px 14px 6px;}
.navi{display:flex; align-items:center; gap:8px; padding:7px 14px; text-decoration:none; color:var(--ink-2); font-size:13px; border-left:3px solid transparent;}
.navi:hover{background:var(--canvas-2)}
.navi.on{background:var(--canvas-2);border-left-color:var(--nav);color:var(--ink);font-weight:700}
.navi .ix{width:16px; text-align:center; font-size:11px; color:var(--ink-3);}
.navi.on .ix{color:var(--nav)}
.main{flex:1; padding:18px 22px; max-width:none;}
.phead{display:flex; align-items:flex-start; gap:14px; margin-bottom:14px;}
.phead h1{font-size:19px; margin:0 0 3px;}
.phead p{margin:0; color:var(--ink-2); font-size:12.5px; max-width:680px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); margin-bottom:14px; box-shadow:var(--sh);}
.card h3{display:flex; align-items:center; gap:8px; margin:0; padding:11px 14px; border-bottom:1px solid var(--line-2); font-size:13.5px;}
.card .bd{padding:14px;}
.card .bd.flush{padding:0;}
.scroll{overflow-x:auto;}
.scroll.cap{max-height:520px; overflow-y:auto;}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; padding:8px 10px; background:var(--canvas); color:var(--ink-2); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.02em; position:sticky; top:0;}
td{padding:6px 10px; border-bottom:1px solid var(--line-2); vertical-align:middle;}
td.n,th.n{text-align:right;}
td.lb{font-weight:600;}
.empty{padding:18px; text-align:center; color:var(--ink-3); font-size:12.5px;}
.mini{font-size:11.5px; color:var(--ink-3);}
.row{display:flex; align-items:center; gap:6px;}
.btn{background:#fff; border:1px solid var(--line); border-radius:6px; padding:6px 11px; font-size:12.5px; cursor:pointer; color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; gap:5px;}
.btn:hover{background:var(--canvas-2)}
.btn.sm{padding:4px 9px; font-size:11.5px;}
.btn.pri{background:var(--nav);border-color:var(--nav);color:#fff}
.btn.pri:hover{background:var(--nav-dk)}
.btn.dgr{color:var(--bad); border-color:#F3C9C6;}
.btn.dgr:hover{background:var(--bad-bg)}
.pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:700; background:var(--canvas-2); color:var(--ink-2);}
.pill.ok{background:var(--ok-bg); color:var(--ok);}
.pill.warn{background:var(--warn-bg); color:var(--warn);}
.pill.n{background:var(--canvas-2); color:var(--ink-2);}
.pill.v{background:var(--input-bg); color:var(--input);}
/* Shared status (RAG) pill -- same semantic scale + class names as the other tools
   (2026-08-13). Norma is mostly config/admin, not much here that's naturally a RAG
   entity list -- applied to the one genuine two-state status (webhook enabled/disabled)
   for now. The bigger home for RAG in Norma is the Agent Activity dispatch dashboard
   (task #9, success/failure/pending per push) once that's built. */
.rag{display:inline-flex; align-items:center; gap:3px; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:700; white-space:nowrap;}
.rag-grey{background:#E7EAF0; color:#5B6472;}
.rag-blue{background:#E3E8FD; color:#1F3AC7;}
.rag-amber{background:#FBEBD3; color:#B5730E;}
.rag-red{background:#F8DEE0; color:#9C2B3C;}
.rag-green{background:#DCF3E9; color:#0E8A5F;}
.rag-exceed{color:#C9971A;}
.note{background:#FBF6EC;border-left:3px solid var(--nav);border-radius:0 var(--r-sm) var(--r-sm) 0; padding:10px 14px; margin-bottom:14px; font-size:12px; color:var(--ink-2);}
.in,input.in,select.in,.cel{border:1px solid #E1D3FA; border-radius:5px; padding:5px 7px; font-size:12.5px; background:var(--input-bg); color:var(--ink); font-family:inherit;}
.in:focus,.cel:focus{outline:2px solid var(--input); outline-offset:0;}
.cel.txt{width:100%;}
.cel.w{width:70px;}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 16px; border-radius:20px; font-size:12.5px; box-shadow:var(--sh-2); z-index:200; animation:fade .2s ease;}
@keyframes fade{from{opacity:0; transform:translateX(-50%) translateY(6px)} to{opacity:1; transform:translateX(-50%) translateY(0)}}
.dv{height:1px; background:var(--line-2); margin:12px 0;}
.lbl{font-size:11px; color:var(--ink-3); font-weight:700; text-transform:uppercase; letter-spacing:.02em;}
.mcard{border:1px solid var(--line); border-radius:var(--r); padding:14px; background:var(--surface);}
.mgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;}
code{background:var(--canvas-2); padding:1px 5px; border-radius:4px; font-size:12px;}
.authwrap{max-width:360px;margin:14vh auto;padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-2);}
.authwrap h2{margin:0 0 4px;font-size:18px;}
.authwrap p.sub{margin:0 0 20px;color:var(--ink-2);font-size:12.5px;}
.authwrap input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;margin-bottom:10px;box-sizing:border-box;}
.authwrap button{width:100%;padding:10px;border:none;border-radius:6px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;cursor:pointer;}
.authwrap .err{color:#B3261E;font-size:12px;margin:-4px 0 10px;min-height:14px;}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<div id="authGate" style="display:none"></div>
<div class="topnav" id="topnav">
  <div class="tn-brand"><span class="tn-mk">N</span><div class="tn-brandtext"><div class="tn-name">North</div><div class="tn-sub">v0.20</div></div></div>
  <nav class="tn-links" id="tnLinks"></nav>
  <div class="tn-search">
    <div class="bx"><input id="tnSearchInput" placeholder="Search modules..." oninput="tnSearch(this.value)" onkeydown="tnSearchKey(event)"><span class="tn-kbd">/</span></div>
    <div id="tnResults"></div>
  </div>
  <div class="tn-acct" id="tnAcct"></div>
  <script>document.addEventListener('click',function(e){var r=document.getElementById('tnResults');if(r&&!e.target.closest('.tn-search'))r.innerHTML='';});</script>
</div>
<div class="wrap" id="wrap">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>
<div id="layer"></div>
<script>
/* ============================================================================
   NORMA — the independent configuration hub for the whole toolset.
   "Norma" is Latin for a standard, rule, or pattern -- fitting for the one place that owns
   the fields genuinely shared across modules (cost buckets, the tracking ID naming
   convention, LLM provider settings), while each module (Ordo, Cursus, Eventus, Custodia,
   and eventually CRM) keeps its own module-specific configuration.
   Like the Ordo<->Cursus bridge, this is a JSON export/import relationship, not a live link --
   there is no server, so Norma can't push to anything. Each module imports a Norma export
   on its own Sync/Admin page when it wants the latest shared config.

   Supabase note: cost_buckets, org_settings (incl. the new campaign-naming-convention
   fields), llm_providers and audit_log now live in the same shared database every other
   migrated module uses. The export/import bridge below is left in place as a manual
   fallback but is no longer the primary path. trackingConfig (the older generic
   {mod}-{type}-{seq} module-tracking-ref scheme, still used by Cursus's activity refs)
   stays local/static for now — out of scope for this pass.
   ============================================================================ */
const SUPABASE_URL = 'https://rcmocuubeajnqjltuwdv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjbW9jdXViZWFqbnFqbHR1d2R2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTgzNTQsImV4cCI6MjEwMTg5NDM1NH0.rZuoKPmmkpNe8Ug8Gu_KmpoKyibigJccdpoRGcLt3pY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* real UUIDs now — every DB primary key is uuid type. Prefix arg kept for call-site
   compatibility (uid('cb'), uid('llm') etc still work) but no longer affects the id itself. */
const uid = _p => crypto.randomUUID();
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = (a,id) => a.find(x=>x.id===id);
const F = {
  dt:iso=>{ if(!iso)return '—'; return new Date(iso).toLocaleString('en-AU',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
};

/* ---------- campaign naming-convention engine ----------
   Implements the pattern Stef specced: {fy}{period}{pod}-{seq}_{descriptor}
   e.g. 26Q1ANZ-1234_Syndication = FY26, Q1, ANZ pod, seq 1234, "Syndication".
   This is the reference implementation shown live on the Campaign naming page below —
   Cursus's campaign creation wizard calls an identical copy of these two functions
   (self-contained files, no shared module system, same duplication pattern as F/esc/byId
   across every tool in this suite). fy/period are computed from a date + the org's
   fy_start_month (already stored on org_settings, owned by Ordo's FY selector). */
function fyPeriodFromDate(dateStr, fyStartMonth, periodType){
  if(!dateStr) return {fy:'',period:''};
  const d=new Date(dateStr+'T00:00:00'); const m=d.getMonth()+1, y=d.getFullYear();
  const fsm=fyStartMonth||1;
  let offset=m-fsm; if(offset<0) offset+=12;
  /* only roll to next calendar year when the FY genuinely crosses one (fsm>1) — a
     January-start FY is just the calendar year and never rolls. */
  const fyYear=(fsm>1 && m>=fsm)?y+1:y;
  const fy=String(fyYear).slice(-2);
  if(periodType==='Half') return {fy, period:'H'+(offset<6?1:2)};
  return {fy, period:'Q'+(Math.floor(offset/3)+1)};
}
function podCodeFromRegion(region){
  if(!region) return 'GEN';
  return (region.code||region.name||'GEN').toString().slice(0,3).toUpperCase();
}
/* pure — does not mutate counters; caller persists the returned counters back to
   org_settings.campaign_naming_seq_counters after using the ref, so a preview call
   (e.g. typing in a form before saving) never burns a sequence number. */
function buildCampaignTrackingRef(orgSettings, campaign, region, descriptor){
  const {fy,period}=fyPeriodFromDate(campaign.start, orgSettings.fyStartMonth, campaign.periodType||'Quarter');
  const pod=podCodeFromRegion(region);
  const scope=orgSettings.campaignNamingSeqScope||'pod';
  const key=scope==='global'?'ALL':scope==='year'?fy:(pod+'-'+fy);
  const counters=Object.assign({},orgSettings.campaignNamingSeqCounters||{});
  const seq=(counters[key]||0)+1;
  counters[key]=seq;
  const pattern=orgSettings.campaignNamingPattern||'{fy}{period}{pod}-{seq}_{descriptor}';
  const ref=pattern.replace('{fy}',fy).replace('{period}',period).replace('{pod}',pod)
    .replace('{seq}',String(seq)).replace('{descriptor}',(descriptor||'').replace(/\s+/g,''));
  return {ref, counters, key};
}

const CFG = {
  meta:{ lastExportAt:null, configVersion:1 },
  /* static directory, not DB-backed -- mirrors index.html's card list. */
  modules:[
    {id:'ordo',    name:'Ordo',    file:'Ordo.html',    status:'Built',    description:'Funnel planning, forecasting and top-line reporting.'},
    {id:'cursus',  name:'Cursus',  file:'Cursus.html',  status:'Built',    description:'Programme, campaign and activity execution detail.'},
    {id:'eventus', name:'Eventus', file:'Eventus.html', status:'Built',    description:'Event planning, logistics and cost tracking.'},
    {id:'custodia',name:'Custodia',file:'Custodia.html',status:'Built',    description:'Physical, digital and swag asset register.'},
    {id:'prospectus',name:'Prospectus',file:'Prospectus.html',status:'Built',description:'ICP filters, target lists and opportunity-sizing reports.'},
    {id:'schema',  name:'Schema',  file:'Schema.html',  status:'Built',    description:'Process mapping and workflow diagrams.'},
    {id:'augur',   name:'Augur',   file:'Augur.html',   status:'Built',    description:'Lead and deal scoring, weighted pipeline forecast.'},
    {id:'crm',     name:'CRM',     file:null,           status:'Planned last',description:'Customer relationship management — likely built on WorkSeeker as a base. Not started.'}
  ],
  /* local/static for now, not persisted -- the older generic {mod}-{type}-{seq} scheme
     Cursus's activity tracking refs already use. Out of scope for this pass; see the new
     Campaign naming page for the real, DB-backed naming convention. */
  trackingConfig:{
    pattern:'{mod}-{type}-{seq}',
    seqPadding:4,
    modCodes:{ ordo:'ORD', cursus:'CUR', eventus:'EVT', custodia:'AST', prospectus:'PRO', schema:'SCH', augur:'AUG', crm:'CRM' },
    typeCodes:{ campaign:'CAM', activity:'ACT', event:'EVT', asset:'AST', task:'TSK', filter:'FLT', report:'RPT', lead:'LED' }
  },
  /* everything below is Supabase-backed now -- populated by loadFromSupabase(). */
  costBuckets:[],
  llmProviders:[],
  integrations:{ webhookUrl:'', webhookEnabled:false },
  campaignNaming:{ fyStartMonth:1, seqScope:'pod', pattern:'{fy}{period}{pod}-{seq}_{descriptor}', seqCounters:{} },
  audit:[]
};

const UI = { page:'home' };

function logAudit(what,detail){
  CFG.audit.unshift({ts:new Date().toISOString().slice(0,16).replace('T',' '),what:what,detail:detail});
  if(CFG.audit.length>100)CFG.audit.pop();
}
function toast(msg){
  const l=document.getElementById('layer');
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  l.appendChild(d); setTimeout(()=>d.remove(),2200);
}
function go(page){ UI.page=page; render(); }
window.go=go;
/* bumped on every edit to costBuckets/trackingConfig/llmProviders -- the number a consuming
   module's Sync page compares its own "synced at version N" against, so a stale sync is
   visible instead of silent. */
function bumpConfigVersion(){ CFG.meta.configVersion=(CFG.meta.configVersion||0)+1; }
function setIn(field,id,key,val){
  const row=byId(CFG[field],id); if(!row)return;
  row[key]=val; bumpConfigVersion(); logAudit('edit',field+'.'+key); render();
}
window.setIn=setIn;
function setPath(path,val){
  const parts=path.split('.'); let o=CFG;
  for(let i=0;i<parts.length-1;i++) o=o[parts[i]];
  o[parts[parts.length-1]]=val;
  bumpConfigVersion(); logAudit('edit',path); render();
}
window.setPath=setPath;

/* ---------- local autosave (survives a refresh/close; export/import is still the
   portable, cross-tool bridge) ---------- */
const LS_KEY='norma_autosave_v1';
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(CFG)); }catch(e){} }
function loadLocal(){
  try{
    const raw=localStorage.getItem(LS_KEY); if(!raw) return false;
    const parsed=JSON.parse(raw);
    Object.keys(parsed).forEach(k=>{ CFG[k]=parsed[k]; });
    return true;
  }catch(e){ return false; }
}
function clearLocal(){
  localStorage.removeItem(LS_KEY);
  toast('Local autosave cleared — reload the page to reset to the built-in defaults.');
}
window.clearLocal=clearLocal;

/* ============================================================================
   Supabase data layer — whole-plan load/save, same pattern as Ordo/Cursus.
   Norma owns cost_buckets (shared/read-write by every module), llm_providers (config
   only, no live calls), and the campaign-naming fields on org_settings.
   ============================================================================ */
let _orgId = null, _myProfile = null, _saveTimer = null, _realtimeChannel = null;
/* Set right before an internal (non-user-initiated) signOut() -- e.g. bootApp()'s error path
   below -- so the global onAuthStateChange listener knows to skip its reload-on-SIGNED_OUT and
   let the error message stay on screen instead of wiping it out immediately. Without this, the
   error flashes for a frame and then vanishes, which is exactly the "flash and it's gone" bug. */
let _skipNextSignOutReload = false;

async function upsertRows(table, rows, mapFn){
  if(!rows || !rows.length) return;
  try{
    const payload = rows.map(r=>Object.assign(mapFn(r), {org_id:_orgId}));
    const { error } = await sb.from(table).upsert(payload);
    if(error) throw error;
  }catch(e){ console.error('Save failed for '+table, e); toast('Could not save '+table+' to the database — see console.'); }
}

/* Fire-and-forget real delete, paired with upsertRows above. Called immediately after the
   local CFG array filter in every remove*() function so the UI stays instant while the row
   actually leaves the database (previously these were UPSERT-only, so removed rows silently
   reappeared on next load). Note: removeUserFromOrg already does a direct sb.from('profiles')
   .delete() of its own -- profiles aren't upserted from CFG the way these three tables are,
   so it doesn't use this helper. */
async function deleteRow(table, id){
  if(!_orgId || !id) return;
  try{
    const { error } = await sb.from(table).delete().eq('id', id).eq('org_id', _orgId);
    if(error) throw error;
  }catch(e){ console.error('Delete failed for '+table, e); toast('Removed here, but could not delete from the database — see console.'); }
}

async function saveToSupabase(){
  if(!_orgId) return;
  await Promise.all([
    upsertRows('cost_buckets', CFG.costBuckets, c=>({id:c.id,code:c.code,label:c.label,dept:c.dept||'Marketing',ext_code:c.extCode||''})),
    upsertRows('llm_providers', CFG.llmProviders, p=>({id:p.id,name:p.name,kind:p.kind,endpoint:p.endpoint||'',key_label:p.keyLabel||'',enabled:!!p.enabled})),
    upsertRows('audit_log', CFG.audit, a=>({ts:a.ts,what:a.what,detail:a.detail,user_id:_myProfile?_myProfile.id:null})),
    upsertRows('teams', CFG.teams, t=>({id:t.id,name:t.name||'',member_ids:t.memberIds||[]})),
    (async()=>{
      const row = {
        org_id:_orgId, webhook_url:CFG.integrations.webhookUrl||'', webhook_enabled:!!CFG.integrations.webhookEnabled,
        fy_start_month:CFG.campaignNaming.fyStartMonth||1,

/* Live notifications: subscribe to audit_log INSERTs for this org so an action
   taken in another tab/tool shows up here as a toast without a reload. Own
   actions are skipped (via user_id) since they're already toasted locally.
   This is notification-only -- it does NOT live-sync the underlying record
   (a campaign, a deal, etc); reload or navigate to see that reflected in place. */
function subscribeRealtime(){
  if(_realtimeChannel || !_orgId) return;
  _realtimeChannel = sb.channel('audit_log_org_'+_orgId)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'audit_log', filter:'org_id=eq.'+_orgId }, payload=>{
      const row = payload.new || {};
      if(_myProfile && row.user_id && row.user_id===_myProfile.id) return;
      /* phase18: a targeted alert_people row carries a resolved target_user_ids list --
         only toast a viewer whose own id is in it. Absent/empty (almost every row, and
         any 'org'-targeted alert) keeps the original broadcast-to-everyone behaviour. The
         row still joins the shared audit trail either way -- only the live toast is gated. */
      const targeted = Array.isArray(row.target_user_ids) && row.target_user_ids.length>0;
      const forMe = !targeted || (_myProfile && row.target_user_ids.includes(_myProfile.id));
      if(forMe) toast((row.what||'Update')+(row.detail?' — '+row.detail:''));
      if(CFG.audit){ CFG.audit.unshift({ts:row.ts,what:row.what,detail:row.detail}); if(CFG.audit.length>150) CFG.audit.pop(); }
      render();
    })
    .subscribe();
}

}

function exportSharedConfig(){

      <td><button class="btn sm" ${dis} onclick="toggleRoleFlag('${r.id}','publish','publish')">
        <span class="pill ${r.publish?'ok':'n'}">${r.publish?'Yes':'No'}</span></button></td>
      <td><button class="btn sm" ${dis} onclick="toggleRoleFlag('${r.id}','writeAll','write_all')">
        <span class="pill ${r.writeAll?'ok':'n'}">${r.writeAll?'Yes':'No'}</span></button></td>
      <td><span class="pill n">${esc(r.scope)}</span></td>
      <td><button class="btn sm" ${dis} onclick="toggleRoleFlag('${r.id}','requireCommitOnEdit','require_commit_on_edit')">
        <span class="pill ${r.requireCommitOnEdit?'ok':'n'}">${r.requireCommitOnEdit?'Yes':'No'}</span></button></td>
      <td><button class="btn sm" ${dis} onclick="toggleRoleFlag('${r.id}','allowExpertMode','allow_expert_mode')">
        <span class="pill ${r.allowExpertMode?'ok':'n'}">${r.allowExpertMode?'Yes':'No'}</span></button></td>
      <td class="n" style="white-space:nowrap">
        <button class="btn sm" ${dis} onclick="cloneRole('${r.id}')">Clone</button>
        ${r.isSystem?'':`<button class="btn sm dgr" ${dis} onclick="deleteRoleRow('${r.id}')">Delete</button>`}
      </td>
      </tr>`).join('')}
    </tbody></table></div>
    <div class="bd" style="padding-top:0"><p class="mini"><b>Configure</b> lets someone edit these shared settings and
      manage users. <b>Requires commit on plan edits</b> is specific to Ordo/Cursus — queues that role's budget/date/actuals
      edits for confirmation instead of applying immediately. <b>Expert mode allowed</b> controls whether this role can
      switch Cursus out of Simple mode — off by default only if you turn it off; everyone can use Expert mode until you do.</p></div></div>`;

  h+=`<div class="card"><h3>Users</h3>
    <div class="bd flush"><table><thead><tr><th>Name</th><th>Email</th>${sa?'<th>Organization</th>':''}<th>Role</th>
      <th>Cross-region visibility</th><th>Regions when isolated</th><th></th></tr></thead><tbody>
    ${CFG.users.slice().sort((a,b)=>(orgName(a.orgId)).localeCompare(orgName(b.orgId))).map(u=>{
      const orgRegions = CFG.regions.filter(r=>r.orgId===u.orgId);
      return `<tr><td class="lb">${esc(u.name)}</td><td class="mini">${esc(u.email||'—')}</td>
      ${sa?`<td class="mini"><select class="cel txt" style="width:150px" onchange="setUserOrg('${u.id}',this.value)">
        ${(CFG.allOrganizations||[]).map(o=>`<option value="${o.id}" ${o.id===u.orgId?'selected':''}>${esc(o.name)}</option>`).join('')}
        </select>${u.orgId===_orgId?' <span class="tag">yours</span>':''}</td>`:''}
      <td><select class="cel txt" style="width:130px" ${dis} onchange="setUserRole('${u.id}',this.value)">
        ${!u.roleId?'<option value="" selected disabled>— choose a role —</option>':''}
        ${CFG.roles.filter(x=>x.orgId===u.orgId).map(x=>`<option value="${x.id}" ${x.id===u.roleId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></td>
      <td><button class="btn sm" ${dis} onclick="setUserCrossRegion('${u.id}')">
        <span class="pill ${u.crossRegion?'ok':'warn'}">${u.crossRegion?'Transparent':'Isolated'}</span></button></td>
      <td class="mini">${u.crossRegion?'<span class="pill n">sees all — n/a</span>':(orgRegions.length?orgRegions.map(r=>
        `<label style="margin-right:8px"><input type="checkbox" class="regbox-${u.id}" value="${r.id}" ${u.regionIds.includes(r.id)?'checked':''} ${dis} onchange="setUserRegions('${u.id}')"> ${esc(r.name)}</label>`
      ).join(''):'<span class="pill n">no regions in this org</span>')}</td>
      <td class="n">${u.id===(_myProfile||{}).id?'<span class="mini">you</span>':`<button class="btn sm dgr" ${dis} onclick="removeUserFromOrg('${u.id}')">Remove</button>`}</td>
      </tr>`;
    }).join('')}
    </tbody></table></div>
    <div class="bd" style="padding-top:0"><p class="mini">"Transparent" sees every region in the organization.
      "Isolated" sees only the regions checked here — check none and they'll see nothing region-scoped until you assign some.</p></div></div>`;

  h+=`<div class="card"><h3>Teams <span class="sp"></span>
    <button class="btn sm pri" ${dis} onclick="addTeam()">Add team</button></h3>
    <div class="bd"><p class="mini" style="margin:0 0 9px">Named groups of people, for targeting an "Alert people" automation
      in Schema at exactly who needs it instead of a whole region or the whole org. Editable here; used there.</p>
    ${!CFG.teams.length?`<p class="empty">No teams yet.</p>`:CFG.teams.map(t=>{
      const orgUsers=CFG.users.filter(u=>u.orgId===_orgId);
      return `<div class="note" style="margin-bottom:10px">
        <div class="row" style="justify-content:space-between;align-items:center">
          <input class="cel txt" style="width:200px;font-weight:600" value="${esc(t.name)}" ${dis} onchange="renameTeam('${t.id}',this.value)">
          <span class="pill n">${(t.memberIds||[]).length} member${(t.memberIds||[]).length===1?'':'s'}</span>
          <button class="btn sm dgr" ${dis} onclick="removeTeam('${t.id}')">Remove</button>
        </div>
        <div style="margin-top:8px">${orgUsers.map(u=>
          `<label style="margin-right:12px;display:inline-block;margin-bottom:4px"><input type="checkbox" ${(t.memberIds||[]).includes(u.id)?'checked':''} ${dis} onchange="toggleTeamMember('${t.id}','${u.id}')"> ${esc(u.name)}</label>`
        ).join('')}</div>
      </div>`;
    }).join('')}
    </div></div>`;

  h+=`<div class="card"><h3>Invite a new teammate</h3>
    <div class="bd"><p class="mini" style="margin:0 0 9px">Generates a one-time code, valid 14 days. Send it to them —
      they sign up with their own email/password on any tool's login screen, choose "I have an invite code", and land
      in the organization with the role you set here.</p>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      ${sa?`<select id="invOrg" class="cel txt" style="width:160px">
        ${(CFG.allOrganizations||[]).map(o=>`<option value="${o.id}" ${o.id===_orgId?'selected':''}>${esc(o.name)}</option>`).join('')}
      </select>`:''}
      <select id="invRole" class="cel txt" style="width:160px" ${dis}>
        ${CFG.roles.map(x=>`<option value="${x.id}">${esc(x.name)}${sa?' — '+esc(orgName(x.orgId)):''}</option>`).join('')}
      </select>
      <label class="mini"><input type="checkbox" id="invCross" ${dis}> Cross-region visibility</label>
      <button class="btn sm pri" ${dis} onclick="generateInvite()">Generate invite code</button>
    </div>
    ${UI.lastInviteCode?`<div class="note" style="margin-top:10px"><strong>Code: <span style="font-size:15px;letter-spacing:1px">${esc(UI.lastInviteCode)}</span></strong>
      <button class="btn sm" onclick="copyInviteCode('${esc(UI.lastInviteCode)}')">Copy</button></div>`:''}
    </div>
    <div class="bd flush" style="padding-top:0"><table><thead><tr><th>Code</th><th>Role</th>
      ${sa?'<th>Organization</th>':''}<th>Created</th><th>Expires</th><th>Status</th><th>Redeemed by</th></tr></thead><tbody>
    ${CFG.orgInvites.length?CFG.orgInvites.map(i=>{
      const r=byId(CFG.roles,i.role_id);
      const status=i.used_at?'<span class="pill ok">Used</span>':(new Date(i.expires_at)<new Date()?'<span class="pill bad">Expired</span>':'<span class="pill n">Open</span>');
      const redeemedBy=i.used_by?(byId(CFG.users,i.used_by)||{}).name||'—':'—';
      return `<tr><td class="lb">${esc(i.code)}</td><td>${esc(r?r.name:'—')}</td>
        ${sa?`<td class="mini">${esc(orgName(i.org_id))}</td>`:''}
        <td class="mini">${esc((i.created_at||'').slice(0,10))}</td><td class="mini">${esc((i.expires_at||'').slice(0,10))}</td>
        <td>${status}</td><td class="mini">${esc(redeemedBy)}</td></tr>`;
    }).join(''):`<tr><td colspan="${sa?7:6}" class="empty">No invites generated yet.</td></tr>`}
    </tbody></table></div></div>`;

  if(sa){
    h+=`<div class="card"><h3>All organizations <span class="sp"></span><span class="pill v">Super Admin view</span>
      <button class="btn sm pri" style="margin-left:8px" onclick="createOrgAsSuperAdmin()">Add organization</button></h3>
      <div class="bd flush"><table><thead><tr><th>Organization</th><th class="n">Users</th><th class="n">Created</th></tr></thead><tbody>
      ${(CFG.allOrganizations||[]).map(o=>`<tr><td class="lb">${esc(o.name)}${o.id===_orgId?' <span class="tag">yours</span>':''}</td>
        <td class="n calc">${CFG.users.filter(u=>u.orgId===o.id).length}</td>
        <td class="n mini">${esc((o.created_at||'').slice(0,10))}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="bd" style="padding-top:0"><p class="mini">Full cross-org data management (working inside another
        organization's plan from here) isn't built yet — this covers visibility, roles, users and invites only.
        New organizations start with no regions, pods, or campaigns — their own Org Admin sets those up in Ordo,
        the same way Beta Testing did.</p></div></div>`;
  }
  return h;
}

const PAGES=[
  {id:'home',       ix:'0', label:'Home',            fn:pageHome},
  {id:'overview',   ix:'1', label:'Overview',        fn:pageOverview},
  {id:'users',      ix:'2', label:'Roles & users',   fn:pageUsers},
  {id:'buckets',    ix:'3', label:'Cost buckets',    fn:pageCostBuckets},
  {id:'tracking',   ix:'4', label:'Tracking IDs',    fn:pageTracking},
  {id:'campnaming', ix:'5', label:'Campaign naming', fn:pageCampaignNaming},
  {id:'llm',        ix:'6', label:'LLM providers',   fn:pageLLM},
  {id:'integrations',ix:'7',label:'Integrations',    fn:pageIntegrations},
  {id:'agentactivity',ix:'8',label:'Agent activity',  fn:pageAgentActivity},
  {id:'sync',       ix:'9', label:'Export',          fn:pageSync}
];

function renderSide(){
  let h='<h4>Shared configuration</h4>';
  PAGES.forEach(p=>{
    const locked = p.id==='users'&&!canConfig();
    h+=`<a class="navi ${UI.page===p.id?'on':''}" href="#" onclick="go('${p.id}');return false">
      <span class="ix">${p.ix}</span><span>${p.label}</span>${locked?'<span class="lk">read only</span>':''}</a>`;
  });
  return h;
}
function renderTnAcct(){
  const nm=_myProfile?_myProfile.name:'';
  const initials=nm?nm.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase():'?';
  const r=(CFG.roles||[]).find(x=>x.id===(_myProfile||{}).role_id);
  const roleLabel=CFG.isSuperAdmin?'Super Admin':(r?r.name:'');
  return `<span class="tn-avatar">${esc(initials)}</span>
    <div class="tn-who"><b>${esc(nm||'—')}</b><span>${esc(roleLabel)}</span></div>
    <a class="tn-signout" href="#" onclick="doSignOut();return false;">Sign out</a>`;
}
/* Consistent cross-module bar: search jumps between the 8 tools, same list
   and behavior as every other file -- not this tool's own pages/buckets/modules. */
const MODULES=[
  {id:'Ordo',label:'Strategy',desc:'Funnel planning & forecasting',color:'#1F3AC7',icon:'St'},
  {id:'Cursus',label:'Campaign Planning',desc:'Campaign & activity execution',color:'#0E7C6B',icon:'Ca'},
  {id:'Eventus',label:'Events',desc:'Event planning & logistics',color:'#B5480E',icon:'Ev'},
  {id:'Custodia',label:'Assets',desc:'Asset register',color:'#3B6E1F',icon:'As'},
  {id:'Prospectus',label:'Targets',desc:'ICP filters & opportunity reports',color:'#9C2B3C',icon:'Ta'},
  {id:'Augur',label:'Scoring',desc:'Lead & deal scoring',color:'#5A3E9C',icon:'Sc'},
  {id:'Schema',label:'Process Maps',desc:'Process maps & workflows',color:'#3A5A8C',icon:'Pr'},
  {id:'Norma',label:'Configuration',desc:'Shared configuration',color:'#B5730E',icon:'Co'}
];
const THIS_MODULE='Norma';
function renderTnModuleLinks(){
  return MODULES.map(m=>m.id===THIS_MODULE
    ? `<span class="tn-link on"><span class="mk" style="background:${m.color}">${m.icon}</span>${m.label}</span>`
    : `<a class="tn-link" href="${m.id}.html" target="tool_${m.id}"><span class="mk" style="background:${m.color}">${m.icon}</span>${m.label}</a>`
  ).join('');
}
function tnSearchResults(q){
  q=(q||'').trim().toLowerCase(); if(!q) return [];
  return MODULES.filter(m=>m.label.toLowerCase().includes(q)||m.desc.toLowerCase().includes(q)).slice(0,8);
}
let _tnResultList=[];
function tnSearch(q){
  _tnResultList=tnSearchResults(q);
  const box=document.getElementById('tnResults');
  if(!q||!q.trim()){ box.innerHTML=''; return; }
  box.innerHTML = `<div class="tn-results">${
    _tnResultList.length ? _tnResultList.map((m,i)=>`<a href="#" onclick="tnPick(${i});return false"><span class="ty">Module</span><div>${esc(m.label)}</div></a>`).join('')
    : '<div class="none">No matches.</div>'
  }</div>`;
}
window.tnSearch=tnSearch;
function tnPick(i){
  const m=_tnResultList[i]; if(!m) return;
  window.open(m.id+'.html','tool_'+m.id);
  document.getElementById('tnResults').innerHTML='';
  document.getElementById('tnSearchInput').value='';
}
window.tnPick=tnPick;
function tnSearchKey(ev){
  if(ev.key==='Enter' && _tnResultList.length){ tnPick(0); }
  if(ev.key==='Escape'){ document.getElementById('tnResults').innerHTML=''; ev.target.blur(); }
}
window.tnSearchKey=tnSearchKey;
function render(){
  const p=PAGES.find(x=>x.id===UI.page)||PAGES[0];
  document.getElementById('side').innerHTML=renderSide();
  document.getElementById('tnLinks').innerHTML=renderTnModuleLinks();
  document.getElementById('tnAcct').innerHTML=renderTnAcct();
  document.getElementById('main').innerHTML=p.fn();
  saveLocal();
  scheduleSupabaseSave();
}
sb.auth.onAuthStateChange((event)=>{
  if(event==='SIGNED_OUT'){
    if(_skipNextSignOutReload){ _skipNextSignOutReload=false; return; }
    location.reload();
  }
});
bootApp();
</script>
</body>
