        <td>${esc(a?a.name:'—')}</td><td><span class="pill n">${esc(b?b.label:'—')}</span></td>
        <td><span class="pill n">${esc(s?s.name:'—')}</span></td>
        <td>${esc(r?r.name:'—')}</td>
        <td class="mini">${F.d(c.start)} → ${F.d(c.end)}</td>
        <td class="n calc">${days||'—'}</td>
        <td class="n calc">${c.budget?F.mk(c.budget):'—'}</td>
        <td class="n calc">${cCommitted?F.mk(cCommitted):'—'}</td>
        <td class="n calc">${cActual?F.mk(cActual):'—'}</td>
        <td class="n" style="color:${varAmt>0?'var(--bad)':varAmt<0?'var(--ok)':'var(--ink-3)'}">${cActual?F.mk(varAmt):'—'}</td>
        <td class="n">${c.convOverride!=null?`<span class="pill v">${F.p(rate,1)}</span>`:F.p(rate,1)}</td>
        <td class="n calc">${wins?F.n(wins,1):'—'}</td>
        <td class="n calc">${wins?F.mk(c.budget/wins):'—'}</td>
        <td><span class="pill ${c.source==='Feed'?'n':'v'}">${esc(c.source)}</span></td>
        <td><a class="btn sm" href="Cursus.html#campaign=${c.id}" target="tool_Cursus">Open →</a></td></tr>`;}).join('')}
    <tr class="tot"><td>Total</td><td></td><td></td><td></td><td></td><td></td><td></td><td class="n"></td>
      <td class="n">${F.mk(budget)}</td><td class="n">${F.mk(committed)}</td><td class="n">${F.mk(actualSpend)}</td>
      <td class="n">${F.mk(actualSpend-budget)}</td><td class="n"></td><td class="n"></td><td class="n"></td><td></td><td></td></tr>
    </tbody></table></div></div></div>`;
  h+=`<div class="card"><h3>Spend by cost bucket</h3><div class="bd">
    ${svgBars(CFG.costBuckets.map(b=>({k:b.code,v:sum(camps.filter(cm=>cm.costBucketId===b.id).map(cm=>campaignActualSpend(cm)||campaignCommitted(cm)))})).filter(r=>r.v>0),{h:200,money:true})}
    <div class="mini" style="margin-top:6px">Actual where posted, otherwise committed — pulled from a Campaign Planning roll-up import where one exists, otherwise the campaign's own fields. Buckets with no spend in scope are hidden.</div>
  </div></div>`;
  {
    const bizSel=byId(camps,UI.bizCampaignId)||camps[0];
    if(bizSel){
      UI.bizCampaignId=bizSel.id;
      const a=act(bizSel.activityId), leads=(a&&a.costPer)?bizSel.budget/a.costPer:0;
      const rate=campExitRate(bizSel,m), proj=backward(leads*rate,m);
      h+=`<div class="card"><h3>Business case <span class="sp"></span>
        <select class="in" style="width:auto" onchange="UI.bizCampaignId=this.value;render()">
          ${camps.map(cm=>`<option value="${cm.id}" ${cm.id===bizSel.id?'selected':''}>${esc(cm.name)}</option>`).join('')}</select></h3>
        <div class="bd">
          <div class="kpis">
            <div class="kpi"><div class="k">Budget</div><div class="kpi-v">${F.mk(bizSel.budget)}</div><div class="sub">${esc(a?a.name:'—')} at ${a&&a.costPer?F.m(a.costPer):'—'}/lead</div></div>
            <div class="kpi"><div class="k">Implied ${esc(entryGate().name)}</div><div class="kpi-v">${F.n(leads,0)}</div><div class="sub">budget ÷ cost per lead</div></div>
            <div class="kpi"><div class="k">Conversion rate</div><div class="kpi-v">${F.p(rate,1)}</div><div class="sub">${bizSel.convOverride!=null?'manual / benchmark':'auto'}</div></div>
            <div class="kpi hl"><div class="k">Projected ${esc(exitGate().name)}</div><div class="kpi-v">${F.n(proj[exitGate().id],1)}</div><div class="sub">at ${F.p(rate,1)} blended</div></div>
          </div>
          <div class="dv"></div>
          <div class="scroll"><table><thead><tr>${gTh()}</tr></thead><tbody><tr>${gTd(proj)}</tr></tbody></table></div>
          <div class="mini" style="margin-top:6px"><b>Business case:</b> budget ${F.mk(bizSel.budget)} &rarr; ${F.n(leads,0)} ${esc(entryGate().name)}
            at ${a&&a.costPer?F.m(a.costPer):'—'}/lead &rarr; ${F.n(proj[exitGate().id],1)} projected ${esc(exitGate().name)}, using this
            campaign's own conversion rate (set above in Campaigns in scope, or in Admin &gt; Campaigns).</div>
        </div></div>`;
      {
        const preStages=activityPreChain(bizSel.activityId);
        if(preStages.length){
          const preVols=preChainVolumes(bizSel.activityId,leads);
          h+=`<div class="card"><h3>Pre-${esc(entryGate().name)} chain <span class="sp"></span>
              <span class="mini">${esc(a.name)} — channel-specific, feeds into ${esc(entryGate().name)} above</span></h3>
            <div class="bd">
              <div class="scroll"><table><thead><tr>${preStages.map(s=>`<th class="n">${esc(s.name)}</th>`).join('')}
                <th class="n hl">${esc(entryGate().name)}</th></tr></thead><tbody><tr>
                ${preStages.map(s=>`<td class="n calc">${preVols[s.id]!=null?F.n(preVols[s.id],0):'—'}</td>`).join('')}
                <td class="n calc" style="font-weight:700">${F.n(leads,0)}</td></tr></tbody></table></div>
              <div class="mini" style="margin-top:6px">Walked backward from this campaign's implied ${esc(entryGate().name).toLowerCase()} count through
                ${esc(a.name)}'s own stage rates (Admin &gt; Activities). A rate of 0% on any stage stops the chain there rather than
                showing a false number.</div>
            </div></div>`;
        }
      }
      {
        const allocs=podAllocationsFor(bizSel.id);
        const shareTotal=campaignPodShareTotal(bizSel.id);
        const shareOk=Math.abs(shareTotal-1)<0.0001;
        h+=`<div class="card"><h3>Pod allocation <span class="sp"></span>
            <span class="mini">same campaign as Business case above — ${esc(bizSel.name)}</span></h3>
          <div class="bd">
            <p class="mini">Optional: split this campaign's budget and implied ${esc(entryGate().name).toLowerCase()} across specific
              pods by percentage, instead of it only belonging to one region. Reporting only — this doesn't change how
              pod quotas themselves are set elsewhere in Strategy.</p>
            ${!allocs.length?`<div class="empty" style="padding:10px 0">Not split — the full budget stays attributed to
              ${esc(region(bizSel.regionId)?region(bizSel.regionId).name:'its region')} only.</div>`:`
            <div class="scroll"><table><thead><tr><th>Pod</th><th class="n">Share</th><th class="n">Budget</th>
              <th class="n">Implied ${esc(entryGate().name)}</th><th></th></tr></thead><tbody>
              ${allocs.map(al=>{
                return `<tr><td><select class="cel txt" style="width:160px" onchange="setIn('campaignPodAllocations','${al.id}','podId',this.value)">
                    ${P().map(pp=>`<option value="${pp.id}" ${pp.id===al.podId?'selected':''}>${esc(pp.name)}</option>`).join('')}</select></td>
                  <td class="n"><input class="cel w" value="${(al.sharePct*100).toFixed(0)}" onchange="setIn('campaignPodAllocations','${al.id}','sharePct',this.value,'pct')"></td>
                  <td class="n calc">${F.mk(bizSel.budget*al.sharePct)}</td>
                  <td class="n calc">${F.n(leads*al.sharePct,0)}</td>
                  <td class="n"><button class="btn sm dgr" onclick="removePodAllocation('${al.id}')">Remove</button></td></tr>`;
              }).join('')}
            </tbody></table></div>
            <div class="note" style="margin-top:8px;${shareOk?'':'border-color:var(--warn);background:var(--warn-bg)'}">
              Shares total ${F.p(shareTotal,0)}${shareOk?'':' — doesn\'t add to 100%, so the budget/leads split above won\'t account for the whole campaign'}.</div>`}
            <button class="btn sm pri" style="margin-top:8px" onclick="addPodAllocation('${bizSel.id}')">Add pod</button>
          </div></div>`;
      }
    }
  }
  {
    const rows=camps.map(cm=>{
      const a=act(cm.activityId);
      const leads=(a&&a.costPer)?cm.budget/a.costPer:0;
      const rate=campExitRate(cm,m);
      const proj=backward(leads*rate,m);
      return {cm,leads,rate,proj};
    });
    const totalBudget=sum(rows.map(r=>r.cm.budget));
    const totalLeads=sum(rows.map(r=>r.leads));
    const gateIds=chain().map(g=>g.id);
    const summedProj={};
    gateIds.forEach(gid=>{ summedProj[gid]=sum(rows.map(r=>r.proj[gid]||0)); });
    const totalProj=summedProj[exitGate().id]||0;
    const blendedRate=totalLeads?totalProj/totalLeads:0;
    h+=`<div class="card"><h3>Portfolio business case <span class="sp"></span>
      <span class="mini">${camps.length} campaign${camps.length===1?'':'s'} in scope</span></h3>
      <div class="bd">
      ${!camps.length?`<div class="empty">No campaigns in scope.</div>`:`
      <div class="kpis">
        <div class="kpi"><div class="k">Total budget</div><div class="kpi-v">${F.mk(totalBudget)}</div></div>
        <div class="kpi"><div class="k">Implied ${esc(entryGate().name)}</div><div class="kpi-v">${F.n(totalLeads,0)}</div><div class="sub">summed across campaigns</div></div>
        <div class="kpi"><div class="k">Blended conversion</div><div class="kpi-v">${F.p(blendedRate,1)}</div><div class="sub">portfolio-weighted, not a simple average</div></div>
        <div class="kpi hl"><div class="k">Projected ${esc(exitGate().name)}</div><div class="kpi-v">${F.n(totalProj,1)}</div></div>
      </div>
      <div class="scroll"><table><thead><tr>${gTh()}</tr></thead><tbody><tr>${gTd(summedProj,1)}</tr></tbody></table></div>
      <div class="mini" style="margin-top:6px">Each campaign's own business case above (budget &rarr; leads &rarr; projected wins, using its own
        conversion rate) summed across every campaign in scope — a leadership-level roll-up of the same maths, not a separate model.</div>`}
      </div></div>`;
  }
  h+=`<div class="card"><h3>Capacity check</h3><div class="bd flush"><table><thead><tr>
    <th>Activity</th><th>Route</th><th class="n">Monthly capacity</th><th class="n">Monthly need at plan</th>
    <th class="n">Utilisation</th><th>Status</th><th>Constraint</th></tr></thead><tbody>
    ${A().map(a=>{
      const need=backward(CFG.drivers.winTarget/A().length,m)[entryGate().id]/12;
      const u=a.capMonth?need/a.capMonth:null;
      const st=!a.capMonth?'n':u>1?'bad':u>0.85?'warn':'ok';
      return `<tr><td class="lb">${esc(a.name)}</td><td>${esc(route(a.routeId)?route(a.routeId).name:'—')}</td>
        <td class="n"><input class="cel w" value="${a.capMonth}" ${readOnly()?'disabled':''} onchange="setIn('activities','${a.id}','capMonth',this.value,'num')"></td>
        <td class="n calc">${F.n(need,0)}</td>
        <td class="n">${u!=null?`<div class="row" style="justify-content:flex-end"><div class="bar" style="width:60px"><i style="width:${clamp(fin(u)*100,0,100)}%;background:${st==='bad'?'var(--bad)':st==='warn'?'var(--warn)':'var(--ok)'}"></i></div><span>${F.p(u,0)}</span></div>`:'—'}</td>
        <td><span class="pill ${st}">${!a.capMonth?'Not tracked':u>1?'Over capacity':u>0.85?'Near limit':'Within capacity'}</span></td>
        <td class="mini">${u>1?'Plan needs '+F.n(need-a.capMonth,0)+' more per month than available':'—'}</td></tr>`;}).join('')}
    </tbody></table></div>
    <div class="bd"><div class="mini"><b>This is the gap the spreadsheet never closed.</b> It would happily require 17,900 leads
      without asking whether anyone could process them. Capacity is what turns a volume requirement into an achievable plan.</div></div></div>`;
  return h;
}

/* ============================================================================
   MODULE 7 — ACTUALS & HISTORY
   ============================================================================ */
function pageActuals(){
  if(calcBlocked()) return blockedPanel('Actuals & history');
  const c=chain(),m=verMult()*segBlend(),vis=visibleRegions().map(r=>r.id);
  const fys=['FY25','FY26','FY27'];
  let h=`<div class="phead"><div><h1>Actuals &amp; history</h1>
    <p>${MONTHS.length} months of sample history. Replace with the CRM and marketing feeds — the shape is what matters here.</p></div>
    <div class="sp"></div><span class="pill v">Sample data</span></div>`;
  h+=`<div class="note w"><strong>This is synthetic.</strong> Generated deterministically so the numbers are stable between
    reloads, with growth, seasonality and noise applied. Data <em>types</em> and member names are real; values are not.</div>`;
  h+=histBanner();
  const cur=histSlice({fy:UI.fy,regionIds:vis}).acc;
  const plan=backward(CFG.drivers.winTarget,m);
  h+=`<div class="kpis">
    ${c.map((g,i)=>`<div class="kpi ${i===c.length-1?'hl':''}"><div class="k">${esc(g.name)} actual</div>
      <div class="kpi-v">${F.n(cur[g.id])}</div>
      <div class="sub">plan ${F.n(plan[g.id])} · ${F.sp(plan[g.id]?(cur[g.id]-plan[g.id])/plan[g.id]:0,0)}</div></div>`).join('')}
    <div class="kpi"><div class="k">Cost</div><div class="kpi-v">${F.mk(cur._cost)}</div><div class="sub">actual spend</div></div>
  </div>`;
  h+=`<div class="card"><h3>Plan vs actual — ${esc(UI.fy)}</h3><div class="bd flush"><table><thead><tr>
    <th>Gate</th><th class="n">Plan</th><th class="n">Actual</th><th class="n">Variance</th><th class="n">Var %</th>
    <th class="n">Plan rate</th><th class="n">Actual rate</th><th>Status</th></tr></thead><tbody>
    ${c.map((g,i)=>{
      const p=plan[g.id],a=cur[g.id],v=a-p,pc=p?v/p:0;
      const ar=i>0&&cur[c[i-1].id]?a/cur[c[i-1].id]:null;
      const st=Math.abs(pc)<0.1?'ok':Math.abs(pc)<0.25?'warn':'bad';
      return `<tr><td class="lb">${esc(g.name)}</td><td class="n calc">${F.n(p)}</td><td class="n calc">${F.n(a)}</td>
        <td class="n" style="color:${v<0?'var(--bad)':'var(--ok)'}">${F.n(v)}</td><td class="n">${F.sp(pc,1)}</td>
        <td class="n calc">${i===0?'—':F.p(rateOf(g,m),1)}</td><td class="n calc">${ar!=null?F.p(ar,1):'—'}</td>
        <td><span class="pill ${st}">${st==='ok'?'On plan':st==='warn'?'Watch':'Off plan'}</span></td></tr>`;}).join('')}
    </tbody></table></div></div>`;
  h+=`<div class="grid g2">
    <div class="card"><h3>Multi-year trend — ${esc(exitGate().name)}</h3><div class="bd">
      ${svgLines(fys,[{k:'Actual',v:fys.map(f=>histSlice({fy:f,regionIds:vis}).acc[exitGate().id])},
                      {k:'Plan',v:fys.map(()=>CFG.drivers.winTarget),dash:true}],{h:200})}
      <div class="lgd"><span><i style="background:${SER[0]}"></i>Actual</span><span><i style="background:${SER[1]}"></i>Plan</span></div></div></div>
    <div class="card"><h3>Actual by region — ${esc(UI.fy)}</h3><div class="bd">
      ${svgBars(visibleRegions().map(r=>({k:r.name,v:histSlice({fy:UI.fy,regionIds:[r.id]}).acc[exitGate().id]})),{h:200,dec:0})}</div></div></div>`;
  h+=`<div class="card"><h3>Monthly detail — ${esc(UI.fy)}</h3><div class="bd flush"><div class="scroll cap"><table><thead><tr>
    <th>Month</th><th>Quarter</th>${gTh()}<th class="n">Cost</th><th class="n">ACV</th><th class="n">Season idx</th></tr></thead><tbody>
    ${MONTHS.filter(mo=>fyOf(mo)===UI.fy).map(mo=>{
      const a=histSlice({monthKey:mo.key,regionIds:vis}).acc;
      return `<tr><td class="lb">${esc(mo.label)}</td><td>${qtrOf(mo)}</td>${gTd(a)}
        <td class="n calc">${F.mk(a._cost)}</td><td class="n calc">${F.mk(a._acv)}</td>
        <td class="n calc">${(CFG.seasonality[fyPos(mo)]??1).toFixed(2)}</td></tr>`;}).join('')}
    <tr class="tot"><td>Total</td><td></td>${gTd(cur)}<td class="n">${F.mk(cur._cost)}</td>
      <td class="n">${F.mk(cur._acv)}</td><td class="n"></td></tr>
    </tbody></table></div></div></div>`;
  return h;
}

/* ============================================================================
   MODULE 8 — INSIGHT
   ============================================================================ */
function pageInsight(){
  if(calcBlocked()) return blockedPanel('Insight');
  const c=chain(),vis=visibleRegions().map(r=>r.id);
  let h=`<div class="phead"><div><h1>Insight</h1>
    <p>Descriptive first. Seasonality, velocity and lift with observation counts attached — statistical prediction only once the volume supports it.</p></div></div>`;
  h+=histBanner();
  h+=`<div class="tabs">
    <button class="tab ${UI.insightTab==='season'?'on':''}" onclick="go('insight','season')">Seasonality</button>
    <button class="tab ${UI.insightTab==='vel'?'on':''}" onclick="go('insight','vel')">Velocity</button>
    <button class="tab ${UI.insightTab==='lift'?'on':''}" onclick="go('insight','lift')">Activity lift</button>
    <button class="tab ${UI.insightTab==='scen'?'on':''}" onclick="go('insight','scen')">Scenario compare</button>
    <button class="tab ${UI.insightTab==='ready'?'on':''}" onclick="go('insight','ready')">Data sufficiency</button></div>`;

  if(UI.insightTab==='season'){
    const labels=[]; for(let i=0;i<12;i++) labels.push(new Date(2000,(CFG.time.fyStartMonth-1+i)%12,1).toLocaleDateString('en-AU',{month:'short'}));
    h+=`<div class="note"><strong>Index of 1.00 is an average month.</strong> Applied as a multiplier in module 2's time phasing.
      Derived from ${MONTHS.length} months — thin, and flagged as such below.</div>`;
    h+=`<div class="card"><h3>Seasonality index by fiscal month</h3><div class="bd">
      ${svgBars(labels.map((l,i)=>({k:l,v:CFG.seasonality[i],c:CFG.seasonality[i]>=1?SER[0]:SER[3]})),{h:210,dec:2,maxBw:36})}
      <div class="mini" style="margin-top:6px">Peak ${labels[CFG.seasonality.indexOf(Math.max.apply(null,CFG.seasonality))]}
        at ${Math.max.apply(null,CFG.seasonality).toFixed(2)}× ·
        trough ${labels[CFG.seasonality.indexOf(Math.min.apply(null,CFG.seasonality))]}
        at ${Math.min.apply(null,CFG.seasonality).toFixed(2)}×</div></div></div>`;
    h+=`<div class="card"><h3>Monthly ${esc(exitGate().name)} by fiscal year</h3><div class="bd">
      ${svgLines(labels,['FY25','FY26'].map((f,j)=>({k:f,c:SER[j],
        v:labels.map((_,i)=>{const mo=MONTHS.find(m=>fyOf(m)===f&&fyPos(m)===i);
          return mo?histSlice({monthKey:mo.key,regionIds:vis}).acc[exitGate().id]:null;})})),{h:220})}
      <div class="lgd"><span><i style="background:${SER[0]}"></i>FY25</span><span><i style="background:${SER[1]}"></i>FY26</span></div></div></div>`;
  }

  if(UI.insightTab==='vel'){
    const cum=[]; let run=0;
    c.forEach(g=>{ run+=CFG.velocity[g.id]||0; cum.push(run); });
    h+=`<div class="note"><strong>This is what converts "leads per year" into "leads by date".</strong>
      Total lag from ${esc(entryGate().name)} to ${esc(exitGate().name)} is <b>${run} days</b> — so a lead created inside
      that window cannot land in this fiscal year. Neither the spreadsheet nor the Anaplan build modelled this at all.</div>`;
    h+=`<div class="card"><h3>Days to reach each gate</h3><div class="bd">
      ${svgBars(c.map((g,i)=>({k:g.name,v:cum[i]})),{h:200})}</div></div>`;
    h+=`<div class="card"><h3>Stage lag</h3><div class="bd flush"><table><thead><tr>
      <th>Gate</th><th class="n">Median days from previous</th><th class="n">Cumulative days</th>
      <th class="n">Latest entry date to land in ${esc(UI.fy)}</th></tr></thead><tbody>
      ${c.map((g,i)=>{const fyEnd=new Date(2027,CFG.time.fyStartMonth-2,28);
        const latest=new Date(fyEnd.getTime()-cum[c.length-1]*86400000);
        return `<tr><td class="lb">${esc(g.name)}</td>
          <td class="n"><input class="cel w" value="${CFG.velocity[g.id]||0}" ${readOnly()?'disabled':''} onchange="CFG.velocity['${g.id}']=parseFloat(this.value)||0;render()"></td>
          <td class="n calc">${cum[i]}</td>
          <td class="n calc">${i===0?latest.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'2-digit'}):'—'}</td></tr>`;}).join('')}
      </tbody></table></div></div>`;
  }

  if(UI.insightTab==='lift'){
    const acts=A();
    const rows=acts.map(a=>{
      const o=observedRates({regionIds:vis,activityIds:[a.id]});
      const base=observedRates({regionIds:vis});
      return {a:a,o:o,base:base};
    });
    h+=`<div class="note"><strong>Lift is a ratio against the all-activity baseline, with n shown.</strong>
      A 1.4× lift on n=23 is not a finding. Nothing here is inferential — it is a lift table you can argue with.</div>`;
    h+=`<div class="card"><h3>Observed rate by activity vs baseline</h3><div class="bd flush"><div class="scroll"><table><thead><tr>
      <th>Activity</th>${c.slice(1).map(g=>`<th class="n">${esc(g.name)}</th>`).join('')}<th class="n">End-to-end</th><th>Evidence</th></tr></thead><tbody>
      ${rows.map(r=>{
        const n=(r.o[c[1].id]||{}).n||0,cb=confBand(n);
        let e2e=1; c.slice(1).forEach(g=>{const x=r.o[g.id]; e2e*= (x&&x.rate!=null)?x.rate:0;});
        let b2e=1; c.slice(1).forEach(g=>{const x=r.base[g.id]; b2e*= (x&&x.rate!=null)?x.rate:0;});
        return `<tr><td class="lb">${esc(r.a.name)}</td>
          ${c.slice(1).map(g=>{const x=r.o[g.id],bs=r.base[g.id];
            const lift=(x&&bs&&bs.rate)?x.rate/bs.rate:null;
            return `<td class="n calc">${x&&x.rate!=null?F.p(x.rate,1):'—'}
              ${lift!=null?`<span class="rn"> ${lift.toFixed(2)}×</span>`:''}</td>`;}).join('')}
          <td class="n calc">${F.p(e2e,3)} <span class="rn">${b2e?(e2e/b2e).toFixed(2)+'×':''}</span></td>
          <td><span class="pill ${cb.cls}">${cb.label}</span></td></tr>`;}).join('')}
      <tr class="tot"><td>Baseline (all activities)</td>
        ${c.slice(1).map(g=>{const x=rows[0].base[g.id];return `<td class="n">${x&&x.rate!=null?F.p(x.rate,1):'—'}</td>`;}).join('')}
        <td class="n"></td><td></td></tr>
      </tbody></table></div></div></div>`;
    h+=`<div class="card"><h3>Rate heat map — activity × gate</h3><div class="bd">
      ${svgHeat(acts.map(a=>a.name), c.slice(1).map(g=>g.name),
        acts.map(a=>{const o=observedRates({regionIds:vis,activityIds:[a.id]});
          return c.slice(1).map(g=>(o[g.id]&&o[g.id].rate!=null)?o[g.id].rate:null);}),
        {pct:true,cw:58,pl:118})}</div></div>`;
  }

  if(UI.insightTab==='scen'){
    const d=CFG.drivers;
    h+=`<div class="note"><strong>Same target, different assumptions.</strong> Scenarios apply a rate multiplier.
      In the built system they would branch the full driver set.</div>`;
    h+=`<div class="card"><h3>Scenario comparison</h3><div class="bd flush"><table><thead><tr>
      <th>Version</th><th>Kind</th><th class="n">Rate ×</th>${gTh()}<th class="n">Entry vs Forecast</th></tr></thead><tbody>
      ${CFG.versions.filter(v=>v.kind!=='actual').map(v=>{
        const mm=(v.name==='Budget'?1:v.name==='Forecast'?0.94:v.name==='Scenario — Events heavy'?1.11:v.name==='Scenario — Outbound heavy'?1.06:1)*segBlend();
        const val=backward(d.winTarget,mm);
        const fc=backward(d.winTarget,0.94*segBlend());
        const delta=fc[entryGate().id]?(val[entryGate().id]-fc[entryGate().id])/fc[entryGate().id]:0;
        return `<tr${v.id===UI.versionId?' style="background:#F7F2FE"':''}>
          <td class="lb">${esc(v.name)}</td><td><span class="pill n">${esc(v.kind)}</span></td>
          <td class="n calc">${(mm/segBlend()).toFixed(2)}</td>${gTd(val)}
          <td class="n" style="color:${delta>0?'var(--bad)':'var(--ok)'}">${F.sp(delta,1)}</td></tr>`;}).join('')}
      </tbody></table></div>
      <div class="bd"><div class="mini">A higher rate multiplier means fewer ${esc(entryGate().name)} needed for the same
        ${esc(exitGate().name)} target — so a negative entry delta is the favourable direction.</div></div></div>`;
    h+=`<div class="card"><h3>Entry volume required by scenario</h3><div class="bd">
      ${svgBars(CFG.versions.filter(v=>v.kind!=='actual').map(v=>{
        const mm=(v.name==='Budget'?1:v.name==='Forecast'?0.94:v.name==='Scenario — Events heavy'?1.11:v.name==='Scenario — Outbound heavy'?1.06:1)*segBlend();
        return {k:v.name.replace('Scenario — ',''),v:backward(d.winTarget,mm)[entryGate().id]};}),{h:200,maxBw:70})}</div></div>`;
  }

  if(UI.insightTab==='ready'){
    const obs=observedRates({});
    const perCell = Math.round(MONTHS.length*R().length*A().length*G().length);
    const cells = R().length*P().length*A().length*S().length*G().length*chain().length;
    h+=`<div class="note b"><strong>Read this before anyone promises a predictive model.</strong>
      Prediction needs observations per cell, not rows in total. At the current dimensionality the model has
      <b>${F.n(cells)}</b> addressable cells and <b>${F.n(perCell)}</b> monthly fact rows —
      roughly <b>${(perCell/cells).toFixed(2)}</b> observations per cell. Anything fitted on that will overfit.</div>`;
    h+=`<div class="card"><h3>Data sufficiency by gate</h3><div class="bd flush"><table><thead><tr>
      <th>Gate</th><th class="n">Observations</th><th>Confidence</th><th>Supports</th></tr></thead><tbody>
      ${chain().slice(1).map(g=>{const o=obs[g.id]||{},cb=confBand(o.n);
        const s=o.n>=1000?'Segment-level rates, seasonality, lift':o.n>=150?'Blended rates, coarse seasonality':o.n>=30?'Blended rate only':'Nothing — use a benchmark';
        return `<tr><td class="lb">${esc(g.name)}</td><td class="n calc">${F.n(o.n||0)}</td>
          <td><span class="pill ${cb.cls}">${cb.label}</span></td><td class="mini">${s}</td></tr>`;}).join('')}
      </tbody></table></div></div>`;
    h+=`<div class="card"><h3>Dimensionality</h3><div class="bd flush"><table><thead><tr>
      <th>Dimension</th><th class="n">Members</th><th class="mini">Cumulative cells</th></tr></thead><tbody>
      ${(()=>{const dims=[['Regions',R().length],['Pods',P().length],['Activities',A().length],
        ['Streams',S().length],['Segments',G().length],['Gates',chain().length],['Months',MONTHS.length]];
        let run=1; return dims.map(dd=>{run*=dd[1];
          return `<tr><td class="lb">${dd[0]}</td><td class="n calc">${dd[1]}</td><td class="mini">${F.n(run)}</td></tr>`;}).join('');})()}
      </tbody></table></div>
      <div class="bd"><div class="mini"><b>The lever is grain, not cleverness.</b> Drop a dimension from the fact key,
        or coarsen its members, and observations per cell rise proportionally. This is why segments were kept to three.</div></div></div>`;
  }
  return h;
}

function pageSnapshots(){
  if(calcBlocked()) return blockedPanel('Snapshots');
  const c=chain(),vis=visibleRegions().map(r=>r.id),m=verMult()*segBlend();
  const current=backward(CFG.drivers.winTarget,m);
  const actualAcc=histSlice({fy:UI.fy,regionIds:vis}).acc;
  const ro=readOnly()?'disabled':'';
  const sorted=CFG.snapshots.slice().sort((a,b)=>b.timestamp.localeCompare(a.timestamp));
  const compareSet=sorted.slice(0,3);
  const snapVols=compareSet.map(s=>({s:s,vol:snapshotGateVolumes(s)}));
  const gateMismatch=compareSet.some(s=>{
    const sids=(s.data.gates||[]).map(g=>g.id).sort().join(',');
    const cids=CFG.gates.map(g=>g.id).sort().join(',');
    return sids!==cids;
  });

  let h=`<div class="phead"><div><h1>Snapshots</h1>
    <p>Save a named, timestamped copy of the whole plan. Revert to one, or compare it side by side against the
      current plan and actuals — the last three saved snapshots are shown below.</p></div></div>`;

  h+=`<div class="card"><h3>Save a snapshot</h3><div class="bd">
    <div class="row">
      <input class="in" id="snapName" placeholder="e.g. FY27 board-approved plan" style="max-width:340px" ${ro}
        onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('snapBtn').click();}">
      <button class="btn pri" id="snapBtn" ${ro} onclick="
        const el=document.getElementById('snapName'); const n=el.value.trim();
        if(!n){toast('Name it first.');return;} saveSnapshot(n); el.value='';">Save current plan as snapshot</button>
    </div>
    <div class="mini" style="margin-top:6px">Captures every module as it stands right now — drivers, gates, geography,
      segments, activities, campaigns, cost and cost buckets. Reverting swaps all of it back in one step.</div>
  </div></div>`;

  h+=`<div class="card"><h3>Saved snapshots <span class="sp"></span>
    <span class="pill n">${CFG.snapshots.length} saved</span></h3>
    <div class="bd flush"><div class="scroll cap"><table><thead><tr>
      <th>Name</th><th>Created by</th><th>Timestamp</th><th></th></tr></thead><tbody>
      ${sorted.length?sorted.map(s=>`<tr><td><input class="cel txt" style="width:280px" value="${esc(s.name)}" ${ro}
          onchange="setIn('snapshots','${s.id}','name',this.value)"></td>
        <td>${esc(s.createdBy)}</td><td class="mini">${esc(F.dt(s.timestamp))}</td>
        <td class="n"><button class="btn sm" ${ro} onclick="revertSnapshot('${s.id}')">Revert to this</button>
          <button class="btn sm" onclick="openOverlay('${s.id}')">Overlay &amp; choose changes</button>
          <button class="btn sm dgr" ${ro} onclick="removeSnapshot('${s.id}')">Remove</button></td></tr>`).join('')
        :`<tr><td colspan="4" class="empty">No snapshots yet — save one above.</td></tr>`}
    </tbody></table></div></div></div>`;

  h+=`<div class="card"><h3>Compare — current plan vs snapshots vs actual</h3>`;
  if(gateMismatch) h+=`<div class="note w"><strong>The gate set has changed since one of these snapshots was saved.</strong>
    Cells that can't be matched to today's gates show <b>—</b> rather than a silent zero.</div>`;
  if(!compareSet.length) h+=`<div class="bd"><div class="empty">Save at least one snapshot above to see a comparison.</div></div>`;
  else h+=`<div class="bd flush"><div class="scroll"><table><thead><tr><th>Gate</th><th class="n">Current plan</th>
      ${snapVols.map(x=>`<th class="n">${esc(x.s.name)}<div class="mini" style="font-weight:400">${esc(F.dt(x.s.timestamp))}</div></th>`).join('')}
      <th class="n">Actual (${esc(UI.fy)})</th></tr></thead><tbody>
      ${c.map(g=>`<tr><td class="lb">${esc(g.name)}</td><td class="n calc">${F.n(current[g.id])}</td>
        ${snapVols.map(x=>`<td class="n calc">${F.n(x.vol?x.vol[g.id]:null)}</td>`).join('')}
        <td class="n calc">${F.n(actualAcc[g.id])}</td></tr>`).join('')}
    </tbody></table></div></div></div>`;
  return h;
}

function pageDashboard(){
  if(calcBlocked()) return blockedPanel('Dashboard');
  const c=chain(),d=CFG.drivers,m=verMult()*segBlend();
  const visAll=visibleRegions();
  /* "Viewing" scope: a page-level drill into region/pod, not a global nav-bar filter (that stayed to
     Role/Version/FY/Grain, which every page reads consistently — region/pod only makes sense on pages
     built around it). Narrowing to a region genuinely re-scopes campaigns and actuals below; narrowing
     further to a pod can only scale the ACV/demand-potential math, since campaigns aren't tracked at
     pod granularity in Strategy — flagged inline rather than pretending otherwise. */
  if(UI.dashRegionId && !visAll.some(r=>r.id===UI.dashRegionId)) UI.dashRegionId=null;
  if(!UI.dashRegionId) UI.dashPodId=null;
  const podScope = UI.dashPodId ? byId(CFG.pods,UI.dashPodId) : null;
  if(podScope && podScope.regionId!==UI.dashRegionId) UI.dashPodId=null;
  const vis = UI.dashRegionId ? visAll.filter(r=>r.id===UI.dashRegionId) : visAll;
  const visIds=vis.map(r=>r.id);
  const podShare = (UI.dashPodId && byId(CFG.pods,UI.dashPodId)) ? byId(CFG.pods,UI.dashPodId).share : 1;
  const deal=blendedDeal();
  const plan=backward(d.winTarget,m);
  const actualAcc=histSlice({fy:UI.fy,regionIds:visIds}).acc;
  const winVar=plan[exitGate().id]?(actualAcc[exitGate().id]-plan[exitGate().id])/plan[exitGate().id]:0;
  const winSt=Math.abs(winVar)<0.1?'ok':Math.abs(winVar)<0.25?'warn':'bad';

  const camps=CFG.campaigns.filter(cm=>visIds.includes(cm.regionId)||(!UI.dashRegionId&&cm.regionId===unassignedRegionId()));
  const budgeted=sum(camps.map(cm=>cm.budget)), committed=sum(camps.map(campaignCommitted)), actualSpend=sum(camps.map(campaignActualSpend));
  const spendVar=budgeted?(actualSpend-budgeted)/budgeted:0;
  const spendSt=actualSpend<=budgeted?'ok':spendVar<0.1?'warn':'bad';

  const totAcv=sum(vis.map(r=>r.acvTarget))*podShare;
  const accPot=sum(vis.map(r=>{ const wins=r.acvTarget/deal; return backward(wins,m)[exitGate().id]*deal; }))*podShare;
  const acvVar=totAcv?(accPot-totAcv)/totAcv:0;
  const acvSt=acvVar>-0.05?'ok':acvVar>-0.15?'warn':'bad';

  const rank={ok:0,warn:1,bad:2};
  const overall=[winSt,spendSt,acvSt].sort((a,b)=>rank[b]-rank[a])[0];
  const overallLabel=overall==='ok'?'On track':overall==='warn'?'Watch':'Off track';

  let h=`<div class="phead"><div><h1>Dashboard</h1>
    <p>How the plan is tracking right now — funnel, spend, ACV and drift since your last named snapshot, in one look.</p></div>
    <div class="sp"></div><span class="pill ${overall}" style="font-size:12px;padding:4px 12px">${overallLabel}</span></div>`;

  h+=`<div class="card"><div class="bd" style="padding:10px 14px"><div class="row" style="gap:10px;flex-wrap:wrap">
    <span class="lbl">Viewing</span>
    <select class="in" style="width:auto" onchange="UI.dashRegionId=this.value||null;UI.dashPodId=null;render()">
      <option value="">All regions I can see (${visAll.length})</option>
      ${visAll.map(r=>`<option value="${r.id}" ${UI.dashRegionId===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}
    </select>
    ${UI.dashRegionId?`<select class="in" style="width:auto" onchange="UI.dashPodId=this.value||null;render()">
      <option value="">All pods in ${esc(region(UI.dashRegionId).name)}</option>
      ${P(UI.dashRegionId).map(pd=>`<option value="${pd.id}" ${UI.dashPodId===pd.id?'selected':''}>${esc(pd.name)}</option>`).join('')}
    </select>`:''}
    ${podScope?`<span class="mini">Pod view scales ACV target &amp; demand potential by ${esc(podScope.name)}'s ${F.p(podScope.share,0)} share — campaigns and actuals below are not tracked at pod level, so they still show all of ${esc(region(UI.dashRegionId).name)}.</span>`:''}
  </div></div></div>`;

  h+=`<div class="kpis">
    <div class="kpi hl"><div class="k">${esc(exitGate().name)} — plan vs actual</div>
      <div class="kpi-v">${F.n(actualAcc[exitGate().id])}<span class="mini"> / ${F.n(plan[exitGate().id])}</span></div>
      <div class="sub" style="color:${winSt==='bad'?'var(--bad)':winSt==='warn'?'var(--warn)':'var(--ok)'}">${F.sp(winVar,0)} vs plan · ${esc(UI.fy)}</div></div>
    <div class="kpi"><div class="k">Budgeted</div><div class="kpi-v">${F.mk(budgeted)}</div><div class="sub">${camps.length} campaigns in scope</div></div>
    <div class="kpi"><div class="k">Committed</div><div class="kpi-v">${F.mk(committed)}</div><div class="sub">${F.p(budgeted?committed/budgeted:0,0)} of budgeted</div></div>
    <div class="kpi"><div class="k">Actual spend</div><div class="kpi-v">${F.mk(actualSpend)}</div>
      <div class="sub" style="color:${spendSt==='bad'?'var(--bad)':spendSt==='warn'?'var(--warn)':'var(--ok)'}">${F.sp(spendVar,0)} vs budgeted</div></div>
    <div class="kpi"><div class="k">ACV target vs demand potential</div><div class="kpi-v">${F.mk(accPot)}<span class="mini"> / ${F.mk(totAcv)}</span></div>
      <div class="sub" style="color:${acvSt==='bad'?'var(--bad)':acvSt==='warn'?'var(--warn)':'var(--ok)'}">${F.sp(acvVar,0)} potential vs target</div></div>
  </div>`;

  h+=`<div class="grid g2">
    <div class="card"><h3>Funnel — plan vs actual <span class="sp"></span>
      <button class="btn sm" onclick="go('actuals')">Full detail</button></h3>
      <div class="bd flush"><table><thead><tr><th>Gate</th><th class="n">Plan</th><th class="n">Actual</th><th class="n">Var %</th><th>Status</th></tr></thead><tbody>
      ${c.map(g=>{ const p=plan[g.id],a=actualAcc[g.id],pc=p?(a-p)/p:0;
        const st=Math.abs(pc)<0.1?'ok':Math.abs(pc)<0.25?'warn':'bad';
        return `<tr><td class="lb">${esc(g.name)}</td><td class="n calc">${F.n(p)}</td><td class="n calc">${F.n(a)}</td>
          <td class="n">${F.sp(pc,0)}</td><td><span class="pill ${st}">${st==='ok'?'On plan':st==='warn'?'Watch':'Off plan'}</span></td></tr>`;}).join('')}
      </tbody></table></div></div>
    <div class="card"><h3>Spend by cost bucket <span class="sp"></span>
      <button class="btn sm" onclick="go('campaign')">Full detail</button></h3><div class="bd">
      ${svgBars(CFG.costBuckets.map(b=>({k:b.code,v:sum(camps.filter(cm=>cm.costBucketId===b.id).map(cm=>campaignActualSpend(cm)||campaignCommitted(cm)))})).filter(r=>r.v>0),{h:200,money:true})}
      <div class="mini" style="margin-top:6px">Actual where posted, otherwise committed.</div>
    </div></div>
  </div>`;

  h+=`<div class="card"><h3>Regions at a glance <span class="sp"></span>
    <button class="btn sm" onclick="go('geo')">Full detail</button></h3>
    <div class="bd flush"><table><thead><tr><th>Region</th><th class="n">ACV target</th><th class="n">Demand potential</th><th class="n">Variance</th><th>Status</th></tr></thead><tbody>
    ${vis.map(r=>{ const wins=r.acvTarget/deal, pot=backward(wins,m)[exitGate().id]*deal, varr=r.acvTarget?(pot-r.acvTarget)/r.acvTarget:0;
      const st=varr<-0.1?'bad':varr<0?'warn':'ok';
      return `<tr><td class="lb">${esc(r.name)}</td><td class="n calc">${F.mk(r.acvTarget)}</td><td class="n calc">${F.mk(pot)}</td>
        <td class="n">${F.sp(varr,0)}</td><td><span class="pill ${st}">${st==='ok'?'Achievable':st==='warn'?'Tight':'Short'}</span></td></tr>`;}).join('')}
    </tbody></table></div></div>`;

  const baseline=byId(CFG.snapshots,UI.baselineSnapId)||CFG.snapshots[0]||null;
  h+=`<div class="card"><h3>Plan drift vs baseline snapshot <span class="sp"></span>
    ${CFG.snapshots.length?`<select class="in" style="width:auto" onchange="UI.baselineSnapId=this.value;render()">
      ${CFG.snapshots.map(s=>`<option value="${s.id}" ${baseline&&s.id===baseline.id?'selected':''}>${esc(s.name)}</option>`).join('')}
    </select>`:''}
    <button class="btn sm" onclick="go('snapshots')">Open snapshots</button></h3>`;
  if(!baseline){
    h+=`<div class="bd"><div class="empty">No snapshot saved yet — save one from the Snapshots page to track drift against a baseline.</div></div>`;
  } else {
    const bTarget=baseline.data.drivers.winTarget;
    const bCamps=(baseline.data.campaigns||[]);
    const bBudget=sum(bCamps.map(cm=>cm.budget));
    const tDrift=bTarget?(d.winTarget-bTarget)/bTarget:0;
    const bDrift=bBudget?(budgeted-bBudget)/bBudget:0;
    h+=`<div class="kpis">
      <div class="kpi"><div class="k">${esc(exitGate().name)} target drift</div><div class="kpi-v">${F.n(d.winTarget)}<span class="mini"> / ${F.n(bTarget)}</span></div>
        <div class="sub" style="color:${tDrift===0?'var(--ink-3)':'var(--warn)'}">${F.sp(tDrift,1)} since "${esc(baseline.name)}"</div></div>
      <div class="kpi"><div class="k">Budgeted drift</div><div class="kpi-v">${F.mk(budgeted)}<span class="mini"> / ${F.mk(bBudget)}</span></div>
        <div class="sub" style="color:${bDrift===0?'var(--ink-3)':'var(--warn)'}">${F.sp(bDrift,1)} since "${esc(baseline.name)}" · ${F.dt(baseline.timestamp)}</div></div>
    </div>`;
  }
  h+=`</div>`;
  return h;
}


/* ============================================================================
   MODULE — QUICK CALCULATOR (push to planner)
   ============================================================================ */
function pageCalculator(){
  if(!UI.calc) UI.calc=calcDefaults();
  const k=UI.calc, m=verMult()*segBlend();
  const leadsNeeded = k.rate>0 ? k.targetWins/k.rate : null;
  const totalCost = leadsNeeded!=null ? leadsNeeded*k.costPerLead : null;
  const revenue = k.targetWins*k.avgDeal;
  const costPerWin = (k.targetWins&&totalCost!=null) ? totalCost/k.targetWins : null;
  const roi = totalCost ? revenue/totalCost : null;
  const detailed = backward(k.targetWins||0, m);

  const entryVolume = k.entryVolume||0;
  const winsExpected = entryVolume*k.rate;
  const buCost = entryVolume*k.costPerLead;
  const buRevenue = winsExpected*k.avgDeal;
  const buCostPerWin = winsExpected ? buCost/winsExpected : null;
  const buRoi = buCost ? buRevenue/buCost : null;

  let h=`<div class="phead"><div><h1>Quick calculator</h1>
    <p>A handful of numbers for fast what-if thinking, kept separate from the live plan until you push it across.</p></div>
    <div class="sp"></div><button class="btn sm" onclick="calcReset()">Reset to current plan</button></div>`;

  h+=`<div class="grid g2">
    <div class="card"><h3>Assumptions</h3><div class="bd">
      <div class="f"><label>Target ${esc(exitGate().name)}</label>
        <input class="in v" value="${k.targetWins}" onchange="calcSet('targetWins',this.value)"></div>
      <div class="f"><label>Average deal size</label>
        <input class="in v" value="${k.avgDeal}" onchange="calcSet('avgDeal',this.value)"></div>
      <div class="f"><label>Blended conversion (${esc(entryGate().name)} &rarr; ${esc(exitGate().name)})</label>
        <input class="in v" value="${(k.rate*100).toFixed(2)}" onchange="calcSet('rate',this.value)">
        <span class="hint">Defaults to the live plan's current end-to-end rate — override it for a what-if.</span></div>
      <div class="f"><label>Assumed cost per ${esc(entryGate().name)}</label>
        <input class="in v" value="${k.costPerLead}" onchange="calcSet('costPerLead',this.value)"></div>
    </div></div>
    <div class="card"><h3>Result</h3><div class="bd">
      <div class="kpis">
        <div class="kpi hl"><div class="k">${esc(entryGate().name)} needed</div><div class="kpi-v">${leadsNeeded!=null?F.n(leadsNeeded):'—'}</div><div class="sub">at ${F.p(k.rate,1)} blended</div></div>
        <div class="kpi"><div class="k">Total cost</div><div class="kpi-v">${totalCost!=null?F.mk(totalCost):'—'}</div><div class="sub">${F.mk(k.costPerLead)}/lead</div></div>
        <div class="kpi"><div class="k">Cost per win</div><div class="kpi-v">${costPerWin!=null?F.mk(costPerWin):'—'}</div><div class="sub">blended</div></div>
        <div class="kpi"><div class="k">Projected revenue</div><div class="kpi-v">${F.mk(revenue)}</div><div class="sub">${roi!=null?F.n(roi,1)+'x cost':'—'}</div></div>
      </div>
      <div class="dv"></div>
      <div class="row">
        <button class="btn pri" onclick="pushCalcToPlanner(false)">Push to planner</button>
        <button class="btn" onclick="pushCalcToPlanner(true)">Push + create draft campaign</button>
      </div>
      <div class="mini" style="margin-top:8px">Push to planner sets the live win target and deal size. The second option
        also drops a draft campaign into Campaign &amp; cost with this budget and conversion assumption, ready to refine.</div>
    </div></div>
  </div>`;

  h+=`<div class="grid g2">
    <div class="card"><h3>Bottom-up: from volume</h3><div class="bd">
      <div class="f"><label>${esc(entryGate().name)} you expect</label>
        <input class="in v" value="${entryVolume}" onchange="calcSet('entryVolume',this.value)"></div>
      <div class="mini">Uses the same conversion rate, average deal size and cost-per-lead entered in the top-down
        assumptions above — change those there, this side just runs the same numbers forward instead of backward.</div>
    </div></div>
    <div class="card"><h3>Result</h3><div class="bd">
      <div class="kpis">
        <div class="kpi hl"><div class="k">${esc(exitGate().name)} expected</div><div class="kpi-v">${F.n(winsExpected)}</div><div class="sub">at ${F.p(k.rate,1)} blended</div></div>
        <div class="kpi"><div class="k">Total cost</div><div class="kpi-v">${F.mk(buCost)}</div><div class="sub">${F.mk(k.costPerLead)}/lead</div></div>
        <div class="kpi"><div class="k">Cost per win</div><div class="kpi-v">${buCostPerWin!=null?F.mk(buCostPerWin):'—'}</div><div class="sub">blended</div></div>
        <div class="kpi"><div class="k">Projected revenue</div><div class="kpi-v">${F.mk(buRevenue)}</div><div class="sub">${buRoi!=null?F.n(buRoi,1)+'x cost':'—'}</div></div>
      </div>
      <div class="dv"></div>
      <button class="btn" onclick="calcSet('targetWins',${Math.round(winsExpected)||0})">Use ${F.n(winsExpected)} as my top-down target &uarr;</button>
    </div></div>
  </div>`;

  h+=`<div class="card"><h3>Reference — the real gate chain for this target</h3>
    <div class="bd flush"><table><thead><tr><th>Gate</th><th class="n">Your blended assumption</th><th class="n">Live plan's actual gates</th><th class="n">Difference</th></tr></thead><tbody>
    ${chain().map(g=>{
      const simple = g.id===exitGate().id ? k.targetWins : g.id===entryGate().id ? leadsNeeded : null;
      const real = detailed[g.id];
      const diff = simple!=null ? simple-real : null;
      return `<tr><td class="lb">${esc(g.name)}</td>
        <td class="n calc">${simple!=null?F.n(simple):'—'}</td>
        <td class="n calc">${F.n(real)}</td>
        <td class="n">${diff!=null?F.sp(real?diff/real:0,0):'—'}</td></tr>`;
    }).join('')}
    </tbody></table></div>
    <div class="bd"><div class="mini">The calculator only knows entry and exit — it can't see the gates in between.
      This shows what the detailed engine's real per-gate rates actually need for the same target, so you can tell
      whether the blended-rate assumption above is optimistic before you push it.</div></div></div>`;
  return h;
}

const PAGES=[
  {id:'home',    ix:'⌂',label:'Home',         fn:pageHome,     grp:'Overview'},

  {id:'calculator',ix:'¤',label:'Quick calculator',fn:pageCalculator,grp:'Overview'},

  {id:'drivers', ix:'1',label:'Drivers & rates',  fn:pageDrivers,  grp:'Plan'},
  {id:'plan',    ix:'2',label:'Planning engine',  fn:pagePlan,     grp:'Plan'},
  {id:'geo',     ix:'3',label:'Geography & pods', fn:pageGeo,      grp:'Plan'},
  {id:'segment', ix:'4',label:'Segment & audience',fn:pageSegment, grp:'Plan'},

function go(page,tab){
  UI.page=page;
  if(page==='admin'&&tab)UI.adminTab=tab;
  if(page==='plan'&&tab)UI.planTab=tab;
  if(page==='insight'&&tab)UI.insightTab=tab;
  window.scrollTo(0,0); render();
}
window.go=go;

function renderSide(){
  let h='',grp=null;
  PAGES.forEach(p=>{
    if(p.grp!==grp){ grp=p.grp; h+=`<h4>${grp}</h4>`; }
    const locked = p.id==='admin'&&!canConfig();
    h+=`<a class="navi ${UI.page===p.id?'on':''}" href="#" onclick="go('${p.id}');return false">
      <span class="ix">${p.ix}</span><span>${p.label}</span>${locked?'<span class="lk">read only</span>':''}</a>`;
  });
  const v=validations(),bad=v.filter(x=>x.s==='bad').length;
  h+=`<h4>Status</h4><div style="padding:2px 14px">
    <div class="row" style="margin-bottom:5px"><a href="#" onclick="go('home');return false" title="Go to Home to see the validations list" class="pill ${bad?'bad':'ok'}" style="cursor:pointer;text-decoration:none">${bad?bad+' blocking':'Validations pass'}</a></div>
    <div class="mini" style="line-height:1.6">
      ${chain().length} gates · ${R().length} regions · ${P().length} pods<br>
      ${A().length} activities · ${S().length} streams · ${G().length} segments<br>
      ${CFG.campaigns.length} campaigns · ${MONTHS.length} months history
    </div>
    <div class="dv"></div>
    <button class="btn sm" style="width:100%" onclick="exportCfg()">Export configuration</button>
  </div>`;
  return h;
}
function renderTnAcct(){
  const u=user();
  const nm=u?u.name:'';
  const initials=nm?nm.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase():'?';
  return `<span class="tn-avatar">${esc(initials)}</span>
    <div class="tn-who"><b>${esc(nm||'—')}</b><span>${esc(role()?role().name:'')}</span></div>
    <a class="tn-signout" href="#" onclick="doSignOut();return false;">Sign out</a>`;
}
/* Consistent cross-module bar: search jumps between the 8 tools, same list
   and behavior as every other file -- not this tool's own pages/regions/pods. */
const MODULES=[
  {id:'Ordo',label:'Strategy',desc:'Funnel planning & forecasting',color:'#1F3AC7',icon:'St'},
  {id:'Cursus',label:'Campaign Planning',desc:'Campaign & activity execution',color:'#0E7C6B',icon:'Ca'},
  {id:'Eventus',label:'Events',desc:'Event planning & logistics',color:'#B5480E',icon:'Ev'},
  {id:'Custodia',label:'Assets',desc:'Asset register',color:'#3B6E1F',icon:'As'},
  {id:'Prospectus',label:'Targets',desc:'ICP filters & opportunity reports',color:'#9C2B3C',icon:'Ta'},
  {id:'Augur',label:'Scoring',desc:'Lead & deal scoring',color:'#5A3E9C',icon:'Sc'},
  {id:'Schema',label:'Process Maps',desc:'Process maps & workflows',color:'#3A5A8C',icon:'Pr'},
  {id:'Norma',label:'Configuration',desc:'Shared configuration',color:'#B5730E',icon:'Co'}
];
const THIS_MODULE='Ordo';
const HELP_FAQ=[
  {q:'How do I reset my password?', a:'An admin can trigger a reset from Configuration \u2192 Roles & users \u2192 Reset password, or use "Forgot password" at login. The email comes from Supabase directly, not from North.'},
  {q:'How do I set up a passkey?', a:'From your account menu, choose to set up a passkey \u2014 your browser or device (Windows Hello, Touch ID, a security key, etc.) will walk you through it.'},
  {q:'How do I invite a new teammate?', a:'Configuration \u2192 Invite a new teammate \u2192 choose their role \u2192 Generate invite code, then send them the code. They redeem it at signup by choosing "I have an invite code."'},
  {q:"Why can't I see a module, or can't edit something?", a:'Access is layered: your organization sets the ceiling (which modules exist for anyone there), your role sets Configure/Publish/Can edit, and you personally have a Modules toggle in the Users table. Ask an admin to check all three.'},
  {q:"What's the difference between Simple and Expert mode?", a:'In Campaign Planning, Simple mode shows the core fields; Expert mode adds business case, sign-off, partner allocation and more \u2014 toggle it from Campaign Planning if your role allows it.'},
  {q:'What does Cross-region visibility mean?', a:'"Transparent" means you see every region in your organization. "Isolated" means you only see the regions specifically checked for you.'},
  {q:'What is Super Admin?', a:"Super Admin isn't a role in the Roles table \u2014 it's a separate flag on a login that gives full cross-organization visibility in Configuration, independent of any one organization's roles."}
];
function helpPanelHtml(){
  const mod = MODULES.find(m=>m.id===THIS_MODULE) || {label:THIS_MODULE, desc:''};
  const pageLabel = ((PAGES.find(p=>p.id===UI.page))||{}).label || '';
  return `<div class="mask" onclick="if(event.target===this)closeHelpPanel()"><div class="modal" style="width:min(520px,100%)">
    <h3>Help &amp; FAQ <span class="sp"></span><button class="btn sm" onclick="closeHelpPanel()">Close</button></h3>
    <div class="bd" style="max-height:70vh;overflow:auto">
      <div class="note" style="margin-bottom:16px"><strong>${esc(mod.label)}</strong>${pageLabel?' \u2014 '+esc(pageLabel):''}<br>${esc(mod.desc)}</div>
      <div class="lbl" style="margin-bottom:8px">Frequently asked</div>
      ${HELP_FAQ.map(f=>`<details style="margin-bottom:8px"><summary style="cursor:pointer;font-weight:600;font-size:12.5px">${esc(f.q)}</summary>
        <div class="mini" style="margin-top:4px;padding-left:2px">${esc(f.a)}</div></details>`).join('')}
    </div>
  </div></div>`;
}
function openHelpPanel(){ UI.helpOpen=true; render(); }
function closeHelpPanel(){ UI.helpOpen=false; render(); }
window.openHelpPanel=openHelpPanel; window.closeHelpPanel=closeHelpPanel;

function renderTnModuleLinks(){
  return MODULES.map(m=>{
    const t = (m.desc||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return m.id===THIS_MODULE
      ? `<span class="tn-link on" title="${t}"><span class="mk" style="background:${m.color}">${m.icon}</span>${m.label}</span>`
      : `<a class="tn-link" href="${m.id}.html" target="tool_${m.id}" title="${t}"><span class="mk" style="background:${m.color}">${m.icon}</span>${m.label}</a>`;
  }).join('') + '<a class="tn-link" href="#" onclick="openContact();return false;" title="Search contacts, notes and outreach"><span class="mk" style="background:#1F1F1F">Ct</span>Contact</a>';
}
function tnSearchResults(q){
  q=(q||'').trim().toLowerCase(); if(!q) return [];
  return MODULES.filter(m=>m.label.toLowerCase().includes(q)||m.desc.toLowerCase().includes(q)).slice(0,8);
}
let _tnResultList=[];
function tnSearch(q){
  _tnResultList=tnSearchResults(q);
  const box=document.getElementById('tnResults');
  if(!q||!q.trim()){ box.innerHTML=''; return; }
  box.innerHTML = `<div class="tn-results">${
    _tnResultList.length ? _tnResultList.map((m,i)=>`<a href="#" onclick="tnPick(${i});return false"><span class="ty">Module</span><div>${esc(m.label)}</div></a>`).join('')
    : '<div class="none">No matches.</div>'
  }</div>`;
}
window.tnSearch=tnSearch;
function tnPick(i){
  const m=_tnResultList[i]; if(!m) return;
  window.open(m.id+'.html','tool_'+m.id);
  document.getElementById('tnResults').innerHTML='';
  document.getElementById('tnSearchInput').value='';
}
window.tnPick=tnPick;

// Contact button -- hands the visitor's live Supabase session token to
// Hub's /auth/sso endpoint so they land there already signed in. Falls
// back to a bare (logged-out) open if getSession() fails for any reason.
const CONTACT_URL = 'https://hub-backend-psi.vercel.app';
async function openContact(){
  let url = CONTACT_URL;
  try{
    const { data } = await sb.auth.getSession();
    const t = data && data.session && data.session.access_token;
    if(t) url = CONTACT_URL + '/auth/sso?token=' + encodeURIComponent(t);
  }catch(e){ /* fall through to plain (logged-out) open */ }
  window.open(url, 'tool_Contact');
}
window.openContact=openContact;
function tnSearchKey(ev){
  if(ev.key==='Enter' && _tnResultList.length){ tnPick(0); }
  if(ev.key==='Escape'){ document.getElementById('tnResults').innerHTML=''; ev.target.blur(); }
}
window.tnSearchKey=tnSearchKey;
function renderCtx(){
  const rs=document.getElementById('cRole');
  rs.innerHTML=CFG.users.map(u=>`<option value="${u.id}" ${u.id===UI.userId?'selected':''}>${esc(u.label)}</option>`).join('');
  document.getElementById('cVer').innerHTML=CFG.versions.map(v=>`<option value="${v.id}" ${v.id===UI.versionId?'selected':''}>${esc(v.name)}${v.locked?' 🔒':''}</option>`).join('');
  document.getElementById('cFy').innerHTML=CFG.time.years.map(y=>`<option ${y===UI.fy?'selected':''}>${y}</option>`).join('');
  document.getElementById('cGrain').innerHTML=CFG.time.grains.map(g=>`<option ${g===UI.grain?'selected':''}>${g}</option>`).join('');
}
function render(){
  const p=PAGES.find(x=>x.id===UI.page)||PAGES[0];
  document.getElementById('side').innerHTML=renderSide();
  document.getElementById('tnLinks').innerHTML=renderTnModuleLinks();
  document.getElementById('tnAcct').innerHTML=renderTnAcct();
  document.getElementById('main').innerHTML=p.fn() + (UI.helpOpen?helpPanelHtml():'');
  document.getElementById('layer').innerHTML=impactPanel()+overlayPanel()+pendingEditPanel();
  renderCtx();
  saveLocal();
  scheduleSupabaseSave();
}
function exportCfg(){
  const blob=new Blob([JSON.stringify(CFG,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='funnel-tool-config.json'; a.click();
  toast('Configuration exported.');
}
window.exportCfg=exportCfg;
document.getElementById('cRole').onchange=e=>{UI.userId=e.target.value;render();toast('Now acting as '+user().name+' — '+roleName());};
document.getElementById('cVer').onchange=e=>{UI.versionId=e.target.value;render();};
document.getElementById('cFy').onchange=e=>{UI.fy=e.target.value;render();};
document.getElementById('cGrain').onchange=e=>{UI.grain=e.target.value;CFG.time.grain=e.target.value;render();};
sb.auth.onAuthStateChange((event)=>{
  if(event==='SIGNED_OUT'){
    if(_skipNextSignOutReload){ _skipNextSignOutReload=false; return; }
    location.reload();
  }
});
bootApp();
</script>

<button id="fbTrigger" onclick="openFeedbackModal()" title="Report an issue" style="position:fixed;right:20px;bottom:20px;z-index:9999;width:48px;height:48px;border-radius:50%;background:#dc2626;color:#fff;border:none;box-shadow:0 4px 14px rgba(220,38,38,.4);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center">💬</button>
<div id="fbModal" onclick="if(event.target===this)closeFeedbackModal()" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.4);align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:10px;padding:20px;width:380px;max-width:92vw;box-shadow:0 12px 40px rgba(0,0,0,.25)">
    <h3 style="margin:0 0 10px;font-size:16px">Report an issue</h3>
    <p style="margin:0 0 12px;font-size:12px;color:#888">Page: <strong id="fbPageLabel"></strong></p>
    <div style="margin-bottom:10px"><label style="font-size:11px;font-weight:600;color:#666;display:block;margin-bottom:3px">Your name</label><input id="fbName" style="width:100%;font-size:13px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box"></div>
    <div style="margin-bottom:14px"><label style="font-size:11px;font-weight:600;color:#666;display:block;margin-bottom:3px">What went wrong?</label><textarea id="fbComment" rows="4" placeholder="Describe the issue..." style="width:100%;font-size:13px;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;resize:vertical"></textarea></div>
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button onclick="closeFeedbackModal()" style="padding:8px 14px;border:1px solid #d1d5db;background:#fff;border-radius:6px;cursor:pointer;font-size:13px">Cancel</button>
      <button id="fbSubmitBtn" onclick="submitFeedback()" style="padding:8px 14px;border:none;background:#111;color:#fff;border-radius:6px;cursor:pointer;font-size:13px">Submit</button>
    </div>
  </div>
</div>
<script>
const FEEDBACK_MODULE = 'Strategy';
function openFeedbackModal(){
  const nameEl=document.getElementById('fbName');
  if(nameEl) nameEl.value=(_myProfile&&_myProfile.name)?_myProfile.name:'';
  const pl=document.getElementById('fbPageLabel'); if(pl) pl.textContent=FEEDBACK_MODULE;
  const c=document.getElementById('fbComment'); if(c) c.value='';
  const m=document.getElementById('fbModal'); if(m) m.style.display='flex';
}
function closeFeedbackModal(){
  const m=document.getElementById('fbModal'); if(m) m.style.display='none';
}
async function submitFeedback(){
  const comment=(document.getElementById('fbComment').value||'').trim();
  if(!comment){ toast('Please describe the issue first.'); return; }
  if(!_orgId||!_myProfile){ toast('Not signed in yet -- try again in a moment.'); return; }
  const name=(document.getElementById('fbName').value||'').trim()||_myProfile.name||'';
  const btn=document.getElementById('fbSubmitBtn');
  if(btn) btn.disabled=true;
  try{
    const { error } = await sb.from('feedback_items').insert({
      org_id:_orgId, reporter_id:_myProfile.id, reporter_name:name,
      page:FEEDBACK_MODULE, url:location.href, comment:comment
    });
    if(error){ toast('Could not submit: '+error.message); return; }
    closeFeedbackModal();
    toast('Thanks -- issue reported.');
  }catch(e){
    toast('Could not reach the server.');
  }finally{
    if(btn) btn.disabled=false;
  }
}
</script>
