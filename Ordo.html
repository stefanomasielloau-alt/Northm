<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy — Marketing Planning &amp; Funnel Calculation</title>
<style>
:root{
  --nav:#1F3AC7; --nav-dk:#16299A; --ink:#10182B; --ink-2:#45506B; --ink-3:#7C879E;
  --surface:#FFFFFF; --canvas:#F2F4F8; --canvas-2:#E9EDF4; --line:#DFE3EB; --line-2:#EEF1F6;
  --input:#7B3FE4; --input-bg:#F7F2FE; --calc:#45506B;
  --s1:#10AEBF; --s2:#3B4CB8; --s3:#E0447B; --s4:#F0A429; --s5:#7B3FE4; --s6:#0E8A5F;
  --ok:#0E8A5F; --ok-bg:#E7F5EF; --warn:#C8791A; --warn-bg:#FDF4E7; --bad:#D0342C; --bad-bg:#FCEDEC;
  --r:8px; --r-sm:5px;
  --sh:0 1px 2px rgba(16,24,43,.05), 0 1px 3px rgba(16,24,43,.04);
  --sh-2:0 4px 16px rgba(16,24,43,.10);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); background:var(--canvas); color:var(--ink);
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.num,td.n,th.n,.kpi-v,input[type=number]{
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
  letter-spacing:-.01em;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--input);outline-offset:1px}

/* ---------- shell ---------- */
.topnav{background:var(--surface); border-bottom:1px solid var(--line); min-height:56px; display:flex; align-items:center; padding:0 18px; gap:16px; position:sticky; top:0; z-index:50; box-shadow:var(--sh); flex-wrap:wrap;}
.tn-brand{display:flex; align-items:center; gap:9px; flex-shrink:0; padding:8px 0;}
.tn-mk{width:34px;height:34px;border-radius:8px;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex-shrink:0;}
.tn-logo-icon{width:34px;height:34px;flex-shrink:0;object-fit:contain;}
.tn-brandtext{line-height:1.15}
.tn-name{font-weight:800; font-size:14.5px; color:var(--ink);}
.tn-sub{font-size:9px; letter-spacing:.08em; color:var(--ink-3); font-weight:700; text-transform:uppercase;}
.tn-links{display:flex; align-items:center; gap:2px; flex:1; overflow-x:auto; min-width:0;}
.tn-link{padding:7px 12px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--ink-2); text-decoration:none; white-space:nowrap; flex-shrink:0; display:inline-flex; align-items:center; gap:6px;}
.tn-link:hover{background:var(--canvas-2)}
.tn-link.on{background:var(--canvas-2); color:var(--ink); cursor:default;}
.tn-link .mk{width:16px;height:16px;border-radius:4px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:9px;flex-shrink:0;}
.tn-search{position:relative; flex-shrink:0;}
.tn-search .bx{display:flex; align-items:center; gap:6px; background:var(--canvas); border:1px solid var(--line); border-radius:7px; padding:6px 10px; width:190px;}
.tn-search input{border:none;background:transparent;outline:none;font-size:12.5px;flex:1;color:var(--ink); min-width:0;}
.tn-kbd{font-size:10px;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 5px;flex-shrink:0;}
.tn-results{position:absolute; top:calc(100% + 4px); left:0; width:260px; background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:var(--sh-2); z-index:60; max-height:320px; overflow-y:auto;}
.tn-results a{display:block; padding:8px 12px; text-decoration:none; color:var(--ink); font-size:12.5px; border-bottom:1px solid var(--line-2);}
.tn-results a:last-child{border-bottom:none}
.tn-results a:hover{background:var(--canvas-2)}
.tn-results .ty{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3); font-weight:700;}
.tn-results .none{padding:10px 12px; font-size:12px; color:var(--ink-3);}
.tn-acct{display:flex; align-items:center; gap:8px; flex-shrink:0; padding:8px 0;}
.tn-avatar{width:30px;height:30px;border-radius:50%;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;}
.tn-who{font-size:11.5px; line-height:1.3;}
.tn-who b{display:block; color:var(--ink); font-weight:700;}
.tn-who span{color:var(--ink-3);}
.tn-signout{font-size:10.5px; color:var(--ink-3); text-decoration:none;}
.tn-signout:hover{color:var(--ink)}
/* ---------- restored left-hand page nav (this tool's own pages) ---------- */
.wrap{display:flex;min-height:calc(100vh - 56px)}
.side{
  width:216px; flex:0 0 216px; background:#fff; border-right:1px solid var(--line);
  padding:10px 0 30px; position:sticky; top:56px; height:calc(100vh - 56px); overflow-y:auto
}
.side h4{
  margin:12px 14px 5px; font-size:9.5px; text-transform:uppercase; letter-spacing:.1em;
  color:var(--ink-3); font-weight:800
}
.navi{
  display:flex; gap:9px; align-items:baseline; padding:7px 14px; border-left:3px solid transparent;
  color:var(--ink-2); text-decoration:none; font-size:12.5px; font-weight:500
}
.navi:hover{background:var(--canvas)}
.navi.on{background:var(--canvas-2);border-left-color:var(--nav);color:var(--ink);font-weight:700}
.navi .ix{
  font-size:10px;font-weight:800;color:var(--ink-3);min-width:11px;
  font-variant-numeric:tabular-nums
}
.navi.on .ix{color:var(--nav)}
.navi .lk{font-size:9px;color:var(--ink-3);margin-left:auto;letter-spacing:.04em}
.main{flex:1;min-width:0;padding:16px 18px 60px}

/* Secondary context bar -- Strategy's Role/Version/FY/Grain selectors are load-bearing
   config, not decoration, so they get their own slim row under the main nav rather
   than being crammed into it or dropped. */
.ctxbar{background:var(--canvas); border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:center; padding:7px 24px; flex-wrap:wrap;}
.ctx{display:flex;gap:7px;align-items:center}
.ctx select{
  background:var(--surface); border:1px solid var(--line); color:var(--ink);
  border-radius:5px; padding:4px 7px; font-size:11.5px; font-weight:600; max-width:190px
}
.ctx select option{color:#10182B}
.ctx .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.phead{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.phead h1{margin:0;font-size:19px;font-weight:750;letter-spacing:-.025em}
.phead p{margin:3px 0 0;color:var(--ink-3);font-size:12px;max-width:640px}
.phead .sp{flex:1}

/* ---------- cards ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px}
.card>h3{
  margin:0; padding:9px 13px; font-size:12px; font-weight:700; letter-spacing:-.005em;
  border-bottom:1px solid var(--line-2); display:flex; align-items:center; gap:8px
}
.card>h3 .sp{flex:1}
.card .bd{padding:13px}
.card .bd.flush{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
@media(max-width:none){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g-2-1,.g-1-2{grid-template-columns:1fr}}
@media(max-width:860px){.side{display:none}.g2,.g4{grid-template-columns:1fr}}

/* ---------- kpi ---------- */
.kpis{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--sh)}
.kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700}
.kpi-v{font-size:21px;font-weight:700;letter-spacing:-.035em;margin-top:2px}
.kpi .sub{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.kpi.hl{background:linear-gradient(180deg,#fff,#F8FAFE);border-color:#CBD6F5}
.kpi.hl .kpi-v{color:var(--nav)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap}
thead th{
  background:#F7F9FC; font-size:10px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--ink-2); font-weight:800; border-bottom:1px solid var(--line); position:sticky; top:0
}
th.n,td.n{text-align:right}
tbody tr:hover{background:#FAFBFE}
td.lb{font-weight:650}
td.calc{color:var(--calc);font-style:italic}
tr.tot{background:#F7F9FC;font-weight:750}
tr.tot td{border-top:1.5px solid var(--line);border-bottom:none}
tr.sub td{background:#FCFDFE;font-size:11.5px;color:var(--ink-2)}
tr.gp td{background:var(--canvas-2);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--ink-2)}
.scroll{overflow:auto;max-height:none}
.scroll.cap{max-height:420px;resize:vertical;min-height:160px;overflow-y:auto;}

/* ---------- inputs ---------- */
.f{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.f label{font-size:10.5px;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.f .hint{font-size:10px;color:var(--ink-3);font-weight:400}
.in,input.in,select.in{
  border:1px solid #E1D3FA; border-radius:var(--r-sm); padding:6px 8px; background:var(--input-bg); width:100%; color:var(--ink)
}
.in:focus,input.in:focus,select.in:focus{border-color:var(--input);background:#fff}
.in:disabled,input.in:disabled,select.in:disabled{background:var(--canvas);border-color:var(--line);color:var(--ink-3);cursor:not-allowed}
.in.v{color:var(--input);font-weight:700;background:var(--input-bg);border-color:#E1D3FA;text-align:right}
select.in{text-align:left;font-weight:600}
input.cel{
  border:1px solid transparent;border-radius:3px;padding:2px 5px;width:78px;text-align:right;
  color:var(--input);font-weight:700;background:var(--input-bg)
}
input.cel:hover{border-color:#D9C6F8}
input.cel:focus{border-color:var(--input);background:#fff}
input.cel.w{width:56px}
input.cel.txt{text-align:left;width:130px}
input.cel.bad{background:var(--bad-bg);color:var(--bad)}
input.cel:disabled{background:var(--canvas);color:var(--ink-3);cursor:not-allowed}
.btn{
  border:1px solid var(--line); background:#fff; border-radius:var(--r-sm); padding:5px 11px;
  font-size:11.5px; font-weight:650; color:var(--ink-2); box-shadow:var(--sh)
}
.btn:hover{background:var(--canvas);color:var(--ink)}
.btn.pri{background:var(--nav);border-color:var(--nav);color:#fff}
.btn.pri:hover{background:var(--nav-dk)}
.btn.dgr{color:var(--bad);border-color:#F3CFCD}
.btn.dgr:hover{background:var(--bad-bg)}
.btn.sm{padding:2px 7px;font-size:10.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* ---------- misc ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{
  border:none;background:var(--canvas-2);padding:7px 12px;font-size:12px;font-weight:650;color:var(--ink-2);
  border-bottom:2px solid transparent;border-radius:6px 6px 0 0;white-space:nowrap
}
.tab:hover{background:var(--line-2);color:var(--ink)}
.tab.on{background:#fff;color:var(--nav);border-bottom-color:var(--nav)}
.pill{
  display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:20px;
  font-size:10px;font-weight:750;letter-spacing:.02em
}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.n{background:var(--canvas-2);color:var(--ink-2)}
.pill.v{background:var(--input-bg);color:var(--input)}
/* Shared status (RAG) pill -- same semantic scale + class names as Campaign Planning/Events
   (2026-08-13): grey not-started, blue on-track, amber at-risk, red behind/over,
   green completed, plus a gold star when actuals meaningfully beat plan. */
.rag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
.rag-grey{background:#E7EAF0;color:#5B6472}
.rag-blue{background:#E3E8FD;color:#1F3AC7}
.rag-amber{background:#FBEBD3;color:#B5730E}
.rag-red{background:#F8DEE0;color:#9C2B3C}
.rag-green{background:#DCF3E9;color:#0E8A5F}
.rag-exceed{color:#C9971A}
.note{
  background:#F7F9FC;border-left:3px solid var(--nav);border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:9px 12px;font-size:11.5px;color:var(--ink-2);margin-bottom:12px
}
.note strong{color:var(--ink)}
.note.w{background:var(--warn-bg);border-left-color:var(--warn)}
.note.b{background:var(--bad-bg);border-left-color:var(--bad)}
.note.g{background:var(--ok-bg);border-left-color:var(--ok)}
.bar{height:6px;background:var(--canvas-2);border-radius:3px;overflow:hidden;min-width:52px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--s1)}
.mini{font-size:10.5px;color:var(--ink-3)}
.dv{height:1px;background:var(--line-2);margin:11px 0}
.empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:12px}
.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--ink-2);padding:2px 0 0}
.lgd i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}
svg{display:block;max-width:100%}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.grab{cursor:grab;color:var(--ink-3);user-select:none;font-size:13px}
.tag{
  font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:1px 5px;border-radius:3px;background:var(--canvas-2);color:var(--ink-3)
}
/* impact registry — the signature panel */
.imp{border:1px solid #CBD6F5;border-radius:var(--r);background:linear-gradient(180deg,#FBFCFF,#F4F7FF);overflow:hidden}
.imp>header{
  padding:9px 13px;border-bottom:1px solid #DCE4F8;display:flex;align-items:center;gap:8px;
  font-size:11.5px;font-weight:800;color:var(--nav);letter-spacing:.01em
}
.imp>header .sp{flex:1}
.imp .body{padding:11px 13px}
.imp .hd{font-size:12.5px;font-weight:700;margin-bottom:8px}
.imp ul{margin:0;padding:0;list-style:none}
.imp li{
  display:flex;gap:9px;align-items:baseline;padding:4px 0;border-bottom:1px dashed #DCE4F8;font-size:11.5px
}
.imp li:last-child{border-bottom:none}
.imp li .c{
  font-variant-numeric:tabular-nums;font-weight:800;color:var(--nav);min-width:22px;text-align:right;font-size:12px
}
.imp li .w{flex:1;color:var(--ink-2)}
.imp li .w b{color:var(--ink);font-weight:650}
.imp .ftr{padding:9px 13px;border-top:1px solid #DCE4F8;display:flex;gap:7px;align-items:center;background:#fff}
.imp .ftr .sp{flex:1}
.imp.dang{border-color:#F3CFCD;background:linear-gradient(180deg,#FFFCFC,#FDF3F2)}
.imp.dang>header{color:var(--bad);border-bottom-color:#F3CFCD}
.imp.dang li{border-bottom-color:#F6DDDB}
.imp.dang li .c{color:var(--bad)}
.imp.dang .ftr{border-top-color:#F3CFCD}

/* modal */
.mask{
  position:fixed;inset:0;background:rgba(16,24,43,.42);z-index:80;display:grid;place-items:center;padding:18px
}
.modal{
  background:#fff;border-radius:10px;box-shadow:var(--sh-2);width:min(560px,100%);
  max-height:88vh;overflow:auto
}
.modal>h3{margin:0;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700}
.modal .bd{padding:16px}
.modal .ft{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#FAFBFE}
.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:12px;font-weight:600;
  box-shadow:var(--sh-2);animation:up .22s ease
}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.locked{opacity:.55;pointer-events:none}
.rn{color:var(--ink-3);font-size:10px;font-weight:700}
.authwrap{max-width:360px;margin:14vh auto;padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-2);}
.authwrap h2{margin:0 0 4px;font-size:18px;}
.authwrap p.sub{margin:0 0 20px;color:var(--ink-2);font-size:12.5px;}
.authwrap input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;margin-bottom:10px;box-sizing:border-box;}
.authwrap button{width:100%;padding:10px;border:none;border-radius:6px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;cursor:pointer;}
.authwrap .err{color:#B3261E;font-size:12px;margin:-4px 0 10px;min-height:14px;}
.authbrand{text-align:center;margin-bottom:14px;}
.authbrand img{width:auto;max-width:210px;height:auto;display:block;margin:0 auto 8px;}
.authbrand .ab-name{font-weight:800;font-size:18px;color:var(--ink);}
.authbrand .ab-ver{font-size:9px;letter-spacing:.08em;color:var(--ink-3);font-weight:700;text-transform:uppercase;margin-top:1px;}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

function campaignCommitted(camp){ return camp.rollupCommitted!=null ? camp.rollupCommitted : (camp.committed||0); }

/* ---------- shared status (RAG) colour system ----------
   Same semantic scale + class names as Campaign Planning/Events (2026-08-13). Thresholds are
   named constants (not magic numbers inline) so they're easy to find and tune without
   hunting through the function body -- ask if you want these pulled into a proper
   Process Maps-managed settings record synced across tools instead of per-file constants. */
const RAG_THRESHOLDS = {
  exceedActualRatio: 0.9,   // actual spend under (budget * this) once finished => "exceeding" star
  overBudgetRatio: 1.1,     // actual spend over (budget * this) once finished => red / over budget
  atRiskCommittedRatio: 1.0 // committed >= (budget * this) while still running => amber / at risk
};
function ragForCampaign(c){
  const today=new Date().toISOString().slice(0,10);
  if(c.start && c.start>today) return {tone:'grey',label:'Not started'};
  const committed=campaignCommitted(c), actual=campaignActualSpend(c);
  if(c.end && c.end<today){
    if(!c.budget) return {tone:'green',label:'Completed'};
    if(actual>c.budget*RAG_THRESHOLDS.overBudgetRatio) return {tone:'red',label:'Over budget'};
    const exceed = actual>0 && actual<c.budget*RAG_THRESHOLDS.exceedActualRatio;
    return {tone:'green',label:'Completed',exceed};
  }
  if(c.budget && committed>=c.budget*RAG_THRESHOLDS.atRiskCommittedRatio) return {tone:'amber',label:'At risk'};
  return {tone:'blue',label:'On track'};
}
function ragPillHtml(rag){
  return `<span class="rag rag-${rag.tone}">${esc(rag.label)}${rag.exceed?' <span class="rag-exceed">★</span>':''}</span>`;
}

/* scope enforcement */
/* org_units-based visibility grants (phase8/phase14, both optional/additive).
   Resolves the acting user's 'control' grants down through descendant nodes
   (control of a node covers everything beneath it) plus their direct
   'visibility' grants, into a flat set of org_unit ids they can see. Returns
   an empty set with zero cost if org_units/org_unit_access haven't been
   loaded (e.g. those migrations haven't been run yet) -- visibleRegions()
   below falls back to exactly its pre-existing behavior in that case. */
function myOrgUnitVisibility(){
  const units=CFG.orgUnits||[], grants=CFG.orgUnitAccess||[];
  if(!units.length || !grants.length) return new Set();
  const myGrants=grants.filter(g=>g.profileId===UI.userId);
  if(!myGrants.length) return new Set();
  const byParent={};
  units.forEach(u=>{ const k=u.parentId||'__root'; (byParent[k]=byParent[k]||[]).push(u); });
  const result=new Set();
  myGrants.forEach(g=>{
    result.add(g.orgUnitId);
    if(g.level==='control'){
      const stack=[g.orgUnitId];
      while(stack.length){
        const cur=stack.pop();
        (byParent[cur]||[]).forEach(child=>{ if(!result.has(child.id)){ result.add(child.id); stack.push(child.id); } });
      }
    }
  });
  return result;
}

/* ============================================================================
   CALCULATION ENGINE — resolves the chain from CFG.gates at runtime.
   No stage name is hardcoded anywhere below this line.
   ============================================================================ */
function chain(){ return CFG.gates.filter(g=>g.active).sort((a,b)=>a.order-b.order); }
const entryGate=()=>chain()[0];
const exitGate=()=>{ const c=chain(); return c[c.length-1]; };

function rateOf(g,mult=1){
  if(!g||g.entry||g.rate==null)return 1;
  return clamp(g.rate*mult,0,1);
}
function rateIssues(){
  const out=[],c=chain();
  if(c.length<2) out.push({gate:null,msg:'A funnel needs at least two gates.'});
  c.forEach((g,i)=>{
    if(i===0)return;
    if(g.rate===0)   out.push({gate:g,msg:'Rate is 0%. Backward planning cannot divide by zero. Enter 100% for a pass-through gate.'});
    if(g.rate==null) out.push({gate:g,msg:'No rate set.'});
    if(g.rate>1)     out.push({gate:g,msg:'Rate is above 100%.'});
  });
  return out;
}
function backward(target,mult=1){
  const c=chain(),out={};
  out[c[c.length-1].id]=target;
  for(let i=c.length-1;i>0;i--){
    const r=rateOf(c[i],mult);
    out[c[i-1].id]= r>0 ? out[c[i].id]/r : NaN;
  }
  return out;
}
function forward(entry,mult=1){
  const c=chain(),out={};
  out[c[0].id]=entry;
  for(let i=1;i<c.length;i++) out[c[i].id]=out[c[i-1].id]*rateOf(c[i],mult);
  return out;
}
function cumRate(gid,mult=1){
  const c=chain(); let r=1;
  for(let i=1;i<c.length;i++){ r*=rateOf(c[i],mult); if(c[i].id===gid)break; }
  return r;
}
/* campaign-level conversion override: manual entry, industry benchmark, or the org's own history —
   selectable side by side, per Section 6.1 of the target architecture. */
function historicalExitRate(){
  const vis=visibleRegions().map(r=>r.id);
  let lead=0,win=0;
  ['FY25','FY26','FY27'].forEach(fy=>{
    const acc=histSlice({fy:fy,regionIds:vis}).acc;
    lead+=acc[entryGate().id]||0; win+=acc[exitGate().id]||0;
  });
  return lead>0 ? win/lead : CFG.benchmarks.industryExitRate;
}
function campExitRate(camp,mult=1){
  if(camp.convOverride!=null && !isNaN(camp.convOverride)) return camp.convOverride;
  const s=seg(camp.segmentId);
  return cumRate(exitGate().id, mult*(s?s.rateMult:1));
}

/* ---------- snapshots: save / revert / compare (Section 6.6) ----------
   A snapshot is a full, plain-data copy of CFG (everything except the snapshot list itself,
   so snapshots don't nest). withCFGSnapshot() swaps a snapshot's data into the live CFG object,
   runs a calculation against it, then always restores the real CFG afterwards — even if the
   calculation throws — so a snapshot saved under an old gate set or version list can never
   leave the app in a broken state. */
function withCFGSnapshot(data,fn){
  const backup=JSON.parse(JSON.stringify(CFG));
  Object.keys(CFG).forEach(k=>delete CFG[k]);
  Object.assign(CFG,JSON.parse(JSON.stringify(data)));
  try{ return fn(); }
  finally{ Object.keys(CFG).forEach(k=>delete CFG[k]); Object.assign(CFG,backup); }
}
function saveSnapshot(name){

  logAudit('save snapshot',name); render(); toast('Snapshot saved: '+name);
}

  if(!confirm('Revert the whole plan to "'+snap.name+'" ('+F.dt(snap.timestamp)+')? Current unsaved changes will be lost — save a snapshot first if you want to keep them.'))return;
  const snapshots=CFG.snapshots;
  Object.keys(CFG).forEach(k=>delete CFG[k]);
  Object.assign(CFG,JSON.parse(JSON.stringify(snap.data)));
  CFG.snapshots=snapshots;
  logAudit('revert to snapshot',snap.name); render(); toast('Reverted to: '+snap.name);
}

/* ---------- snapshot overlay: diff two plans field-by-field, choose which differences to reapply ----------
   diffCFG() classifies every top-level CFG key as: an id-keyed array of rows (campaigns, gates, pods, reps...),
   a plain object of scalar fields (drivers, time, benchmarks), or an opaque value (seasonality, velocity) —
   that covers every shape actually used in CFG, so this stays a flat function rather than a general
   recursive differ. snapshots/audit are excluded — they are metadata about plans, not the plan itself. */
const DIFF_SKIP=['snapshots','audit'];
function diffCFG(oldData,newData){
  const changes=[];
  const keys=Array.from(new Set([...Object.keys(oldData||{}),...Object.keys(newData||{})])).filter(k=>!DIFF_SKIP.includes(k));
  keys.forEach(key=>{
    const a=oldData[key],b=newData[key];
    if(Array.isArray(a)||Array.isArray(b)){
      const sample=(a&&a[0])||(b&&b[0]);
      if(sample&&sample.id!==undefined){
        const aMap={}; (a||[]).forEach(r=>aMap[r.id]=r);
        const bMap={}; (b||[]).forEach(r=>bMap[r.id]=r);
        const ids=Array.from(new Set([...Object.keys(aMap),...Object.keys(bMap)]));
        ids.forEach(id=>{
          const ra=aMap[id],rb=bMap[id];
          if(ra&&!rb) changes.push({path:key,id:id,kind:'removed',label:(ra.name||id),oldValue:ra,newValue:null});
          else if(!ra&&rb) changes.push({path:key,id:id,kind:'added',label:(rb.name||id),oldValue:null,newValue:rb});
          else{
            const fields=Array.from(new Set([...Object.keys(ra),...Object.keys(rb)]));
            fields.forEach(f=>{
              if(f==='id')return;
              if(JSON.stringify(ra[f])!==JSON.stringify(rb[f]))
                changes.push({path:key,id:id,field:f,kind:'field',label:(ra.name||id)+' · '+f,oldValue:ra[f],newValue:rb[f]});
            });
          }
        });
      } else if(JSON.stringify(a)!==JSON.stringify(b)){
        changes.push({path:key,kind:'array',label:key,oldValue:a,newValue:b});
      }
    } else if(a&&typeof a==='object'&&b&&typeof b==='object'){
      const fields=Array.from(new Set([...Object.keys(a),...Object.keys(b)]));
      fields.forEach(f=>{
        if(JSON.stringify(a[f])!==JSON.stringify(b[f]))
          changes.push({path:key,field:f,kind:'scalar',label:key+'.'+f,oldValue:a[f],newValue:b[f]});
      });
    } else if(JSON.stringify(a)!==JSON.stringify(b)){
      changes.push({path:key,kind:'top',label:key,oldValue:a,newValue:b});
    }
  });
  return changes;
}
/* CFG array key -> Supabase table, for the 'removed' branch below only (added/field/scalar
   are all upsert-safe already, since the next autosave upserts whatever's still in CFG). */
const CFG_ARRAY_TABLE = {
  gates:'gates', regions:'regions', pods:'pods', reps:'reps', streams:'streams', routes:'routes',
  activities:'activities', segments:'segments', costBuckets:'cost_buckets', programmes:'programmes',
  versions:'versions', roles:'roles', campaignPodAllocations:'campaign_pod_allocations', campaigns:'campaigns'
};
function applyDiffChange(c){
  if(c.kind==='field'){ const row=byId(CFG[c.path],c.id); if(row) row[c.field]=JSON.parse(JSON.stringify(c.newValue)); }
  else if(c.kind==='added'){ CFG[c.path].push(JSON.parse(JSON.stringify(c.newValue))); }
  else if(c.kind==='removed'){
    CFG[c.path]=CFG[c.path].filter(r=>r.id!==c.id);
    const table=CFG_ARRAY_TABLE[c.path]; if(table) deleteRow(table,c.id);
  }
  else if(c.kind==='scalar'){ CFG[c.path][c.field]=JSON.parse(JSON.stringify(c.newValue)); }
  else { CFG[c.path]=JSON.parse(JSON.stringify(c.newValue)); }
}

/* generates e.g. ORD-CAM-0001 once a tracking convention has been imported from Configuration; falls back
   to the plain internal id when none has been set up yet, so nothing is required to keep working. */
function nextTrackingRef(type){
  const tc=CFG.trackingConfig; if(!tc) return null;
  const modCode=(tc.modCodes&&tc.modCodes.ordo)||'ORD';
  const typeCode=(tc.typeCodes&&tc.typeCodes[type])||type.toUpperCase().slice(0,3);
  tc.mySeq=tc.mySeq||{};
  const key=typeCode;
  tc.mySeq[key]=(tc.mySeq[key]||0)+1;
  const seq=String(tc.mySeq[key]).padStart(tc.seqPadding||4,'0');
  return tc.pattern.replace('{mod}',modCode).replace('{type}',typeCode).replace('{seq}',seq);
}

const HIST={};
/* Illustrative sample history only — deterministic filler standing in for a real CRM/MAP
   feed (see comment above), never persisted to the database. Used to depend on CFG being
   available synchronously at parse time; now that CFG loads from Supabase after login,
   this has to run as an explicit function called once loadFromSupabase() has populated
   CFG, instead of an IIFE that ran immediately at script load. Weight lookups are keyed
   by name rather than the old hardcoded sample ids, since real ids are now UUIDs. */
function buildHist(){
  const rw={ANZ:0.24,Japan:0.19,SEA:0.42,India:0.15};
  const aw={'SDR / BDR':0.22,'Web / Organic':0.19,'Events':0.13,'Social / Paid':0.16,'BDM Self-gen':0.11,'Syndication':0.08,'Webinar':0.07,'Partner Led':0.04};
  const gw={'Enterprise':0.24,'Mid-Market':0.46,'SMB':0.30};
  MONTHS.forEach((mo,mi)=>{
    HIST[mo.key]={};
    const growth=1+mi*0.011, season=CFG.seasonality[fyPos(mo)];
    R().forEach(r=>{
      HIST[mo.key][r.id]={};
      A().forEach(a=>{
        HIST[mo.key][r.id][a.id]={};
        G().forEach(sg=>{
          const base=1450*(rw[r.name]||0.1)*(aw[a.name]||0.1)*(gw[sg.name]||0.3)*growth*season;
          const leads=Math.max(0,Math.round(jit(base,0.24)));
          const rec={}; let prev=leads;
          chain().forEach((g,i)=>{
            if(i===0){rec[g.id]=leads;return;}
            const ar=clamp(jit(rateOf(g)*sg.rateMult,0.28),0.005,1);
            prev=prev*ar; rec[g.id]=Math.round(prev*100)/100;
          });
          rec._cost=Math.round(leads*a.costPer*jit(1,0.12));
          rec._acv =Math.round(rec[exitGate().id]*CFG.drivers.avgDealSize*sg.dealMult);
          HIST[mo.key][r.id][a.id][sg.id]=rec;
        });
      });
    });
  });
}

function histSlice(o){
  o=o||{};
  const months=MONTHS.filter(m=>(!o.fy||fyOf(m)===o.fy)&&(!o.monthKey||m.key===o.monthKey));
  const rids=o.regionIds||R().map(r=>r.id), aids=o.activityIds||A().map(a=>a.id), gids=o.segmentIds||G().map(s=>s.id);
  const acc={}; chain().forEach(g=>acc[g.id]=0); acc._cost=0; acc._acv=0;
  months.forEach(m=>rids.forEach(rid=>aids.forEach(aid=>gids.forEach(gid=>{
    const rec=HIST[m.key]&&HIST[m.key][rid]&&HIST[m.key][rid][aid]&&HIST[m.key][rid][aid][gid];
    if(!rec)return;
    chain().forEach(g=>acc[g.id]+=(rec[g.id]||0));
    acc._cost+=rec._cost||0; acc._acv+=rec._acv||0;
  }))));
  return {acc:acc,months:months.length};
}
function observedRates(o){
  const acc=histSlice(o).acc,c=chain(),out={};
  for(let i=1;i<c.length;i++){
    const den=acc[c[i-1].id];
    out[c[i].id]={rate:den>0?acc[c[i].id]/den:null,n:Math.round(den)};
  }
  return out;
}
/* Does stored history still resolve against the configured gate set?
   Changing gate IDs orphans stored facts. Never show zero and call it an actual. */
function histGateKeys(){
  const mk=Object.keys(HIST)[0]; if(!mk)return [];
  const r=Object.keys(HIST[mk])[0]; if(!r)return [];
  const a=Object.keys(HIST[mk][r])[0]; if(!a)return [];
  const s=Object.keys(HIST[mk][r][a])[0]; if(!s)return [];
  return Object.keys(HIST[mk][r][a][s]).filter(k=>k.charAt(0)!=='_');
}
function histCoverage(){
  const stored=histGateKeys(), live=chain().map(g=>g.id);
  const resolved=live.filter(id=>stored.indexOf(id)>=0);
  const noHistory=chain().filter(g=>stored.indexOf(g.id)<0);
  const orphaned=stored.filter(id=>live.indexOf(id)<0);
  return {stored:stored,resolved:resolved,noHistory:noHistory,orphaned:orphaned,
          full:noHistory.length===0, none:resolved.length===0};
}

function confBand(n){
  if(!n||n<=0) return {label:'No data',cls:'bad'};
  if(n<30)   return {label:'Very low · n='+F.n(n),cls:'bad'};
  if(n<150)  return {label:'Low · n='+F.n(n),cls:'warn'};
  if(n<1000) return {label:'Moderate · n='+F.n(n),cls:'n'};
  return {label:'High · n='+F.n(n),cls:'ok'};
}

/* ============================================================================
   SUPABASE — load/save the whole plan for the signed-in user's org.
   Every existing mutation function above and below this block is UNCHANGED —
   they all just read/write the in-memory CFG object exactly as before. Only
   the edges (load on open, save on every render) now talk to a real database
   instead of localStorage's hardcoded defaults.

   The "fast-follow" below: saves used to be UPSERT-only -- removing a row in an admin
   list updated the session's view immediately, but the underlying database row was
   never deleted, so it reappeared on next login. deleteRow() (2026-08-17, phase20)
   closes that gap with a real DELETE, fired from each remove*() function alongside
   the local CFG filter, so the UI still updates instantly but the row is actually gone.
   ============================================================================ */
let _orgId = null, _myProfile = null, _saveTimer = null, _realtimeChannel = null;
/* Set right before an internal (non-user-initiated) signOut() -- e.g. bootApp()'s error path
   below -- so the global onAuthStateChange listener knows to skip its reload-on-SIGNED_OUT and
   let the error message stay on screen instead of wiping it out immediately. Without this, the
   error flashes for a frame and then vanishes, which is exactly the "flash and it's gone" bug. */
let _skipNextSignOutReload = false;

async function upsertRows(table, rows, mapFn){
  if(!rows || !rows.length) return;
  try{
    const payload = rows.map(r=>Object.assign(mapFn(r), {org_id:_orgId}));
    const { error } = await sb.from(table).upsert(payload);
    if(error) throw error;
  }catch(e){ console.error('Save failed for '+table, e); toast('Could not save '+table+' to the database — see console.'); }
}
/* Fire-and-forget real delete, called alongside the local CFG.x.filter() in every
   remove*() function below -- see the phase20 note above. Deliberately not awaited by
   callers (same fire-and-forget pattern as scheduleSupabaseSave for edits) so the UI
   stays instant; a failure just toasts and logs, it doesn't roll back the local removal
   (same trust model as every other save in this app -- see the UPSERT error handling). */
async function deleteRow(table, id){
  if(!_orgId || !id) return;
  try{
    const { error } = await sb.from(table).delete().eq('id', id).eq('org_id', _orgId);
    if(error) throw error;
  }catch(e){ console.error('Delete failed for '+table, e); toast('Removed here, but could not delete from the database — see console.'); }
}

    upsertRows('gates', CFG.gates, g=>({id:g.id,name:g.name,code:g.code,order:g.order,entry:!!g.entry,rate:g.rate,active:!!g.active,note:g.note||''})),
    upsertRows('regions', CFG.regions, r=>({id:r.id,name:r.name,code:r.code,ae_heads:r.aeHeads||0,acv_target:r.acvTarget||0,unassigned:!!r.unassigned})),
    upsertRows('pods', CFG.pods, p=>({id:p.id,name:p.name,region_id:p.regionId,share:p.share||0,unassigned:!!p.unassigned})),
    upsertRows('reps', CFG.reps, r=>({id:r.id,name:r.name,pod_id:r.podId,share:r.share||0})),
    upsertRows('streams', CFG.streams, s=>({id:s.id,name:s.name,mix:s.mix||0,mkt_contrib:s.mktContrib||0,unassigned:!!s.unassigned})),
    upsertRows('routes', CFG.routes, r=>({id:r.id,name:r.name})),
    upsertRows('activities', CFG.activities, a=>({id:a.id,name:a.name,route_id:a.routeId,cost_per:a.costPer||0,cap_month:a.capMonth||0,active:!!a.active,unassigned:!!a.unassigned,pre_chain:a.preChain||[]})),
    upsertRows('segments', CFG.segments, s=>({id:s.id,name:s.name,tier:s.tier,addressable:s.addressable||0,engaged:s.engaged||0,mix:s.mix||0,rate_mult:s.rateMult==null?1:s.rateMult,deal_mult:s.dealMult==null?1:s.dealMult,unassigned:!!s.unassigned})),
    upsertRows('cost_buckets', CFG.costBuckets, c=>({id:c.id,code:c.code,label:c.label,dept:c.dept||'Marketing',ext_code:c.extCode||''})),
    upsertRows('programmes', CFG.programmes, p=>({id:p.id,name:p.name,owner:p.owner||'',focus:p.focus||'',status:p.status||'Active',tracking_ref:p.trackingRef||null,cloned_from_id:p.clonedFromId||null})),

    upsertRows('roles', CFG.roles, r=>({id:r.id,name:r.name,config:!!r.config,publish:!!r.publish,write_all:!!r.writeAll,scope:r.scope,description:r.desc||'',require_commit_on_edit:!!r.requireCommitOnEdit})),

    /* campaigns is a shared table Campaign Planning also writes to — upsert only, same as everything
       else above, so no special handling needed beyond the field mapping. */
    upsertRows('campaigns', CFG.campaigns, c=>({
      id:c.id,name:c.name,programme_id:c.programmeId,activity_id:c.activityId,segment_id:c.segmentId,
      region_id:c.regionId,cost_bucket_id:c.costBucketId,start_date:c.start||null,end_date:c.end||null,

      rate_source:c.rateSource||'manual',source:c.source||'Manual',ext_ref:c.extRef||'',crm_ref:c.crmRef||null
    })),
    (async()=>{
      const row = {
        org_id:_orgId, avg_deal_size:CFG.drivers.avgDealSize||0, projected_revenue:CFG.drivers.projectedRevenue||0,
        win_target:CFG.drivers.winTarget||0, bottom_up_leads:CFG.drivers.bottomUpLeads||0,

      };
      const { error } = await sb.from('org_settings').upsert(row);
      if(error){ console.error('Save failed for org_settings', error); toast('Could not save settings to the database — see console.'); }
    })()
  ]);
}

/* Live notifications: subscribe to audit_log INSERTs for this org so an action
   taken in another tab/tool shows up here as a toast without a reload. Own
   actions are skipped (via user_id) since they're already toasted locally.
   This is notification-only -- it does NOT live-sync the underlying record
   (a campaign, a deal, etc); reload or navigate to see that reflected in place. */
function subscribeRealtime(){
  if(_realtimeChannel || !_orgId) return;
  _realtimeChannel = sb.channel('audit_log_org_'+_orgId)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'audit_log', filter:'org_id=eq.'+_orgId }, payload=>{
      const row = payload.new || {};
      if(_myProfile && row.user_id && row.user_id===_myProfile.id) return;
      /* phase18: a targeted alert_people row carries a resolved target_user_ids list --
         only toast a viewer whose own id is in it. Absent/empty (almost every row, and
         any 'org'-targeted alert) keeps the original broadcast-to-everyone behaviour. The
         row still joins the shared audit trail either way -- only the live toast is gated. */
      const targeted = Array.isArray(row.target_user_ids) && row.target_user_ids.length>0;
      const forMe = !targeted || (_myProfile && row.target_user_ids.includes(_myProfile.id));
      if(forMe) toast((row.what||'Update')+(row.detail?' — '+row.detail:''));
      if(CFG.audit){ CFG.audit.unshift({ts:row.ts,what:row.what,detail:row.detail}); if(CFG.audit.length>150) CFG.audit.pop(); }
      render();
    })
    .subscribe();
}

function commitPending(){

function SET(path,val,opts){
  opts=opts||{};
  const num = opts.type==='num'||opts.type==='pct'||opts.type==='money';
  let v = num ? parseFloat(String(val).replace(/[$,%\s]/g,'')) : val;
  if(num&&isNaN(v))return;
  if(opts.type==='pct') v=v/100;
  const parts=path.split('.'); let o=CFG;
  for(let i=0;i<parts.length-1;i++){
    const p=parts[i];
    o = /^\d+$/.test(p) ? o[+p] : o[p];
    if(o==null)return;
  }
  o[parts[parts.length-1]]=v;
  logAudit('edit',path+' → '+(opts.type==='pct'?F.p(v):v));
  render();
}
const PLAN_EDIT_FIELDS={ campaigns:['budget','start','end','committed','actual','convOverride'] };
function setIn(arr,id,field,val,type){
  const it=byId(CFG[arr],id); if(!it)return;
  if(PLAN_EDIT_FIELDS[arr]&&PLAN_EDIT_FIELDS[arr].includes(field)&&!CFG.isPlatformAdmin&&role()&&role().requireCommitOnEdit){
    queuePlanEdit(arr,id,field,val,type); return;
  }
  let v=val;
  if(type==='num'||type==='pct'||type==='money'){ v=parseFloat(String(val).replace(/[$,%\s]/g,'')); if(isNaN(v))return; if(type==='pct')v=v/100; }
  const old=it[field]; it[field]=v;
  logAudit('edit',arr+'/'+(it.name||id)+'.'+field+': '+(type==='pct'?F.p(old)+' → '+F.p(v):old+' → '+v));
  render();
}

/* ---------- plan-edit commit queue (role-gated, see CFG.roles.requireCommitOnEdit) ----------
   Lighter than the structural impact-panel/commit flow above -- this is one field, old value to
   new value, commit or cancel. Only one edit can be pending at a time, matching the structural
   flow's UI.pending pattern, so a user can't stack up silent unconfirmed changes. */
function queuePlanEdit(arr,id,field,val,type){
  const it=byId(CFG[arr],id); if(!it)return;
  let v=val;
  if(type==='num'||type==='pct'||type==='money'){ v=parseFloat(String(val).replace(/[$,%\s]/g,'')); if(isNaN(v))return; if(type==='pct')v=v/100; }
  UI.pendingEdit={arr:arr,id:id,field:field,type:type,label:it.name||id,oldVal:it[field],newVal:v};
  render();
  toast('Edit queued — review and commit below before it applies.');
}
function commitPlanEdit(){
  const p=UI.pendingEdit; if(!p)return;
  const it=byId(CFG[p.arr],p.id); if(!it){ UI.pendingEdit=null; render(); return; }
  it[p.field]=p.newVal;
  logAudit('commit plan edit',p.arr+'/'+p.label+'.'+p.field+': '+(p.type==='pct'?F.p(p.oldVal)+' → '+F.p(p.newVal):p.oldVal+' → '+p.newVal));
  UI.pendingEdit=null; render(); toast('Committed.');
}
window.commitPlanEdit=commitPlanEdit;

/* ---------- per-activity pre-Lead chain (optional) -----------------------------------------
   Each activity type can define its own channel-specific stages before the universal Lead gate
   -- e.g. Paid/SEO: Impressions -> Clicks; Syndication: Single opt-in click -> Double opt-in
   click. The shared Lead-onward chain (MQL/SQL/SAO/SQO/Win) is completely untouched by this --
   a pre-chain only ever feeds INTO Lead, one layer earlier, for activities that have one
   defined. rateToNext on a stage is its conversion rate into the next stage in the array (or
   into Lead, for the last stage), so a Lead count can be walked backward through the chain the
   same way backward() walks the main chain. */
const activityPreChain=id=>{ const a=act(id); return a&&a.preChain?a.preChain.slice().sort((x,y)=>x.order-y.order):[]; };
function preChainVolumes(activityId,leadCount){
  const stages=activityPreChain(activityId);
  const out={}; let v=leadCount;
  for(let i=stages.length-1;i>=0;i--){
    const s=stages[i];
    v = s.rateToNext? v/s.rateToNext : null;
    out[s.id]=v;
    if(v==null) break;
  }
  return out;
}
function addPreStage(activityId){
  const a=act(activityId); if(!a)return;
  a.preChain=a.preChain||[];
  const nextOrder=a.preChain.length?Math.max.apply(null,a.preChain.map(s=>s.order))+10:10;
  a.preChain.push({id:uid('pc'),name:'New stage',order:nextOrder,rateToNext:0});
  logAudit('add pre-chain stage',a.name); render();
}
window.addPreStage=addPreStage;
function removePreStage(activityId,stageId){
  const a=act(activityId); if(!a)return;
  a.preChain=(a.preChain||[]).filter(s=>s.id!==stageId);
  logAudit('remove pre-chain stage',a.name); render();
}
window.removePreStage=removePreStage;
function setPreStage(activityId,stageId,field,val,type){
  const a=act(activityId); if(!a)return;
  const s=(a.preChain||[]).find(x=>x.id===stageId); if(!s)return;
  let v=val;
  if(type==='num'||type==='pct'){ v=parseFloat(String(val).replace(/[%\s]/g,'')); if(isNaN(v))return; if(type==='pct')v=v/100; }
  s[field]=v;
  logAudit('edit pre-chain stage',a.name+'.'+field); render();
}

function validations(){
  const v=[];
  const st=streamMixTotal(); if(Math.abs(st-1)>0.0001) v.push({s:'bad',t:'Stream mix totals '+F.p(st,0)+', not 100%'});
  const sg=segMixTotal();    if(Math.abs(sg-1)>0.0001) v.push({s:'bad',t:'Segment mix totals '+F.p(sg,0)+', not 100%'});
  R().forEach(r=>{ const t=podShareTotal(r.id);
    if(Math.abs(t-1)>0.0001) v.push({s:'bad',t:esc(r.name)+' pod shares total '+F.p(t,0)}); });
  rateIssues().forEach(i=>v.push({s:'bad',t:(i.gate?i.gate.name+': ':'')+i.msg}));
  CFG.campaigns.forEach(c=>{ if(c.start&&c.end&&c.end<c.start) v.push({s:'warn',t:'Campaign "'+esc(c.name)+'" ends before it starts'}); });
  const hi=CFG.feeds.filter(f=>f.unassigned>0.05);
  hi.forEach(f=>v.push({s:'warn',t:'Unassigned rate '+F.p(f.unassigned,1)+' on '+esc(f.name.split('—')[0].trim())}));
  const hc=histCoverage();
  if(hc.none) v.push({s:'bad',t:'No configured gate resolves against stored history — actuals cannot be read'});
  else if(hc.noHistory.length) v.push({s:'warn',t:hc.noHistory.length+' gate'+(hc.noHistory.length>1?'s have':' has')+' no history: '+hc.noHistory.map(g=>g.name).join(', ')});
  if(hc.orphaned.length) v.push({s:'warn',t:hc.orphaned.length+' stored gate key'+(hc.orphaned.length>1?'s':'')+' no longer used — needs remapping'});
  return v;
}

    <div class="kpi"><div class="k">Avg deal (base)</div><div class="kpi-v">${F.mk(d.avgDealSize)}</div><div class="sub">before segment blend</div></div>
    <div class="kpi"><div class="k">Avg deal (blended)</div><div class="kpi-v">${F.mk(blendedDeal())}</div><div class="sub">segment weighted</div></div>
    <div class="kpi"><div class="k">Implied wins</div><div class="kpi-v">${F.n(d.projectedRevenue/blendedDeal(),0)}</div><div class="sub">revenue ÷ blended deal</div></div>
    <div class="kpi"><div class="k">End-to-end rate</div><div class="kpi-v">${F.p(cumRate(exitGate().id),2)}</div><div class="sub">${esc(entryGate().name)} → ${esc(exitGate().name)}</div></div>
  </div>`;
  h+=`<div class="grid g-1-2">
    <div class="card"><h3>Global drivers</h3><div class="bd">
      <div class="f"><label>Average deal size</label>
        <input class="in v" value="${d.avgDealSize}" ${ro} onchange="SET('drivers.avgDealSize',this.value,{type:'money'})">
        <span class="hint">Base. Segment deal multipliers apply on top.</span></div>
      <div class="f"><label>Projected sales revenue per year</label>
        <input class="in v" value="${d.projectedRevenue}" ${ro} onchange="SET('drivers.projectedRevenue',this.value,{type:'money'})"></div>
      <div class="f"><label>${esc(exitGate().name)} target for the year</label>
        <input class="in v" value="${d.winTarget}" ${ro} onchange="SET('drivers.winTarget',this.value,{type:'num'})">
        <span class="hint">The number the whole model plans backwards from.</span></div>
      <div class="f"><label>Bottom-up entry volume (${esc(entryGate().name)})</label>
        <input class="in v" value="${d.bottomUpLeads}" ${ro} onchange="SET('drivers.bottomUpLeads',this.value,{type:'num'})"></div>
      <div class="dv"></div>
      <div class="mini"><b>Reconciliation.</b> Revenue ÷ blended deal = ${F.n(d.projectedRevenue/blendedDeal(),0)} wins
        vs a ${F.n(d.winTarget)} entered target.
        ${Math.abs(d.projectedRevenue/blendedDeal()-d.winTarget)<5
          ? '<span class="pill ok">Ties</span>'
          : '<span class="pill warn">Gap of '+F.n(Math.abs(d.projectedRevenue/blendedDeal()-d.winTarget),0)+'</span>'}</div>
    </div></div>
    <div class="card"><h3>Rate library <span class="sp"></span>
      <button class="btn sm" ${ro} onclick="adoptObserved()">Adopt observed rates</button></h3>
      <div class="bd flush"><table><thead><tr><th>Gate</th><th class="n">Published rate</th>
        <th class="n">Observed in history</th><th>Evidence</th><th class="n">Delta</th><th class="n">Cumulative</th></tr></thead><tbody>`;
  c.forEach((g,i)=>{
    if(i===0){ h+=`<tr><td class="lb">${esc(g.name)}</td><td class="n mini">entry</td><td class="n mini">—</td>
      <td class="mini">—</td><td class="n">—</td><td class="n calc">100%</td></tr>`; return; }
    const o=obs[g.id]||{},cb=confBand(o.n);
    const delta=(o.rate!=null)?(g.rate-o.rate):null;
    h+=`<tr><td class="lb">${esc(g.name)}</td>
      <td class="n"><input class="cel w ${g.rate===0?'bad':''}" value="${(g.rate*100).toFixed(1)}" ${ro} onchange="setIn('gates','${g.id}','rate',this.value,'pct')"></td>
      <td class="n calc">${o.rate!=null?F.p(o.rate,1):'—'}</td>
      <td><span class="pill ${cb.cls}">${cb.label}</span></td>
      <td class="n">${delta!=null?`<span class="pill ${Math.abs(delta)>0.05?'warn':'ok'}">${F.sp(delta,1)}</span>`:'—'}</td>
      <td class="n calc">${F.p(cumRate(g.id),2)}</td></tr>`;
  });
  h+=`</tbody></table></div>
    <div class="bd"><div class="mini"><b>Evidence bands.</b> A rate backed by 8 observations is shown differently from one
      backed by 4,000. Adopting observed rates overwrites the published rate and logs the change.</div></div></div></div>`;
  h+=`<div class="grid g2">
    <div class="card"><h3>Segment rate multipliers</h3><div class="bd">
      ${svgBars(G().map(s=>({k:s.name,v:s.rateMult,k2:F.p(s.mix,0)+' of mix'})),{h:180,dec:2})}
      <div class="mini" style="margin-top:6px">Blended multiplier <b>${segBlend().toFixed(3)}</b> — applied to every published rate.</div>
    </div></div>
    <div class="card"><h3>Stream marketing contribution</h3><div class="bd">
      ${svgBars(S().map(s=>({k:s.name,v:CFG.drivers.winTarget*s.mix*s.mktContrib,k2:F.p(s.mktContrib,0)})),{h:180,dec:1})}
      <div class="mini" style="margin-top:6px">Marketing-attributed wins by stream. Total
        <b>${F.n(sum(S().map(s=>CFG.drivers.winTarget*s.mix*s.mktContrib)),1)}</b>.</div>
    </div></div></div>`;
  return h;
}
function adoptObserved(){
  const obs=observedRates({fy:null});
  chain().forEach((g,i)=>{ if(i===0)return; const o=obs[g.id]; if(o&&o.rate!=null&&o.n>=30) g.rate=Math.round(o.rate*1000)/1000; });
  logAudit('adopt observed rates','gates with n>=30 updated from history'); render(); toast('Published rates updated from history where n ≥ 30.');
}

/* ============================================================================
   MODULE 2 — PLANNING ENGINE
   ============================================================================ */
function pagePlan(){
  if(calcBlocked()) return blockedPanel('Planning engine');
  const c=chain(),d=CFG.drivers,m=verMult()*segBlend();
  const top=backward(d.winTarget,m), bot=forward(d.bottomUpLeads,m);
  let h=`<div class="phead"><div><h1>Planning engine</h1>
    <p>Top-down works up from the ${esc(exitGate().name)} target. Bottom-up works down from ${esc(entryGate().name)} volume. Reconciliation reports the gap rather than hiding it.</p></div></div>`;
  h+=`<div class="tabs">
    <button class="tab ${UI.planTab==='top'?'on':''}" onclick="go('plan','top')">Top-down</button>
    <button class="tab ${UI.planTab==='bot'?'on':''}" onclick="go('plan','bot')">Bottom-up</button>
    <button class="tab ${UI.planTab==='streamcmp'?'on':''}" onclick="go('plan','streamcmp')">Compare by stream</button>
    <button class="tab ${UI.planTab==='rec'?'on':''}" onclick="go('plan','rec')">Reconciliation</button>
    <button class="tab ${UI.planTab==='phase'?'on':''}" onclick="go('plan','phase')">Time phasing</button></div>`;

  if(UI.planTab==='top'){
    h+=`<div class="kpis">${c.map((g,i)=>`<div class="kpi ${i===c.length-1?'hl':''}">
      <div class="k">${esc(g.name)}</div><div class="kpi-v">${F.n(top[g.id])}</div>
      <div class="sub">${i===0?'entry':F.p(rateOf(g,m),1)+' in'}</div></div>`).join('')}</div>`;
    h+=`<div class="card"><h3>Funnel required to land ${F.n(d.winTarget)} ${esc(exitGate().name)}</h3>
      <div class="bd">${svgFunnel(c.map(g=>top[g.id]),c.map(g=>g.name),640)}</div></div>`;
    h+=`<div class="card"><h3>By stream</h3><div class="bd flush"><table><thead><tr>
      <th>Stream</th><th class="n">Mix</th>${gTh()}<th class="n">Mktg wins</th><th class="n">ACV</th></tr></thead><tbody>`;
    S().forEach(s=>{
      const v=backward(d.winTarget*s.mix,m);
      h+=`<tr><td class="lb">${esc(s.name)}</td><td class="n">${F.p(s.mix,0)}</td>${gTd(v)}
        <td class="n calc">${F.n(d.winTarget*s.mix*s.mktContrib,1)}</td>
        <td class="n calc">${F.mk(d.winTarget*s.mix*blendedDeal())}</td></tr>`;
    });
    const tt=backward(d.winTarget*streamMixTotal(),m);
    h+=`<tr class="tot"><td>Total</td><td class="n">${F.p(streamMixTotal(),0)}</td>${gTd(tt)}
      <td class="n">${F.n(sum(S().map(s=>d.winTarget*s.mix*s.mktContrib)),1)}</td>
      <td class="n">${F.mk(d.winTarget*streamMixTotal()*blendedDeal())}</td></tr>`;
    h+=`</tbody></table></div></div>`;
    h+=`<div class="card"><h3>Marketing contribution build-up</h3><div class="bd">
      ${svgWaterfall(S().map(s=>({k:s.name,v:d.winTarget*s.mix*s.mktContrib}))
        .concat([{k:'Total',v:0,total:true}]),{h:200,dec:1})}</div></div>`;
  }

  if(UI.planTab==='bot'){
    h+=`<div class="kpis">${c.map((g,i)=>`<div class="kpi ${i===c.length-1?'hl':''}">
      <div class="k">${esc(g.name)}</div><div class="kpi-v">${F.n(bot[g.id],i===c.length-1?1:0)}</div>
      <div class="sub">${i===0?'entered':F.p(rateOf(g,m),1)+' in'}</div></div>`).join('')}</div>`;
    h+=`<div class="grid g-1-2"><div class="card"><h3>Entry volume by stream</h3><div class="bd">
      <div class="f"><label>Total ${esc(entryGate().name)} available</label>
        <input class="in v" value="${d.bottomUpLeads}" ${readOnly()?'disabled':''} onchange="SET('drivers.bottomUpLeads',this.value,{type:'num'})"></div>
      ${S().map(s=>`<div class="f"><label>${esc(s.name)}</label>
        <input class="in v" value="${Math.round(d.bottomUpLeads*s.mix)}" disabled>
        <span class="hint">${F.p(s.mix,0)} of entry volume · derived from stream mix</span></div>`).join('')}
      </div></div>
      <div class="card"><h3>What that entry volume delivers</h3><div class="bd">
        ${svgFunnel(c.map(g=>bot[g.id]),c.map(g=>g.name),560)}
        <div class="dv"></div>
        <table><thead><tr><th>Stream</th>${gTh()}<th class="n">Mktg wins</th><th class="n">ACV</th></tr></thead><tbody>
        ${S().map(s=>{const v=forward(d.bottomUpLeads*s.mix,m);
          return `<tr><td class="lb">${esc(s.name)}</td>${gTd(v,1)}
            <td class="n calc">${F.n(v[exitGate().id]*s.mktContrib,1)}</td>
            <td class="n calc">${F.mk(v[exitGate().id]*blendedDeal())}</td></tr>`;}).join('')}
        <tr class="tot"><td>Total</td>${gTd(forward(d.bottomUpLeads*streamMixTotal(),m),1)}
          <td class="n">${F.n(sum(S().map(s=>forward(d.bottomUpLeads*s.mix,m)[exitGate().id]*s.mktContrib)),1)}</td>
          <td class="n">${F.mk(forward(d.bottomUpLeads*streamMixTotal(),m)[exitGate().id]*blendedDeal())}</td></tr>
        </tbody></table></div></div></div>`;
    h+=`<div class="card"><h3>Marketing contribution build-up — bottom-up</h3><div class="bd">
      ${svgWaterfall(S().map(s=>({k:s.name,v:forward(d.bottomUpLeads*s.mix,m)[exitGate().id]*s.mktContrib}))
        .concat([{k:'Total',v:0,total:true}]),{h:200,dec:1})}
      <div class="mini" style="margin-top:6px">Same build-up as the top-down view (module 2, Top-down tab), computed from
        forward-derived wins instead of the win target — parity between the two directions, not just the same numbers.</div>
    </div></div>`;
  }

  if(UI.planTab==='streamcmp'){
    h+=`<div class="note"><strong>Both directions, one page, by stream.</strong> Top-down asks what each stream's share of the
      ${esc(exitGate().name)} target requires. Bottom-up asks what each stream's share of available ${esc(entryGate().name)} volume
      delivers. Put side by side, a stream that looks fine in Reconciliation's totals can still be badly out of balance here.</div>`;
    h+=`<div class="card"><h3>By stream — top-down vs bottom-up</h3><div class="bd flush"><table><thead><tr>
      <th>Stream</th><th class="n">Mix</th><th class="n">Top-down wins</th><th class="n">Top-down ACV</th>
      <th class="n">Bottom-up wins</th><th class="n">Bottom-up ACV</th><th class="n">Gap (wins)</th><th>Status</th></tr></thead><tbody>
      ${S().map(s=>{
        const tWins=d.winTarget*s.mix, tAcv=tWins*blendedDeal();
        const bVol=forward(d.bottomUpLeads*s.mix,m), bWins=bVol[exitGate().id], bAcv=bWins*blendedDeal();
        const gap=bWins-tWins, pc=tWins?gap/tWins:0;
        const st=Math.abs(pc)<0.1?'ok':Math.abs(pc)<0.25?'warn':'bad';
        return `<tr><td class="lb">${esc(s.name)}</td><td class="n">${F.p(s.mix,0)}</td>
          <td class="n calc">${F.n(tWins,1)}</td><td class="n calc">${F.mk(tAcv)}</td>
          <td class="n calc">${F.n(bWins,1)}</td><td class="n calc">${F.mk(bAcv)}</td>
          <td class="n" style="color:${gap<0?'var(--bad)':'var(--ok)'}">${F.n(gap,1)}</td>
          <td><span class="pill ${st}">${st==='ok'?'Balanced':st==='warn'?'Watch':'Imbalanced'}</span></td></tr>`;}).join('')}
      <tr class="tot"><td>Total</td><td class="n">${F.p(streamMixTotal(),0)}</td>
        <td class="n">${F.n(d.winTarget*streamMixTotal(),1)}</td><td class="n">${F.mk(d.winTarget*streamMixTotal()*blendedDeal())}</td>
        <td class="n">${F.n(bot[exitGate().id]*streamMixTotal(),1)}</td><td class="n">${F.mk(bot[exitGate().id]*streamMixTotal()*blendedDeal())}</td>
        <td class="n"></td><td></td></tr>
      </tbody></table></div></div>`;
    h+=`<div class="card"><h3>Wins by stream — both directions</h3><div class="bd">
      ${svgLines(S().map(s=>s.name),[
        {k:'Top-down',v:S().map(s=>d.winTarget*s.mix)},
        {k:'Bottom-up',v:S().map(s=>forward(d.bottomUpLeads*s.mix,m)[exitGate().id]),dash:true}],{h:220})}
      <div class="lgd"><span><i style="background:${SER[0]}"></i>Top-down</span><span><i style="background:${SER[1]}"></i>Bottom-up</span></div>
    </div></div>`;
  }

  if(UI.planTab==='rec'){
    const gapWin=bot[exitGate().id]-d.winTarget, gapPct=d.winTarget?gapWin/d.winTarget:0;
    const needed=top[entryGate().id], have=d.bottomUpLeads, entryGap=have-needed;
    h+=`<div class="note ${Math.abs(gapPct)<0.05?'g':'b'}"><strong>Reconciliation is a control, not a chart.</strong>
      Bottom-up delivers ${F.n(bot[exitGate().id],1)} ${esc(exitGate().name)} against a ${F.n(d.winTarget)} target —
      a gap of ${F.n(gapWin,1)} (${F.sp(gapPct,1)}). ${Math.abs(gapPct)<0.05?'Within the 5% tolerance.':'Outside tolerance. This must be closed or explained before publish.'}</div>`;
    h+=`<div class="kpis">
      <div class="kpi"><div class="k">${esc(entryGate().name)} required</div><div class="kpi-v">${F.n(needed)}</div><div class="sub">top-down</div></div>
      <div class="kpi"><div class="k">${esc(entryGate().name)} available</div><div class="kpi-v">${F.n(have)}</div><div class="sub">bottom-up</div></div>
      <div class="kpi ${entryGap<0?'':'hl'}"><div class="k">Entry gap</div><div class="kpi-v" style="color:${entryGap<0?'var(--bad)':'var(--ok)'}">${F.n(entryGap)}</div><div class="sub">${F.sp(needed?entryGap/needed:0,1)}</div></div>
      <div class="kpi"><div class="k">${esc(exitGate().name)} target</div><div class="kpi-v">${F.n(d.winTarget)}</div><div class="sub">top-down</div></div>
      <div class="kpi"><div class="k">${esc(exitGate().name)} delivered</div><div class="kpi-v">${F.n(bot[exitGate().id],1)}</div><div class="sub">bottom-up</div></div>
      <div class="kpi ${gapWin<0?'':'hl'}"><div class="k">${esc(exitGate().name)} gap</div><div class="kpi-v" style="color:${gapWin<0?'var(--bad)':'var(--ok)'}">${F.n(gapWin,1)}</div><div class="sub">${F.sp(gapPct,1)}</div></div>
    </div>`;
    h+=`<div class="card"><h3>Top-down vs bottom-up by gate</h3><div class="bd flush"><table><thead><tr>
      <th>Gate</th><th class="n">Top-down</th><th class="n">Bottom-up</th><th class="n">Gap</th><th class="n">Gap %</th><th>Status</th></tr></thead><tbody>
      ${c.map(g=>{const t=top[g.id],b=bot[g.id],gp=b-t,pc=t?gp/t:0;
        const st=Math.abs(pc)<0.05?'ok':Math.abs(pc)<0.2?'warn':'bad';
        return `<tr><td class="lb">${esc(g.name)}</td><td class="n calc">${F.n(t)}</td><td class="n calc">${F.n(b,1)}</td>
          <td class="n" style="color:${gp<0?'var(--bad)':'var(--ok)'}">${F.n(gp,1)}</td>
          <td class="n">${F.sp(pc,1)}</td><td><span class="pill ${st}">${st==='ok'?'In tolerance':st==='warn'?'Review':'Breach'}</span></td></tr>`;}).join('')}
      </tbody></table></div></div>`;
    h+=`<div class="card"><h3>Gate comparison</h3><div class="bd">
      ${svgLines(c.map(g=>g.name),[{k:'Top-down',v:c.map(g=>top[g.id])},{k:'Bottom-up',v:c.map(g=>bot[g.id]),dash:true}],{h:220})}
      <div class="lgd"><span><i style="background:${SER[0]}"></i>Top-down</span><span><i style="background:${SER[1]}"></i>Bottom-up</span></div>
    </div></div>`;
  }

  if(UI.planTab==='phase'){
    const gr=UI.grain, buckets = gr==='Month'?12:gr==='Quarter'?4:gr==='Half'?2:1;
    const idx=[]; for(let i=0;i<12;i++) idx.push(CFG.seasonality[i]);
    const grp=[];
    for(let b=0;b<buckets;b++){
      const per=12/buckets, sl=idx.slice(b*per,(b+1)*per);
      grp.push({k: gr==='Month'?new Date(2000,(CFG.time.fyStartMonth-1+b)%12,1).toLocaleDateString('en-AU',{month:'short'})
                  : gr==='Quarter'?'Q'+(b+1) : gr==='Half'?'H'+(b+1) : UI.fy,
                w: sum(sl)/12});
    }
    const tw=sum(grp.map(g=>g.w));
    h+=`<div class="note"><strong>Time phasing applies the seasonality index.</strong> Grain is <b>${gr}</b> —
      change it in the top bar. Volumes are phased, not divided evenly, and the lag column shows when the entry
      activity has to happen to land the win in that period.</div>`;
    h+=`<div class="card"><h3>Phased plan — ${esc(UI.fy)} · ${esc(gr)}</h3><div class="bd flush"><table><thead><tr>
      <th>Period</th><th class="n">Weight</th>${gTh()}<th class="n">ACV</th><th class="n">Entry lead-time</th></tr></thead><tbody>
      ${grp.map(p=>{const v=backward(d.winTarget*(p.w/tw),m);
        const lag=sum(chain().map(g=>CFG.velocity[g.id]||0));
        return `<tr><td class="lb">${esc(p.k)}</td><td class="n">${F.p(p.w/tw,1)}</td>${gTd(v)}
          <td class="n calc">${F.mk(d.winTarget*(p.w/tw)*blendedDeal())}</td>
          <td class="n calc">${lag} days</td></tr>`;}).join('')}
      <tr class="tot"><td>Total</td><td class="n">100%</td>${gTd(backward(d.winTarget,m))}
        <td class="n">${F.mk(d.winTarget*blendedDeal())}</td><td class="n"></td></tr>
      </tbody></table></div></div>`;
    h+=`<div class="card"><h3>Seasonality applied</h3><div class="bd">
      ${svgBars(grp.map(p=>({k:p.k,v:d.winTarget*(p.w/tw)})),{h:200,dec:1})}</div></div>`;
  }
  return h;
}

/* ============================================================================
   MODULE 3 — GEOGRAPHY & PODS
   ============================================================================ */
function pageGeo(){
  if(calcBlocked()) return blockedPanel('Geography & pods');
  const c=chain(),d=CFG.drivers,m=verMult()*segBlend(),vis=visibleRegions();
  const deal=blendedDeal();
  let h=`<div class="phead"><div><h1>Geography &amp; pods</h1>
    <p>Region and pod funnels, plus the gap between ACV target and the demand the funnel can actually produce.</p></div>
    <div class="sp"></div><span class="pill ${vis.length<R().length?'warn':'n'}">${vis.length} of ${R().length} regions visible to ${esc(user().name)}</span></div>`;
  if(vis.length<R().length) h+=`<div class="note w"><strong>Scope isolation active.</strong>
    ${esc(user().name)} is a ${esc(roleName())} with cross-region visibility off, so only
    ${vis.map(r=>esc(r.name)).join(', ')} resolves. Switch the Role selector to compare.</div>`;
  const totAe=sum(vis.map(r=>r.aeHeads)),totAcv=sum(vis.map(r=>r.acvTarget));
  h+=`<div class="kpis">
    <div class="kpi hl"><div class="k">ACV target</div><div class="kpi-v">${F.mk(totAcv)}</div><div class="sub">${vis.length} regions</div></div>
    <div class="kpi"><div class="k">Projected revenue</div><div class="kpi-v">${F.mk(d.projectedRevenue)}</div><div class="sub">driver</div></div>
    <div class="kpi"><div class="k">Variance</div><div class="kpi-v" style="color:${totAcv>d.projectedRevenue?'var(--bad)':'var(--ok)'}">${F.sp(d.projectedRevenue?(totAcv-d.projectedRevenue)/d.projectedRevenue:0,1)}</div><div class="sub">target vs projected</div></div>
    <div class="kpi"><div class="k">AE headcount</div><div class="kpi-v">${F.n(totAe)}</div><div class="sub">across scope</div></div>
    <div class="kpi"><div class="k">ACV per AE</div><div class="kpi-v">${F.mk(totAe?totAcv/totAe:0)}</div><div class="sub">quota implied</div></div>
    <div class="kpi"><div class="k">Wins needed</div><div class="kpi-v">${F.n(totAcv/deal,0)}</div><div class="sub">at ${F.mk(deal)} blended</div></div>
  </div>`;
  h+=`<div class="note"><strong>Sign convention.</strong> Variance is <em>(demand potential − ACV target) ÷ ACV target</em>.
    Negative means the funnel cannot produce the target — that is the risk case, shown red.
    The spreadsheet version had this the other way round.</div>`;
  h+=`<div class="card"><h3>Gap analysis by region</h3><div class="bd flush"><div class="scroll"><table><thead><tr>
    <th>Region</th><th class="n">AE</th><th class="n">ACV target</th><th class="n">Wins needed</th>
    ${gTh()}<th class="n">Demand potential</th><th class="n">Variance</th><th>Status</th></tr></thead><tbody>`;
  let acc={}; c.forEach(g=>acc[g.id]=0); let accPot=0;
  vis.forEach(r=>{
    const wins=r.acvTarget/deal, v=backward(wins,m);
    const pot=v[exitGate().id]*deal, varr=r.acvTarget?(pot-r.acvTarget)/r.acvTarget:0;
    c.forEach(g=>acc[g.id]+=v[g.id]); accPot+=pot;

/* ---- history resolution banner: never render zero and call it an actual ---- */
function histBanner(){
  const hc=histCoverage();
  if(hc.full&&!hc.orphaned.length) return '';
  if(hc.none) return `<div class="note b"><strong>Actuals cannot be read against this gate set.</strong>
    Stored history is keyed to <b>${hc.stored.map(esc).join(', ')}</b>; the configured chain is
    <b>${chain().map(g=>esc(g.id)).join(', ')}</b>. Nothing overlaps, so every figure below would read zero —
    which is not the same as "no wins". Remap the gate keys at source, or reload history, before trusting this page.</div>`;
  let s=`<div class="note w"><strong>Partial history coverage.</strong> `;
  if(hc.noHistory.length) s+=`No stored actuals for ${hc.noHistory.map(g=>'<b>'+esc(g.name)+'</b>').join(', ')} —
    ${hc.noHistory.length>1?'these gates':'this gate'} will read zero until history is loaded, and zero here means
    "not measured", not "none". `;
  if(hc.orphaned.length) s+=`${hc.orphaned.length} stored key${hc.orphaned.length>1?'s are':' is'} no longer in the chain
    (${hc.orphaned.map(esc).join(', ')}) — that volume is excluded from every total on this page. `;
  return s+`</div>`;
}
