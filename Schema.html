<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Process Maps — Process Maps & Workflows</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --nav:#3A5A8C; --nav-dk:#2B436A; --ink:#10182B; --ink-2:#45506B; --ink-3:#7C879E;
  --surface:#FFFFFF; --canvas:#F2F4F8; --canvas-2:#E9EDF4; --line:#DFE3EB; --line-2:#EEF1F6;
  --input:#7B3FE4; --input-bg:#F7F2FE; --calc:#45506B;
  --ok:#0E8A5F; --ok-bg:#E7F5EF; --warn:#C8791A; --warn-bg:#FDF4E7; --bad:#D0342C; --bad-bg:#FCEDEC;
  --r:8px; --r-sm:5px;
  --sh:0 1px 2px rgba(16,24,43,.05), 0 1px 3px rgba(16,24,43,.04);
  --sh-2:0 4px 16px rgba(16,24,43,.10);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans); background:var(--canvas); color:var(--ink); font-size:13.5px;}
.sp{flex:1}
.topnav{background:var(--surface); border-bottom:1px solid var(--line); min-height:56px; display:flex; align-items:center; padding:0 18px; gap:16px; position:sticky; top:0; z-index:50; box-shadow:var(--sh); flex-wrap:wrap;}
.tn-brand{display:flex; align-items:center; gap:9px; flex-shrink:0; padding:8px 0;}
.tn-mk{width:34px;height:34px;border-radius:8px;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex-shrink:0;}
.tn-brandtext{line-height:1.15}
.tn-name{font-weight:800; font-size:14.5px; color:var(--ink);}
.tn-sub{font-size:9px; letter-spacing:.08em; color:var(--ink-3); font-weight:700; text-transform:uppercase;}
.tn-links{display:flex; align-items:center; gap:2px; flex:1; overflow-x:auto; min-width:0;}
.tn-link{padding:7px 12px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--ink-2); text-decoration:none; white-space:nowrap; flex-shrink:0; display:inline-flex; align-items:center; gap:6px;}
.tn-link:hover{background:var(--canvas-2)}
.tn-link.on{background:var(--canvas-2); color:var(--ink); cursor:default;}
.tn-link .mk{width:16px;height:16px;border-radius:4px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:9px;flex-shrink:0;}
.tn-search{position:relative; flex-shrink:0;}
.tn-search .bx{display:flex; align-items:center; gap:6px; background:var(--canvas); border:1px solid var(--line); border-radius:7px; padding:6px 10px; width:190px;}
.tn-search input{border:none;background:transparent;outline:none;font-size:12.5px;flex:1;color:var(--ink); min-width:0;}
.tn-kbd{font-size:10px;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 5px;flex-shrink:0;}
.tn-results{position:absolute; top:calc(100% + 4px); left:0; width:260px; background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:var(--sh-2); z-index:60; max-height:320px; overflow-y:auto;}
.tn-results a{display:block; padding:8px 12px; text-decoration:none; color:var(--ink); font-size:12.5px; border-bottom:1px solid var(--line-2);}
.tn-results a:last-child{border-bottom:none}
.tn-results a:hover{background:var(--canvas-2)}
.tn-results .ty{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3); font-weight:700;}
.tn-results .none{padding:10px 12px; font-size:12px; color:var(--ink-3);}
.tn-acct{display:flex; align-items:center; gap:8px; flex-shrink:0; padding:8px 0;}
.tn-avatar{width:30px;height:30px;border-radius:50%;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;}
.tn-who{font-size:11.5px; line-height:1.3;}
.tn-who b{display:block; color:var(--ink); font-weight:700;}
.tn-who span{color:var(--ink-3);}
.tn-signout{font-size:10.5px; color:var(--ink-3); text-decoration:none;}
.tn-signout:hover{color:var(--ink)}
/* ---------- restored left-hand page nav (this tool's own pages) ---------- */
.wrap{display:flex; min-height:calc(100vh - 56px);}
.side{width:210px; background:var(--surface); border-right:1px solid var(--line); padding:10px 0; flex-shrink:0;}
.side h4{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); margin:14px 14px 6px;}
.navi{display:flex; align-items:center; gap:8px; padding:7px 14px; text-decoration:none; color:var(--ink-2); font-size:13px; border-left:3px solid transparent;}
.navi:hover{background:var(--canvas-2)}
.navi.on{background:var(--canvas-2);border-left-color:var(--nav);color:var(--ink);font-weight:700}
.navi .ix{width:16px; text-align:center; font-size:11px; color:var(--ink-3);}
.navi.on .ix{color:var(--nav)}
.main{flex:1; padding:18px 22px; max-width:1280px;}
.main.tight{padding:0; max-width:none;}
.phead{display:flex; align-items:flex-start; gap:14px; margin-bottom:14px;}
.phead h1{font-size:19px; margin:0 0 3px;}
.phead p{margin:0; color:var(--ink-2); font-size:12.5px; max-width:680px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); margin-bottom:14px; box-shadow:var(--sh);}
.card h3{display:flex; align-items:center; gap:8px; margin:0; padding:11px 14px; border-bottom:1px solid var(--line-2); font-size:13.5px;}
.card .bd{padding:14px;}
.card .bd.flush{padding:0;}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; padding:8px 10px; background:var(--canvas); color:var(--ink-2); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.02em;}
td{padding:6px 10px; border-bottom:1px solid var(--line-2); vertical-align:middle;}
td.n,th.n{text-align:right;}
.empty{padding:18px; text-align:center; color:var(--ink-3); font-size:12.5px;}
.mini{font-size:11.5px; color:var(--ink-3);}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px;}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:11px 13px;}
.kpi.hl{border-color:var(--nav); background:linear-gradient(180deg,#fff,rgba(58,90,140,.05));}
.kpi .k{font-size:11px; color:var(--ink-3); margin-bottom:3px;}
.kpi .kpi-v{font-size:19px; font-weight:800; font-variant-numeric:tabular-nums;}
.kpi.hl .kpi-v{color:var(--nav)}
.kpi .sub{font-size:11px; color:var(--ink-3); margin-top:2px;}
.row{display:flex; align-items:center; gap:6px;}
.btn{background:#fff; border:1px solid var(--line); border-radius:6px; padding:6px 11px; font-size:12.5px; cursor:pointer; color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; gap:5px;}
.btn:hover{background:var(--canvas-2)}
.btn.sm{padding:4px 9px; font-size:11.5px;}
.btn.pri{background:var(--nav);border-color:var(--nav);color:#fff}
.btn.pri:hover{background:var(--nav-dk)}
.btn.on{background:var(--nav);border-color:var(--nav);color:#fff}
.btn.dgr{color:var(--bad); border-color:#F3C9C6;}
.btn.dgr:hover{background:var(--bad-bg)}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:700; background:var(--canvas-2); color:var(--ink-2);}
.pill.n{background:var(--canvas-2); color:var(--ink-2);}
/* Shared status (RAG) pill -- same semantic scale + class names as the other tools
   (2026-08-13). */
.rag{display:inline-flex; align-items:center; gap:3px; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:700; white-space:nowrap;}
.rag-grey{background:#E7EAF0; color:#5B6472;}
.rag-blue{background:#E3E8FD; color:#1F3AC7;}
.rag-amber{background:#FBEBD3; color:#B5730E;}
.rag-red{background:#F8DEE0; color:#9C2B3C;}
.rag-green{background:#DCF3E9; color:#0E8A5F;}
.rag-exceed{color:#C9971A;}
.note{background:#EEF2F8;border-left:3px solid var(--nav);border-radius:0 var(--r-sm) var(--r-sm) 0; padding:10px 14px; margin-bottom:14px; font-size:12px; color:var(--ink-2);}
.in,input.in,select.in,.cel{border:1px solid #E1D3FA; border-radius:5px; padding:5px 7px; font-size:12.5px; background:var(--input-bg); color:var(--ink); font-family:inherit;}
.in:focus,.cel:focus{outline:2px solid var(--input); outline-offset:0;}
.cel.txt{width:100%;}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 16px; border-radius:20px; font-size:12.5px; box-shadow:var(--sh-2); z-index:200; animation:fade .2s ease;}
@keyframes fade{from{opacity:0; transform:translateX(-50%) translateY(6px)} to{opacity:1; transform:translateX(-50%) translateY(0)}}
.lbl{font-size:11px; color:var(--ink-3); font-weight:700; text-transform:uppercase; letter-spacing:.02em;}

.editor{display:flex; height:calc(100vh - 44px);}
.toolbar{display:flex; align-items:center; gap:6px; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap;}
.toolbar .dv{width:1px; height:22px; background:var(--line); margin:0 4px;}
.canvaswrap{flex:1; overflow:auto; background:
  linear-gradient(var(--line-2) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,var(--line-2) 1px,transparent 1px) 0 0/24px 24px,
  var(--canvas);}
svg.canvas{display:block; cursor:default;}
.node rect,.node polygon,.node ellipse{stroke:var(--nav); stroke-width:1.6; fill:#fff;}
.node.sel rect,.node.sel polygon,.node.sel ellipse{stroke:var(--bad); stroke-width:2.4;}
.node.pending rect,.node.pending polygon,.node.pending ellipse{stroke:var(--ok); stroke-dasharray:5,3;}
.node text{font-family:var(--sans); font-size:12px; fill:var(--ink); pointer-events:none;}
.node{cursor:grab;}
.edge path{stroke:var(--ink-2); stroke-width:1.6; fill:none;}
.edge.sel path{stroke:var(--bad); stroke-width:2.4;}
.edge text{font-family:var(--sans); font-size:11px; fill:var(--ink-2);}
.edge{cursor:pointer;}
.lane text{font-family:var(--sans); font-size:11px; fill:var(--ink-3);}
.inspector{width:260px; background:var(--surface); border-left:1px solid var(--line); padding:14px; flex-shrink:0; overflow-y:auto;}
.inspector h4{margin:0 0 10px; font-size:13px;}
.field{margin-bottom:12px;}
.field label{display:block; margin-bottom:4px;}
.authwrap{max-width:360px;margin:14vh auto;padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-2);}
.authwrap h2{margin:0 0 4px;font-size:18px;}
.authwrap p.sub{margin:0 0 20px;color:var(--ink-2);font-size:12.5px;}
.authwrap input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;margin-bottom:10px;box-sizing:border-box;}
.authwrap button{width:100%;padding:10px;border:none;border-radius:6px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;cursor:pointer;}
.authwrap .err{color:#B3261E;font-size:12px;margin:-4px 0 10px;min-height:14px;}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<div id="authGate" style="display:none"></div>
<div class="topnav" id="topnav">
  <div class="tn-brand"><span class="tn-mk">N</span><div class="tn-brandtext"><div class="tn-name">North</div><div class="tn-sub">v0.20</div></div></div>
  <nav class="tn-links" id="tnLinks"></nav>
  <div class="tn-search">
    <div class="bx"><input id="tnSearchInput" placeholder="Search modules..." oninput="tnSearch(this.value)" onkeydown="tnSearchKey(event)"><span class="tn-kbd">/</span></div>
    <div id="tnResults"></div>
  </div>
  <div class="tn-acct" id="tnAcct"></div>
  <script>document.addEventListener('click',function(e){var r=document.getElementById('tnResults');if(r&&!e.target.closest('.tn-search'))r.innerHTML='';});</script>
</div>
<div class="wrap" id="wrap">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>
<div id="layer"></div>
<script>
/* ============================================================================
   SCHEMA — high-level process-mapping / workflow-diagram tool. "Visio-style":
   boxes, decisions, arrows, drag to arrange, click-click to connect. No canvas
   library dependency (kept fully offline-capable) -- native SVG, hand-rolled
   drag and connect interactions.

   Data model is deliberately simple for v1: a workflow is just nodes[] (id, type,
   x, y, label) and edges[] (id, fromId, toId, label). Positions are plain numbers
   in SVG user-space, not tied to any layout engine, so a saved diagram always
   reopens exactly as arranged.

   Mouse-drag and click-to-connect are real UI interactions and can't be
   meaningfully exercised by the jsdom regression harness (no SVG geometry
   support there) -- so moveNodeTo(), addEdge(), etc. are implemented as plain,
   independently callable functions that both the mouse handlers AND the test
   harness call directly. That mirrors how every other module in this toolset is
   tested: call the state-mutating function, assert on CFG, not on pixels.

   Same Norma bridge pattern as every other module (tracking ID convention only --
   this tool doesn't track spend, so no cost-bucket import).

   Supabase note: workflows now live in the shared database (2026-08-11-supabase-schema-
   phase5-schema.sql) — lanes/nodes/edges stay as jsonb on the workflow row itself (matches
   the app's own "deliberately simple" data model, same choice Ordo made for snapshots.data).
   ============================================================================ */
const SUPABASE_URL = 'https://rcmocuubeajnqjltuwdv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjbW9jdXViZWFqbnFqbHR1d2R2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTgzNTQsImV4cCI6MjEwMTg5NDM1NH0.rZuoKPmmkpNe8Ug8Gu_KmpoKyibigJccdpoRGcLt3pY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const uid = _p => crypto.randomUUID();
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = (a,id) => a.find(x=>x.id===id);
/* Generic field setter, same shape as every other tool's setIn() -- Schema's
   diagram canvas has its own bespoke setters (renameWorkflow etc.) since node
   editing needs undo/redo support, but the flat Automations rows added in
   phase13 use this like a normal CRUD table. */
function setIn(field,id,key,val,type){
  const row=byId(CFG[field],id); if(!row)return;
  let v=val;
  if(type==='money'||type==='num'){ v=parseFloat(String(val).replace(/[$,\s]/g,'')); if(isNaN(v))v=0; }
  else if(type==='bool'){ v=!!val; }
  row[key]=v; logAudit('edit',field+'.'+key); render();
}
window.setIn=setIn;
const F = { dt:iso=>{ if(!iso)return '—'; return new Date(iso).toLocaleString('en-AU',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}); } };

const NODE_TYPES = {
  'start-end': {label:'Start / End', w:120, h:52},
  'process':   {label:'Process',     w:140, h:56},
  'decision':  {label:'Decision',    w:150, h:90}
};

/* ---------- data ----------
   Supabase-backed now — populated by loadFromSupabase() after sign-in. Empty shell here so
   nothing downstream needs to change; only the population source moved. */
const CFG = {};

const UI = { page:'home', workflowId:null, mode:'select', selKind:null, selId:null, connectFromId:null, zoom:1 };
let drag=null; /* {id,dx,dy} -- transient, not part of CFG */
let undoStack=[]; /* {nodes,edges} snapshots for the open workflow -- transient, not persisted */
const UNDO_LIMIT=25;

function logAudit(what,detail,targetUserIds){
  CFG.audit.unshift({ts:new Date().toISOString().slice(0,16).replace('T',' '),what:what,detail:detail,targetUserIds:targetUserIds||null});
  if(CFG.audit.length>150)CFG.audit.pop();
}
function toast(msg){
  const l=document.getElementById('layer');
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  l.appendChild(d); setTimeout(()=>d.remove(),2200);
}
function go(page){ UI.page=page; render(); }
window.go=go;
function currentWorkflow(){ return byId(CFG.workflows,UI.workflowId); }

/* ---------- local autosave (survives a refresh/close; export/import is still the
   portable, cross-tool bridge) ---------- */
const LS_KEY='schema_autosave_v1';
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(CFG)); }catch(e){} }
function loadLocal(){
  try{
    const raw=localStorage.getItem(LS_KEY); if(!raw) return false;
    const parsed=JSON.parse(raw);
    Object.keys(parsed).forEach(k=>{ CFG[k]=parsed[k]; });
    return true;
  }catch(e){ return false; }
}
function clearLocal(){
  localStorage.removeItem(LS_KEY);
  toast('Local autosave cleared — reload the page to reset to the built-in defaults.');
}
window.clearLocal=clearLocal;

/* ============================================================================
   Supabase data layer — whole-plan load/save, same pattern as every other tool.
   Workflows are Schema's only table; audit_log is shared.
   ============================================================================ */
let _orgId = null, _myProfile = null, _saveTimer = null, _realtimeChannel = null;
/* Set right before an internal (non-user-initiated) signOut() -- e.g. bootApp()'s error path
   below -- so the global onAuthStateChange listener knows to skip its reload-on-SIGNED_OUT and
   let the error message stay on screen instead of wiping it out immediately. Without this, the
   error flashes for a frame and then vanishes, which is exactly the "flash and it's gone" bug. */
let _skipNextSignOutReload = false;

async function upsertRows(table, rows, mapFn){
  if(!rows || !rows.length) return;
  try{
    const payload = rows.map(r=>Object.assign(mapFn(r), {org_id:_orgId}));
    const { error } = await sb.from(table).upsert(payload);
    if(error) throw error;
  }catch(e){ console.error('Save failed for '+table, e); toast('Could not save '+table+' to the database — see console.'); }
}

/* Fire-and-forget real delete, paired with upsertRows above. Called immediately after the
   local CFG array filter in every remove*() function so the UI stays instant while the row
   actually leaves the database (previously these were UPSERT-only, so removed rows silently
   reappeared on next load). Note: lanes/nodes/edges live inside a workflow's own jsonb
   columns, not separate tables, so removeLane/removeNode/removeEdge don't need this -- they
   persist correctly through the normal schema_workflows upsert. Only removeWorkflow,
   removeAutomation, and removeAgentDestination touch real standalone rows. */
async function deleteRow(table, id){
  if(!_orgId || !id) return;
  try{
    const { error } = await sb.from(table).delete().eq('id', id).eq('org_id', _orgId);
    if(error) throw error;
  }catch(e){ console.error('Delete failed for '+table, e); toast('Removed here, but could not delete from the database — see console.'); }
}

async function saveToSupabase(){
  if(!_orgId) return;
  await Promise.all([
    upsertRows('schema_workflows', CFG.workflows, w=>({
      id:w.id,name:w.name,description:w.description||'',updated_at:w.updatedAt||null,
      tracking_ref:w.trackingRef||null,lanes:w.lanes||[],nodes:w.nodes||[],edges:w.edges||[]
    })),
    upsertRows('schema_automations', CFG.automations, a=>({
      id:a.id,name:a.name||'',trigger_type:a.triggerType||'campaign_signoff_status',trigger_value:a.triggerValue||'',
      action_type:a.actionType||'log_note',action_message:a.actionMessage||'',enabled:!!a.enabled,
      action_target_agent:!!a.actionTargetAgent,fired_ids:a.firedIds||[],last_run_at:a.lastRunAt||null,
      action_target_type:a.actionTargetType||'org',action_target_ids:a.actionTargetIds||[]
    })),
    upsertRows('audit_log', CFG.audit, a=>({ts:a.ts,what:a.what,detail:a.detail,user_id:_myProfile?_myProfile.id:null,target_user_ids:a.targetUserIds||null})),
    upsertRows('agent_destinations', CFG.agentDestinations, d=>({
      id:d.id,name:d.name||'',type:d.type||'webhook',target:d.target||'',is_org_default:!!d.isOrgDefault
    })),
    upsertRows('agent_dispatches', CFG.agentDispatches, d=>({
      id:d.id,automation_id:d.automationId||null,brief:d.brief||'',destination_id:d.destinationId||null,
      destination_name:d.destinationName||'',status:d.status||'pending',result_detail:d.resultDetail||'',
      pushed_by:d.pushedBy||null,pushed_at:d.pushedAt||null
    }))
  ]);
}

function scheduleSupabaseSave(){
  if(!_orgId) return;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{ saveToSupabase(); }, 900);
}

async function loadFromSupabase(){
  const { data:{ user: authUser } } = await sb.auth.getUser();
  if(!authUser) throw new Error('Not signed in.');
  const { data: prof, error: profErr } = await sb.from('profiles')
    .select('id,name,org_id,role_id,region_ids,cross_region').eq('id', authUser.id).single();
  if(profErr || !prof){ const e = new Error('No profile linked yet.'); e.noProfile = true; throw e; }
  _myProfile = prof; _orgId = prof.org_id;

  const results = await Promise.all([
    sb.from('schema_workflows').select('id,name,description,updated_at,tracking_ref,lanes,nodes,edges'),
    sb.from('schema_automations').select('id,name,trigger_type,trigger_value,action_type,action_message,action_target_agent,enabled,fired_ids,last_run_at'),
    sb.from('campaigns').select('id,name,signoff_status'),
    sb.from('tasks').select('id,name,campaign_id,due_date,status'),
    sb.from('audit_log').select('ts,what,detail').order('ts',{ascending:false}).limit(200),
    sb.from('agent_destinations').select('id,name,type,target,is_org_default'),
    sb.from('agent_dispatches').select('id,automation_id,brief,destination_id,destination_name,status,result_detail,pushed_by,pushed_at,created_at').order('created_at',{ascending:false}).limit(200),

    sb.from('profiles').select('id,name,region_ids,cross_region'),

  CFG.evalTasks = (tasksR.data||[]).map(t=>({id:t.id,name:t.name,campaignId:t.campaign_id,dueDate:t.due_date||'',status:t.status||''}));
  CFG.audit = (auditR.data||[]).map(a=>({ts:a.ts,what:a.what,detail:a.detail}));
  CFG.agentDestinations = (agentDestR.data||[]).map(d=>({
    id:d.id,name:d.name||'',type:d.type||'webhook',target:d.target||'',isOrgDefault:!!d.is_org_default
  }));
  CFG.agentDispatches = (agentDispR.data||[]).map(d=>({

    destinationName:d.destination_name||'',status:d.status||'pending',resultDetail:d.result_detail||'',
    pushedBy:d.pushed_by,pushedAt:d.pushed_at,createdAt:d.created_at

/* Live notifications: subscribe to audit_log INSERTs for this org so an action
   taken in another tab/tool shows up here as a toast without a reload. Own
   actions are skipped (via user_id) since they're already toasted locally.
   This is notification-only -- it does NOT live-sync the underlying record
   (a campaign, a deal, etc); reload or navigate to see that reflected in place. */
function subscribeRealtime(){
  if(_realtimeChannel || !_orgId) return;
  _realtimeChannel = sb.channel('audit_log_org_'+_orgId)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'audit_log', filter:'org_id=eq.'+_orgId }, payload=>{
      const row = payload.new || {};
      if(_myProfile && row.user_id && row.user_id===_myProfile.id) return;
      /* phase18: a targeted alert_people row carries a resolved target_user_ids list --
         only toast a viewer whose own id is in it. Absent/empty (almost every row, and
         any 'org'-targeted alert) keeps the original broadcast-to-everyone behaviour. The
         row still joins the shared audit trail either way -- only the live toast is gated. */
      const targeted = Array.isArray(row.target_user_ids) && row.target_user_ids.length>0;
      const forMe = !targeted || (_myProfile && row.target_user_ids.includes(_myProfile.id));
      if(forMe) toast((row.what||'Update')+(row.detail?' — '+row.detail:''));
      if(CFG.audit){ CFG.audit.unshift({ts:row.ts,what:row.what,detail:row.detail}); if(CFG.audit.length>150) CFG.audit.pop(); }
      render();
    })
    .subscribe();
}

function pushUndo(){
  const w=currentWorkflow(); if(!w) return;
  undoStack.push(JSON.parse(JSON.stringify({nodes:w.nodes, edges:w.edges})));
  if(undoStack.length>UNDO_LIMIT) undoStack.shift();
}
function undo(){
  const w=currentWorkflow(); if(!w){ return; }
  if(!undoStack.length){ toast('Nothing to undo.'); return; }
  const snap=undoStack.pop();
  w.nodes=snap.nodes; w.edges=snap.edges;
  if(UI.selId && !byId(w.nodes,UI.selId) && !byId(w.edges,UI.selId)){ UI.selId=null; UI.selKind=null; }
  render();
}

/* ---------- export as a standalone SVG (colors inlined -- the page's CSS variables
   don't exist once this file is opened on its own) ---------- */
function exportDiagramSvg(){
  const w=currentWorkflow(); if(!w) return;
  const svgEl=document.getElementById('schemaCanvas'); if(!svgEl) return;
  const clone=svgEl.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const style=document.createElementNS('http://www.w3.org/2000/svg','style');
  style.textContent='.node rect,.node polygon,.node ellipse{stroke:#3A5A8C;stroke-width:1.6;fill:#fff;}'
    +'.node text{font-family:sans-serif;font-size:12px;fill:#10182B;}'
    +'.edge path{stroke:#45506B;stroke-width:1.6;fill:none;}'
    +'.edge text{font-family:sans-serif;font-size:11px;fill:#45506B;}'
    +'.lane rect{fill:none;stroke:#DFE3EB;stroke-dasharray:4,3;}'
    +'.lane text{font-family:sans-serif;font-size:11px;fill:#7C879E;}';
  clone.insertBefore(style, clone.firstChild);
  clone.querySelectorAll('marker path').forEach(p=>p.setAttribute('fill','#45506B'));
  let svgMarkup;
  try{ svgMarkup='<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n'+new XMLSerializer().serializeToString(clone); }
  catch(e){ svgMarkup=clone.outerHTML; }
  const blob=new Blob([svgMarkup],{type:'image/svg+xml'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(w.name||'diagram').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.svg';
  a.click();
  logAudit('export diagram as SVG',w.name);
  toast('Diagram exported as SVG.');
}

  if(data.trackingConfig){ CFG.trackingConfig=data.trackingConfig; CFG.trackingConfig.mySeq=CFG.trackingConfig.mySeq||{}; }
  if(data.configVersion!=null){ CFG.meta.normaConfigVersion=data.configVersion; }

function nextTrackingRef(type){
  const tc=CFG.trackingConfig; if(!tc) return null;
  const modCode=(tc.modCodes&&tc.modCodes.schema)||'SCH';
  const typeCode=(tc.typeCodes&&tc.typeCodes[type])||type.toUpperCase().slice(0,3);
  tc.mySeq=tc.mySeq||{};
  tc.mySeq[typeCode]=(tc.mySeq[typeCode]||0)+1;
  const seq=String(tc.mySeq[typeCode]).padStart(tc.seqPadding||4,'0');
  return tc.pattern.replace('{mod}',modCode).replace('{type}',typeCode).replace('{seq}',seq);
}

/* Resolves an automation's alert target down to a concrete list of user ids, or null
   for 'org' (today's broadcast-to-everyone behaviour, unchanged). Called at fire time,
   not at config time, so a region/team's membership as of right now is what's used --
   editing a team after the fact doesn't retroactively change who was alerted. */
function resolveTargetUserIds(a){
  const type=a.actionTargetType||'org';
  if(type==='org') return null;
  const ids=a.actionTargetIds||[];
  if(!ids.length) return [];
  if(type==='users') return ids.slice();
  if(type==='regions'){
    return (CFG.orgUsers||[]).filter(u=>u.crossRegion || (u.regionIds||[]).some(r=>ids.includes(r))).map(u=>u.id);
  }
  if(type==='teams'){
    const memberSet=new Set();
    (CFG.teams||[]).filter(t=>ids.includes(t.id)).forEach(t=>(t.memberIds||[]).forEach(uid=>memberSet.add(uid)));
    return Array.from(memberSet);
  }
  return null;
}
window.resolveTargetUserIds=resolveTargetUserIds;

function targetSummary(a){
  const type=a.actionTargetType||'org';
  if(type==='org') return 'Everyone';
  const ids=a.actionTargetIds||[];
  if(!ids.length) return 'Nobody selected yet';
  if(type==='users') return ids.map(id=>{ const u=byId(CFG.orgUsers,id); return u?u.name:'—'; }).join(', ');
  if(type==='regions') return ids.map(id=>{ const r=byId(CFG.orgRegions,id); return r?r.name:'—'; }).join(', ');
  if(type==='teams') return ids.map(id=>{ const t=byId(CFG.teams,id); return t?t.name:'—'; }).join(', ');
  return '—';
}
window.targetSummary=targetSummary;

function automationMatches(a){
  if(a.triggerType==='campaign_signoff_status'){
    return CFG.evalCampaigns.filter(c=>c.signoffStatus===a.triggerValue).map(c=>({id:'camp:'+c.id,label:c.name}));
  }
  if(a.triggerType==='task_overdue'){
    const today=new Date().toISOString().slice(0,10);
    return CFG.evalTasks.filter(t=>t.dueDate && t.dueDate<today && t.status!=='Completed').map(t=>({id:'task:'+t.id,label:t.name}));
  }
  return [];
}

/* Runs every enabled automation once: finds matches not already in firedIds,
   logs one audit_log entry per new match (which, since phase12, also toasts
   live to anyone with this org open), and records what fired so re-running
   doesn't repeat it. Returns how many new actions fired, across all rules. */
function runAutomations(){
  let totalFired=0;
  CFG.automations.forEach(a=>{
    if(!a.enabled) return;
    const matches=automationMatches(a);
    const newMatches=matches.filter(m=>!(a.firedIds||[]).includes(m.id));
    newMatches.forEach(m=>{
      let msg=a.actionMessage?a.actionMessage:('"'+a.name+'" matched: '+m.label);
      let targetUserIds=null;
      /* 'alert_people' rides the same realtime toast every audit_log row already gets
         (phase12), but as of phase18 it's resolved to a concrete list of user ids at
         fire time (see resolveTargetUserIds) and stamped onto the row. Every tool's
         realtime subscription only toasts a viewer whose id is in that list; 'org'
         (the default) resolves to null, which keeps the original broadcast-to-everyone
         behaviour exactly as it was. actionTargetAgent is a separate flag: it also
         drafts an Agent Brief, independent of who the human alert reaches. */
      if(a.actionType==='alert_people'){
        targetUserIds=resolveTargetUserIds(a);
        const targetNote = (a.actionTargetType&&a.actionTargetType!=='org') ? (' → '+targetSummary(a)) : '';
        msg='🔔 Alert: '+msg+targetNote+(a.actionTargetAgent?' (flagged for AI agent)':'');
        if(a.actionTargetAgent) createAgentDispatch(a,m);
      }
      logAudit('automation: '+a.name, msg, targetUserIds);
      a.firedIds=(a.firedIds||[]).concat(m.id);
      totalFired++;
    });
    a.lastRunAt=new Date().toISOString();
  });
  render();
  toast(totalFired ? totalFired+' automation action'+(totalFired===1?'':'s')+' fired.' : 'Ran checks — nothing new to fire.');
  return totalFired;
}
window.runAutomations=runAutomations;

/* ---------- Agent Brief system (2026-08-13, phase17) ----------
   When an alert_people automation with actionTargetAgent fires, this drafts a
   structured "Agent Brief" and files it as a pending dispatch. A person then picks
   a destination (pre-filled to the org default, if one's set) and clicks Push --
   for a webhook destination that's a direct POST from the browser, for a deep_link
   destination it opens the URL in a new tab and copies the brief to the clipboard
   (most agent apps have no way to accept a prefilled URL, so clipboard + open is the
   honest fallback). Every attempt is logged to agent_dispatches with a status, so
   Norma's Agent Activity dashboard has something real to show. */
function generateAgentBrief(a,m){
  return ['Agent Brief','============',
    'Automation: '+a.name,

/* Real push. Webhook: a direct cross-origin POST from the browser -- if the receiver
   doesn't allow that, this fails with a CORS error and gets logged as a failure (see
   the phase17 SQL migration note; a server-side relay is the fix if that turns out to
   matter for what Stef actually pushes to). Deep-link: no reliable way to hand a long
   brief to an arbitrary external app via URL, so this copies it to the clipboard and
   opens the destination, and counts that hand-off as success. */
async function pushAgentDispatch(dispatchId){
  const d=byId(CFG.agentDispatches,dispatchId); if(!d)return;
  const dest=byId(CFG.agentDestinations,d.destinationId);
  if(!dest){ toast('Pick a destination first.'); return; }
  d.pushedBy=_myProfile?_myProfile.id:null; d.pushedAt=new Date().toISOString();
  if(dest.type==='deep_link'){
    try{
      if(typeof navigator!=='undefined' && navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(d.brief);
      if(typeof window!=='undefined' && window.open) window.open(dest.target,'_blank');
      d.status='success'; d.resultDetail='Opened '+dest.target+' — brief copied to clipboard.';
    }catch(e){ d.status='failure'; d.resultDetail='Could not open destination: '+e.message; }
    logAudit('agent dispatch pushed',d.destinationName+' — '+d.status); render(); return;
  }
  try{
    const res=await fetch(dest.target,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({brief:d.brief,automationId:d.automationId,orgId:_orgId,pushedAt:d.pushedAt})});
    d.status = res.ok ? 'success' : 'failure';
    d.resultDetail = 'HTTP '+res.status+(res.ok?'':' — receiving service reported an error');
  }catch(e){
    d.status='failure';
    d.resultDetail='Request failed — likely blocked by CORS, or the destination is unreachable: '+e.message;
  }
  logAudit('agent dispatch pushed',d.destinationName+' — '+d.status); render();
}
window.pushAgentDispatch=pushAgentDispatch;

function edgePath(w,e){
  const a=byId(w.nodes,e.fromId), b=byId(w.nodes,e.toId);
  if(!a||!b) return {d:'',mx:0,my:0};
  const defA=NODE_TYPES[a.type]||NODE_TYPES.process, defB=NODE_TYPES[b.type]||NODE_TYPES.process;
  const ax=a.x+defA.w/2, ay=a.y+defA.h/2, bx=b.x+defB.w/2, by=b.y+defB.h/2;
  const mx=(ax+bx)/2, my=(ay+by)/2;
  return {d:`M ${ax} ${ay} L ${bx} ${by}`, mx, my};
}
function renderNode(w,n){
  const def=NODE_TYPES[n.type]||NODE_TYPES.process;
  const cls='node'+(UI.selKind==='node'&&UI.selId===n.id?' sel':'')+(UI.connectFromId===n.id?' pending':'');
  let shape;
  if(n.type==='decision'){
    const cx=def.w/2, cy=def.h/2;
    shape=`<polygon points="${cx},0 ${def.w},${cy} ${cx},${def.h} 0,${cy}"></polygon>`;
  } else if(n.type==='start-end'){
    shape=`<ellipse cx="${def.w/2}" cy="${def.h/2}" rx="${def.w/2}" ry="${def.h/2}"></ellipse>`;
  } else {
    shape=`<rect width="${def.w}" height="${def.h}" rx="8"></rect>`;
  }
  const hasAction = n.actionType && n.actionType!=='none';
  return `<g class="${cls}" transform="translate(${n.x},${n.y})" onmousedown="nodeMouseDown(event,'${n.id}')">
    ${shape}

}
function renderEdge(w,e){

  return `<g class="${cls}" onmousedown="edgeClicked('${e.id}')">

    ${e.label?`<text x="${p.mx}" y="${p.my-6}" text-anchor="middle">${esc(e.label)}</text>`:''}
  </g>`;
}
function renderCanvasOnly(){

/* ---------- shared status (RAG) colour system ----------
   Same semantic scale + class names as the other tools (2026-08-13). Workflows don't
   have a lifecycle status field, so this is structurally derived from the diagram
   itself: an empty canvas is grey, multiple nodes with no connectors at all is amber
   (a real, meaningful "this diagram isn't wired up yet" signal), every node reachable
   by at least one connector is green, anything in between is blue. No "exceeding" star
   here -- there's no plan/actual pair for a diagram to beat. */
function ragForWorkflow(w){
  const nodes=w.nodes||[], edges=w.edges||[];
  if(!nodes.length) return {tone:'grey',label:'Empty'};
  if(nodes.length>1 && !edges.length) return {tone:'amber',label:'Disconnected'};
  const connected=new Set();
  edges.forEach(e=>{ connected.add(e.fromId); connected.add(e.toId); });
  const allConnected = nodes.length===1 || nodes.every(n=>connected.has(n.id));
  return allConnected ? {tone:'green',label:'Connected'} : {tone:'blue',label:'Partially connected'};
}
function ragPillHtml(rag){
  return `<span class="rag rag-${rag.tone}">${esc(rag.label)}${rag.exceed?' <span class="rag-exceed">★</span>':''}</span>`;
}

function renderLanes(w){
  return (w.lanes||[]).map((l,i)=>`<g class="lane">
    <rect x="0" y="${l.y}" width="4000" height="${l.height}" fill="${i%2===0?'rgba(58,90,140,0.04)':'rgba(58,90,140,0.08)'}"></rect>

}
function pageEditor(){
  const w=currentWorkflow();
  if(!w) return `<div class="empty">Diagram not found.</div><a class="btn" href="#" onclick="go('list');return false">← Back to diagrams</a>`;
  const sel = UI.selKind==='node' ? byId(w.nodes,UI.selId) : (UI.selKind==='edge' ? byId(w.edges,UI.selId) : null);
  const lanes=w.lanes||[];
  let inspector='';
  if(UI.selKind==='node' && sel){
    const nType=sel.actionType||'none';
    let nTargetHtml='';
    if(nType==='alert_people'){
      const nTargetType=sel.actionTargetType||'org';
      const nOptionsHtml = nTargetType==='users'
        ? (CFG.orgUsers||[]).map(u=>`<label style="display:block"><input type="checkbox" ${(sel.actionTargetIds||[]).includes(u.id)?'checked':''} onchange="toggleNodeActionTargetId('${sel.id}','${u.id}')"> ${esc(u.name)}</label>`).join('')
        : nTargetType==='regions'
        ? (CFG.orgRegions||[]).map(r=>`<label style="display:block"><input type="checkbox" ${(sel.actionTargetIds||[]).includes(r.id)?'checked':''} onchange="toggleNodeActionTargetId('${sel.id}','${r.id}')"> ${esc(r.name)}</label>`).join('')
        : nTargetType==='teams'
        ? (CFG.teams||[]).map(t=>`<label style="display:block"><input type="checkbox" ${(sel.actionTargetIds||[]).includes(t.id)?'checked':''} onchange="toggleNodeActionTargetId('${sel.id}','${t.id}')"> ${esc(t.name)}</label>`).join('')
        : '';
      nTargetHtml=`<div class="field"><label class="lbl">Alert target</label>
        <select class="cel txt" onchange="setNodeActionTargetType('${sel.id}',this.value)">
          <option value="org" ${nTargetType==='org'?'selected':''}>Everyone</option>
          <option value="users" ${nTargetType==='users'?'selected':''}>Specific people</option>
          <option value="regions" ${nTargetType==='regions'?'selected':''}>Region</option>
          <option value="teams" ${nTargetType==='teams'?'selected':''}>Team</option>
        </select>
        ${nTargetType==='org'?'':`<div class="mini" style="max-height:90px;overflow:auto;margin-top:4px;border:1px solid var(--line-2);padding:4px;border-radius:4px">
          ${nOptionsHtml||'<span class="mini">none configured</span>'}</div>`}
        <div class="mini" style="margin-top:2px;color:var(--ink-2)">${esc(targetSummary(sel))}</div></div>
        <div class="field"><label><input type="checkbox" ${sel.actionTargetAgent?'checked':''} onchange="setNodeActionTargetAgent('${sel.id}',this.checked)"> Also draft an Agent Brief</label></div>`;
    }
    inspector=`<h4>Node</h4>
      <div class="field"><label class="lbl">Label</label><input class="cel txt" value="${esc(sel.label)}" onchange="setNodeLabel('${sel.id}',this.value)"></div>
      <div class="field"><label class="lbl">Type</label><div class="mini">${esc(NODE_TYPES[sel.type].label)}</div></div>
      <div class="field"><label class="lbl">Position</label><div class="mini">x ${sel.x}, y ${sel.y}</div></div>
      <div class="field"><label class="lbl">Lane</label><select class="cel txt" onchange="setNodeLane('${sel.id}',this.value)">
        <option value="">— none —</option>
        ${lanes.map(l=>`<option value="${l.id}" ${l.id===sel.laneId?'selected':''}>${esc(l.name)}</option>`).join('')}
      </select></div>
      <div class="dv"></div>
      <h4>Action <span class="mini">— run manually, not on a trigger</span></h4>
      <div class="field"><label class="lbl">On "Run action"</label><select class="cel txt" onchange="setNodeActionType('${sel.id}',this.value)">
        <option value="none" ${nType==='none'?'selected':''}>Nothing</option>
        <option value="log_note" ${nType==='log_note'?'selected':''}>Log a note</option>
        <option value="alert_people" ${nType==='alert_people'?'selected':''}>Alert people</option>
      </select></div>
      ${nType!=='none'?`<div class="field"><label class="lbl">Message</label><input class="cel txt" placeholder="default message" value="${esc(sel.actionMessage||'')}" onchange="setNodeActionMessage('${sel.id}',this.value)"></div>`:''}
      ${nTargetHtml}
      ${nType!=='none'?`<button class="btn sm pri" onclick="runNodeAction('${sel.id}')">▶ Run action</button>`:''}
      <div class="dv"></div>
      <button class="btn sm dgr" onclick="deleteSelected()">Delete node</button>`;
  } else if(UI.selKind==='edge' && sel){
    inspector=`<h4>Connector</h4>
      <div class="field"><label class="lbl">Label</label><input class="cel txt" placeholder="e.g. Yes / No" value="${esc(sel.label)}" onchange="setEdgeLabel('${sel.id}',this.value)"></div>
      <button class="btn sm dgr" onclick="deleteSelected()">Delete connector</button>`;
  } else {
    inspector=`<h4>Nothing selected</h4><p class="mini">Click a node or connector to edit it. In Connect mode, click one node then another to draw an arrow between them.</p>
      <div class="dv"></div>
      <h4>Lanes</h4>
      ${lanes.length?lanes.map(l=>`<div class="field"><div class="row">
        <input class="cel txt" style="width:130px" value="${esc(l.name)}" onchange="setLane('${l.id}','name',this.value)">
        <button class="btn sm dgr" onclick="removeLane('${l.id}')">✕</button></div>
        <div class="mini row" style="margin-top:4px">y <input class="cel" style="width:50px" value="${l.y}" onchange="setLane('${l.id}','y',this.value)">
        h <input class="cel" style="width:50px" value="${l.height}" onchange="setLane('${l.id}','height',this.value)"></div></div>`).join(''):'<p class="mini">No lanes yet.</p>'}
      <button class="btn sm" onclick="addLane()">Add lane</button>`;
  }
  const w0=Math.max(900, ...w.nodes.map(n=>n.x+220), ...lanes.map(()=>0));
  const h0=Math.max(500, ...w.nodes.map(n=>n.y+180), ...lanes.map(l=>l.y+l.height+20));
  const zoom=UI.zoom||1;
  let html=`<div class="editor">
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      <div class="toolbar">
        <a class="btn sm" href="#" onclick="go('list');return false">← Diagrams</a>
        <div class="dv"></div>

        <button class="btn sm" onclick="addNode('decision')">+ Decision</button>

        <div class="dv"></div>
        <button class="btn sm ${UI.mode==='select'?'on':''}" onclick="setMode('select')">Select</button>
        <button class="btn sm ${UI.mode==='connect'?'on':''}" onclick="setMode('connect')">Connect${UI.mode==='connect'&&UI.connectFromId?' (pick target)':''}</button>
        <div class="dv"></div>
        <button class="btn sm" onclick="undo()" ${undoStack.length?'':'disabled'} title="Ctrl/Cmd+Z">Undo</button>

      </div>
      <div class="canvaswrap">
        <svg class="canvas" id="schemaCanvas" xmlns="http://www.w3.org/2000/svg" width="${w0*zoom}" height="${h0*zoom}" onmousedown="canvasBackgroundClicked()">
          <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="var(--ink-2)"></path></marker></defs>
          <g id="zoomLayer" transform="scale(${zoom})">
            <g id="lanesLayer">${renderLanes(w)}</g>
            <g id="edgesLayer">${w.edges.map(e=>renderEdge(w,e)).join('')}</g>
            <g id="nodesLayer">${w.nodes.map(n=>renderNode(w,n)).join('')}</g>
          </g>
        </svg>
      </div>
    </div>
    <div class="inspector">${inspector}</div>
  </div>`;
  return html;
}

  {id:'Cursus',label:'Campaign Planning',desc:'Campaign & activity execution',color:'#0E7C6B',icon:'Ca'},
  {id:'Eventus',label:'Events',desc:'Event planning & logistics',color:'#B5480E',icon:'Ev'},
  {id:'Custodia',label:'Assets',desc:'Asset register',color:'#3B6E1F',icon:'As'},

const THIS_MODULE='Schema';
function renderTnModuleLinks(){
  return MODULES.map(m=>m.id===THIS_MODULE
    ? `<span class="tn-link on"><span class="mk" style="background:${m.color}">${m.icon}</span>${m.label}</span>`

  ).join('');
}
function tnSearchResults(q){
  q=(q||'').trim().toLowerCase(); if(!q) return [];
  return MODULES.filter(m=>m.label.toLowerCase().includes(q)||m.desc.toLowerCase().includes(q)).slice(0,8);
}
let _tnResultList=[];
function tnSearch(q){
  _tnResultList=tnSearchResults(q);
  const box=document.getElementById('tnResults');
  if(!q||!q.trim()){ box.innerHTML=''; return; }
  box.innerHTML = `<div class="tn-results">${
    _tnResultList.length ? _tnResultList.map((m,i)=>`<a href="#" onclick="tnPick(${i});return false"><span class="ty">Module</span><div>${esc(m.label)}</div></a>`).join('')
    : '<div class="none">No matches.</div>'
  }</div>`;
}
window.tnSearch=tnSearch;
function tnPick(i){
  const m=_tnResultList[i]; if(!m) return;
  window.open(m.id+'.html','tool_'+m.id);
  document.getElementById('tnResults').innerHTML='';
  document.getElementById('tnSearchInput').value='';
}
window.tnPick=tnPick;
function tnSearchKey(ev){
  if(ev.key==='Enter' && _tnResultList.length){ tnPick(0); }
  if(ev.key==='Escape'){ document.getElementById('tnResults').innerHTML=''; ev.target.blur(); }
}
window.tnSearchKey=tnSearchKey;
function render(){
  const side=document.getElementById('side'), main=document.getElementById('main');
  document.getElementById('tnLinks').innerHTML=renderTnModuleLinks();
  document.getElementById('tnAcct').innerHTML=renderTnAcct();
  side.innerHTML=renderSide();
  side.style.display=UI.page==='editor'?'none':'';
  if(UI.page==='editor'){
    main.className='main tight'; main.innerHTML=pageEditor();
  } else if(UI.page==='automations'){
    main.className='main'; main.innerHTML=pageAutomations();
  } else if(UI.page==='home'){
    main.className='main'; main.innerHTML=pageHome();
  } else {
    main.className='main'; main.innerHTML=pageList();
  }
  saveLocal();
  scheduleSupabaseSave();
}
sb.auth.onAuthStateChange((event)=>{
  if(event==='SIGNED_OUT'){
    if(_skipNextSignOutReload){ _skipNextSignOutReload=false; return; }
    location.reload();
  }
});
bootApp();
